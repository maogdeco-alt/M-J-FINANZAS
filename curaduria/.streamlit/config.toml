# Configuración de la app. Sirve igual para el PC de la sustanciadora y para
# el equipo que haga de servidor en la red de la oficina.

[server]
headless = true
port = 8501
# 0.0.0.0 escucha también en la red local. Cambie a 127.0.0.1 si quiere que
# la app solo se vea en el propio equipo.
address = "0.0.0.0"
maxUploadSize = 25

[browser]
# Nada de telemetría: los datos no salen de la oficina.
gatherUsageStats = false

[theme]
# Los colores salen del logo de la Curaduría Urbana No. 2 de Ibagué.
base = "light"
primaryColor = "#BC2025"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#1A1A1A"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"
