<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J&amp;M · Cuentas</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>

:root{
--negro:#0A0A0B;--tinta:#0A0A0B;--gris:#8A8A93;--gris2:#5C5C64;
--linea:#EAEAEE;--papel:#F5F5F6;--hueso:#FFFFFF;
--rosa:#F9C7D8;--rosa-suave:#FDEEF4;--rosa-fuerte:#D4577F;
--malaquita:var(--tinta);--granate:var(--rosa-fuerte);--laton:var(--rosa-fuerte);--verde:var(--tinta);
--r:20px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--negro);
font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',monospace;font-variant-numeric:tabular-nums;
font-weight:300;letter-spacing:-.045em}
.dsp{font-family:'Bricolage Grotesque','Inter Tight',sans-serif;font-weight:700;letter-spacing:-.035em}
:focus-visible{outline:2px solid var(--rosa-fuerte);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- monograma ---- */
.mark{display:flex;align-items:center;gap:11px}
.seal{width:34px;height:34px;border-radius:11px;background:var(--negro);color:#fff;display:flex;
align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
font-size:12px;letter-spacing:-.04em;flex:none}
.seal em{font-style:normal;color:var(--rosa);margin:0 .5px}
.mark .nm{line-height:1.1}
.mark .nm b{display:block;font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.mark .nm span{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);margin-top:2px}

/* ---- estructura ---- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,245,246,.86);backdrop-filter:blur(16px) saturate(1.4)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;max-width:1180px;margin:0 auto}
.saldo{text-align:right;line-height:1.1}
.saldo b{font-family:'JetBrains Mono',monospace;font-weight:300;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
.saldo span{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris);margin-top:2px}
.scopes{display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.scopes::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linea);background:#fff;color:var(--gris2);padding:7px 15px;border-radius:999px;
font-size:12.5px;font-weight:500;white-space:nowrap;transition:.18s}
.chip[aria-pressed="true"]{background:var(--negro);border-color:var(--negro);color:#fff}
.chip.sm{padding:6px 12px;font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 0 104px}
.rail{display:none}
.screen{padding:16px 18px}
@media(min-width:900px){
.wrap{display:grid;grid-template-columns:216px 1fr;padding-bottom:0}
.rail{display:block;padding:20px 12px;min-height:70vh}
.navbar{display:none}.screen{padding:22px 30px 90px}}
.rail button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
padding:10px 13px;border-radius:12px;color:var(--gris);font-size:14px;font-weight:500}
.rail button[aria-current="true"]{background:#fff;color:var(--negro);box-shadow:0 1px 2px rgba(10,10,11,.05)}
.rail-t{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);font-weight:600;
margin:16px 13px 6px;padding-top:14px;border-top:1px solid var(--linea)}
.rail-t:first-child{margin-top:0;padding-top:0;border-top:0}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:rgba(255,255,255,.94);
backdrop-filter:blur(18px);border-top:1px solid var(--linea);padding:7px 2px calc(7px + env(safe-area-inset-bottom))}
.navbar button{flex:1;background:none;border:0;padding:5px 2px;color:#B4B4BC;display:flex;flex-direction:column;
align-items:center;gap:4px;font-size:9px;letter-spacing:.03em;font-weight:500}
.navbar button[aria-current="true"]{color:var(--negro)}
.navbar .ico{font-size:15px;line-height:1}

/* ---- hero ---- */
.hero{background:var(--negro);color:#fff;border-radius:26px;padding:24px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(110% 80% at 92% -20%,rgba(249,199,216,.22),transparent 60%);pointer-events:none}
.wm{position:absolute;right:-10px;bottom:-34px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
font-size:132px;line-height:1;letter-spacing:-.06em;color:rgba(249,199,216,.07);pointer-events:none;user-select:none}
.hero-lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--rosa);position:relative;z-index:1;font-weight:500}
.hero-frase{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(20px,5.4vw,27px);
line-height:1.2;letter-spacing:-.035em;margin:10px 0 22px;max-width:22ch;position:relative;z-index:1}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;position:relative;z-index:1}
.trio>div{border-top:1px solid rgba(255,255,255,.14);padding-top:11px}
.trio .k{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.42);font-weight:500}
.trio .v{font-size:clamp(16px,4.6vw,23px);margin-top:4px}
.pos{color:var(--rosa)}.neg{color:#fff;opacity:.55}
.regla{margin-top:24px;position:relative;z-index:1}
.rt{position:relative;height:38px;border-radius:12px;background:rgba(255,255,255,.06);overflow:hidden}
.rf{position:absolute;top:0;bottom:0;background:var(--rosa);transition:width .55s cubic-bezier(.2,.8,.2,1),left .55s}
.tk{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)}
.rh{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.rm{display:grid;grid-template-columns:repeat(12,1fr);margin-top:8px;font-size:9px;letter-spacing:.04em;
color:rgba(255,255,255,.35);text-align:center;font-weight:500}
.rm .now{color:var(--rosa)}

/* ---- tarjetas ---- */
.grid{display:grid;gap:12px;margin-top:14px}
@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--hueso);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.01em}
.card .sub{font-size:11.5px;color:var(--gris);margin:0 0 14px}
.big{font-size:clamp(24px,6.6vw,32px);letter-spacing:-.05em}
.mini{font-size:11px;color:var(--gris);margin-top:8px;line-height:1.45}
.sect{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:28px 0 10px}
.sect h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:23px;letter-spacing:-.04em;margin:0}
.sect p{margin:3px 0 0;font-size:11px;color:var(--gris);letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--linea)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11px;color:var(--gris);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:14px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.badge{font-size:9.5px;letter-spacing:.05em;padding:4px 9px;border-radius:999px;font-weight:600;white-space:nowrap;text-transform:uppercase}
.b-ok{background:#F2F2F4;color:#9A9AA2}
.b-pron{background:var(--rosa-suave);color:var(--rosa-fuerte)}
.b-mal{background:var(--negro);color:#fff}
.b-neu{background:transparent;color:#B4B4BC;box-shadow:inset 0 0 0 1px var(--linea)}
.btn{border:0;border-radius:999px;padding:11px 18px;font-size:13.5px;font-weight:600;background:var(--negro);color:#fff;letter-spacing:-.01em}
.btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--linea);color:var(--negro)}
.btn.sm{padding:8px 14px;font-size:12px}
.btn.danger{background:var(--rosa-suave);color:var(--rosa-fuerte);box-shadow:none}
.btn[disabled]{opacity:.25}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:41;background:var(--negro);
color:#fff;border:0;border-radius:999px;padding:15px 22px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
box-shadow:0 8px 30px rgba(10,10,11,.3)}
@media(min-width:900px){.fab{bottom:28px;right:30px}}
.bar{height:5px;border-radius:3px;background:#F0F0F2;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--rosa);border-radius:3px;transition:width .5s}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-size:13px;border-bottom:1px solid var(--linea)}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--gris)}
.kv b{font-weight:400}
.note{background:var(--rosa-suave);border-radius:14px;padding:12px 14px;font-size:11.5px;color:var(--rosa-fuerte);line-height:1.55}
.empty{text-align:center;padding:30px 14px;color:var(--gris)}
.empty p{margin:0 0 12px;font-size:13px}

/* ---- hoja ---- */
.veil{position:fixed;inset:0;background:rgba(10,10,11,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
@media(min-width:720px){.veil{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
border-radius:28px 28px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom))}
@media(min-width:720px){.sheet{border-radius:26px;padding-bottom:24px}}
.sheet h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.04em;margin:0 0 18px}
.f{margin-bottom:16px}
.f>label{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris);margin-bottom:8px;font-weight:500}
.inp{width:100%;padding:13px 14px;border:0;box-shadow:inset 0 0 0 1px var(--linea);border-radius:14px;background:#FAFAFB;color:var(--negro)}
.inp.money{font-family:'JetBrains Mono',monospace;font-weight:300;font-size:28px;padding:16px 14px;letter-spacing:-.05em}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;background:#F2F2F4;border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gris)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--negro);box-shadow:0 1px 3px rgba(10,10,11,.09)}
.acc{display:flex;gap:8px;margin-top:8px}.acc .btn{flex:1;padding:14px}
.hint{background:none;border:0;color:var(--gris);font-size:10.5px;text-decoration:underline;padding:0;margin-top:10px;letter-spacing:.01em}

/* ---- portal ---- */
.portal{max-width:960px;margin:0 auto;padding:44px 20px 60px}
.p-head{text-align:center;margin-bottom:34px}
.seal.big{width:52px;height:52px;border-radius:17px;font-size:17px;margin:0 auto 20px}
.p-head h1{font-size:clamp(38px,11vw,64px);letter-spacing:-.05em;margin:0;text-transform:uppercase;line-height:.95}
.p-head p{color:var(--gris);font-size:13px;margin:12px auto 0;max-width:30ch;line-height:1.5}
.pgrid{display:grid;gap:12px}
@media(min-width:760px){.pgrid{grid-template-columns:1fr 1fr 1fr}}
.pcard{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:0;background:#fff;border:0;
border-radius:24px;padding:22px;min-height:180px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(10,10,11,.09)}
.pcard-casa{background:var(--negro);color:#fff}
@media(min-width:760px){.pcard-casa{grid-column:1/-1;min-height:170px}}
.pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
.pc-tag{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);font-weight:600}
.pcard-casa .pc-tag{color:var(--rosa)}
.pc-lock{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rosa-fuerte);
background:var(--rosa-suave);padding:4px 9px;border-radius:999px;font-weight:600}
.pc-nom{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:30px;letter-spacing:-.045em;margin-top:26px}
.pc-num{font-size:20px;margin-top:6px;color:var(--gris2)}
.pcard-casa .pc-num{color:var(--rosa)}
.pc-pie{font-size:11px;color:var(--gris);margin-top:10px}
.pcard-casa .pc-pie{color:rgba(255,255,255,.45)}
.p-pie{text-align:center;margin-top:26px}

/* ---- clave ---- */
.pinwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.pin-in{width:100%;max-width:300px;text-align:center}
.pin-in h2{font-size:24px;letter-spacing:-.04em;margin:0 0 8px}
.pin-sub{font-size:11.5px;color:var(--gris);margin:0 0 26px;line-height:1.5}
.pdots{display:flex;gap:14px;justify-content:center;margin-bottom:22px}
.pd{width:11px;height:11px;border-radius:50%;background:var(--linea);transition:.2s}
.pd.on{background:var(--negro);transform:scale(1.15)}
.pin-err{font-size:11.5px;color:var(--rosa-fuerte);margin-bottom:16px;font-weight:500}
.spin{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid var(--linea);
border-top-color:var(--rosa-fuerte);animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--rosa-fuerte);font-size:12px;margin:10px 0 0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{background:#fff;border:0;border-radius:18px;padding:17px 0;font-size:20px;font-weight:500;
font-family:'JetBrains Mono',monospace;color:var(--negro)}
.keypad button:active{background:var(--rosa-suave)}
.keypad .ghosty{background:transparent;font-size:12px;font-family:'Inter Tight',sans-serif;color:var(--gris);font-weight:500}

/* ---- entradas ---- */
.entradas{display:grid;gap:10px;margin-top:14px}
@media(min-width:720px){.entradas{grid-template-columns:1fr 1fr}}
.entrada{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;
background:#fff;border:0;border-radius:18px;padding:17px 19px;transition:.2s}
.entrada:hover{background:#fff;transform:translateX(2px)}
.et{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ep{font-size:10.5px;color:var(--gris);margin-top:3px;line-height:1.35}
.ev{font-size:17px;white-space:nowrap}

/* ---- metas ---- */
.meta{padding:16px 0;border-bottom:1px solid var(--linea)}
.meta:last-child{border-bottom:0}
.meta-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.meta .t{font-size:14px;font-weight:600}
.meta .s{font-size:11px;color:var(--gris);margin-top:3px}
.mp{font-size:17px}
.meta-acc{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.meta-acc span:last-child{display:flex;gap:6px}

/* ---- notas ---- */
.check{width:21px;height:21px;border-radius:7px;border:0;box-shadow:inset 0 0 0 1.5px var(--linea);
background:#fff;flex:none;padding:0}
.check.on{background:var(--negro);box-shadow:none;position:relative}
.check.on::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:9px;
border:solid var(--rosa);border-width:0 2px 2px 0;transform:rotate(42deg)}

/* ---- menú "más" ---- */
.menu{display:block;width:100%;text-align:left;background:#FAFAFB;border:0;border-radius:16px;
padding:16px 18px;font-size:14.5px;font-weight:500;margin-bottom:8px;color:var(--negro)}
.menu.salir{background:var(--negro);color:#fff;margin-top:6px;margin-bottom:0}
.volver{background:#fff;border:0;border-radius:12px;width:34px;height:34px;font-size:16px;color:var(--negro);
box-shadow:inset 0 0 0 1px var(--linea);flex:none;margin-right:-4px}
.salir-rail{margin-top:16px;color:var(--rosa-fuerte)!important;font-size:13px!important}
.filas{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filas::-webkit-scrollbar{display:none}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.acciones label{display:inline-block}

/* ---- v3 ---- */
.congelado{position:relative;z-index:1;margin-top:16px;font-size:11px;color:var(--rosa);
background:rgba(249,199,216,.1);border-radius:12px;padding:10px 13px;line-height:1.45}
.dual{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#F0F0F2;margin-top:6px}
.dual .d1{background:var(--negro)}.dual .d2{background:var(--rosa)}
.duall{display:flex;justify-content:space-between;margin-top:9px;font-size:10.5px;color:var(--gris)}
.duall b{font-weight:400;color:var(--negro);font-size:12.5px;margin-right:3px}
.deuda{padding:16px 0;border-bottom:1px solid var(--linea)}
.deuda:last-child{border-bottom:0}
.deuda .t{font-size:14px;font-weight:600}
.deuda .s{font-size:11px;color:var(--gris);margin-top:3px}
.tagp{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--rosa-suave);
color:var(--rosa-fuerte);padding:3px 7px;border-radius:999px;font-weight:600;vertical-align:middle}
.exp{background:none;border:0;color:var(--rosa-fuerte);font-size:12px;font-weight:600;padding:4px 0;
letter-spacing:-.01em;margin-top:2px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .mini:first-child{margin-top:0}

/* ---- v4 ---- */
.banner{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--negro);color:#fff;
border:0;border-radius:18px;padding:15px 18px;margin-top:14px}
.banner .bn{background:var(--rosa);color:var(--negro);font-family:'JetBrains Mono',monospace;font-size:13px;
width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.banner div{flex:1;min-width:0}
.banner b{display:block;font-size:13.5px;font-weight:600}
.banner i{display:block;font-style:normal;font-size:10.5px;color:rgba(255,255,255,.5);margin-top:3px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner .bm{font-size:15px;color:var(--rosa);white-space:nowrap}
.sect b.mono{font-size:15px}
@media(max-width:420px){.navbar button{font-size:8.5px}.navbar .ico{font-size:14px}}

/* ---- v5 ---- */
.banner.rosa{background:var(--rosa-suave);color:var(--negro)}
.banner.rosa .bn{background:var(--rosa-fuerte);color:#fff}
.banner.rosa i{color:var(--rosa-fuerte)}
.banner.rosa .bm{color:var(--rosa-fuerte)}
.codigo{background:#FAFAFB;box-shadow:inset 0 0 0 1px var(--linea);border-radius:12px;padding:11px 13px;
font-size:11.5px;word-break:break-all;color:var(--gris2)}

/* ---- v6 ---- */
.subcat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:12.5px;
border-bottom:1px solid var(--linea);color:var(--gris2)}
.subcat:last-child{border-bottom:0}
.subcat b{font-weight:400;color:var(--negro)}
.sw{width:40px;height:23px;border-radius:999px;border:0;background:#E4E4E8;position:relative;flex:none;
padding:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(10,10,11,.2)}
.sw.on{background:var(--negro)}

function migrar(d){
  if(!d)return null;
  if(d.v===1){
    ['cuentas','fijos','deudas','movs'].forEach(function(k){(d[k]||[]).forEach(function(x){
      x.bloque=(x.ambito==='hogar')?'casa':x.ambito;delete x.ambito})});
    d.pins={a:null,b:null};d.reparto={a:50,b:50};d.v=2
  }
  ['metas','activos','notas','cuentas','fijos','deudas','movs','proyectos','pendientes','base'].forEach(function(k){if(!d[k])d[k]=[]});
  if(!d.pins)d.pins={a:null,b:null};
  if(!d.reparto)d.reparto={a:50,b:50};
  if(d.abrioContable===undefined)d.abrioContable=false;
  // visitas/rachaMirarMax/carinos pasaron de ser un solo valor a uno por bloque (a/b/casa)
  if(!d.visitas||!d.visitas.a||!d.visitas.b||!d.visitas.casa){
    var vieja=(d.visitas&&typeof d.visitas==='object')?d.visitas:{};
    d.visitas={a:vieja.a||{},b:vieja.b||{},casa:vieja.casa||{}};
  }
  if(!d.rachaMirarMax||typeof d.rachaMirarMax!=='object'){d.rachaMirarMax={a:0,b:0,casa:0}}
  else{['a','b','casa'].forEach(function(k){if(!d.rachaMirarMax[k])d.rachaMirarMax[k]=0})}
  if(!d.carinos||typeof d.carinos!=='object'){d.carinos={a:0,b:0,casa:0}}
  else{['a','b','casa'].forEach(function(k){if(!d.carinos[k])d.carinos[k]=0})}
  if(!d.fuentesIngreso)d.fuentesIngreso=[];
  if(d.v<3){
    d.cuentas.forEach(function(c){if(c.reserva===undefined)c.reserva=false});
    d.fijos.forEach(function(f){if(f.esencial===undefined)f.esencial=true});
    d.deudas.forEach(function(x){
      if(x.cuotasTotal===undefined)x.cuotasTotal=0;
      if(x.cuotasPagadas===undefined)x.cuotasPagadas=0;
      if(!x.tipo)x.tipo='consumo'});
    d.movs.forEach(function(m){
      if(!m.clase)m.clase=(m.tipo==='gasto'?'vital':'variable');
      if(m.renta===undefined)m.renta='';
      if(m.porCuentaDe===undefined)m.porCuentaDe=null});
    d.v=3
  }
  if(d.v<4){
    d.cuentas.forEach(function(c){if(!c.tipo)c.tipo=c.reserva?'bolsillo':'corriente'});
    d.v=4
  }
  if(!d.alertas)d.alertas={dias:5,notif:false,ultimo:''};
  if(!d.alertas.frecuencia)d.alertas.frecuencia='semanal';
  if(d.alertas.diaSemana===undefined)d.alertas.diaSemana=1;
  if(d.v<5){
    d.fijos.forEach(function(f){if(!f.avisar)f.avisar='si';if(!f.grupo)f.grupo=grupoDe(f.categoria,'gasto')});
    d.deudas.forEach(function(x){if(!x.avisar)x.avisar='si';if(!x.grupo)x.grupo='bancario'});
    d.movs.forEach(function(m){if(!m.grupo)m.grupo=grupoDe(m.categoria,m.tipo)});
    d.v=5
  }
  if(d.v<6){
    d.deudas.forEach(function(x){
      if(x.entidad===undefined)x.entidad='';
      if(x.montoOriginal===undefined)x.montoOriginal=0;
      if(x.numeroCuenta===undefined)x.numeroCuenta='';
      if(x.referencia===undefined)x.referencia='';
      if(x.convenio===undefined)x.convenio='';
      if(x.tasa===undefined)x.tasa='';
      if(x.notas===undefined)x.notas=''});
    d.v=6
  }
  if(d.v<7){
    d.movs.forEach(function(m){if(!m.estado)m.estado='activa';if(m.proyectoId===undefined)m.proyectoId=null});
    if(!d.proyectos)d.proyectos=[];
    d.v=7
  }
  return d
}

/* ===== ledger inmutable: solo movimientos vivos ===== */
function viva(m){return m.estado!=='anulada'}

/* ===== proyectos y reglas de reparto ===== */
function proyecto(id){for(var i=0;i<D.proyectos.length;i++)if(D.proyectos[i].id===id)return D.proyectos[i];return null}
function repartoDe(m){
  if(m.proyectoId){var p=proyecto(m.proyectoId);
    if(p)return {a:(p.reparto.a||0)/100,b:(p.reparto.b||0)/100}}
  return {a:(D.reparto.a||0)/100,b:(D.reparto.b||0)/100}
}

/* ===== motor de compensación (netting) =====
   Gasto compartido V pagado por A, con responsabilidad R_B del otro:
       deuda(B → A) = V × R_B
   Ingreso de proyecto que cae en la cuenta de A:
       la plata queda en la cuenta física de A, pero se acredita a B su parte. */
function obligaciones(m){
  if(!viva(m)||m.saldado||m.traslado||m.ajuste)return [];
  var out=[], pagador=m.bloque, r, k;
  if(m.tipo==='gasto'){
    if(m.proyectoId)                r=repartoDe(m);
    else if(m.porCuentaDe==='casa') r={a:(D.reparto.a||0)/100,b:(D.reparto.b||0)/100};
    else if(m.porCuentaDe)          {r={};r[m.porCuentaDe]=1}
    else return [];
    for(k in r){if(k===pagador||!r[k])continue;
      out.push({de:k,para:pagador,monto:m.monto*r[k],mov:m})}
    return out
  }
  if(m.tipo==='ingreso'&&m.proyectoId){
    var sp=repartoDe(m);
    for(k in sp){if(k===pagador||!sp[k])continue;
      out.push({de:pagador,para:k,monto:m.monto*sp[k],mov:m})}
  }
  return out
}
function matriz(){
  var t=[];D.movs.forEach(function(m){obligaciones(m).forEach(function(o){t.push(o)})});return t
}
function saldoEntre(x,y){ // positivo: y le debe a x
  return matriz().reduce(function(s,o){
    if(o.de===y&&o.para===x)return s+o.monto;
    if(o.de===x&&o.para===y)return s-o.monto;
    return s},0)
}
function cruzadosDe(b){return matriz().filter(function(o){return o.de===b||o.para===b})}

    .reduce(function(s,m){return s+(m.tipo==='ingreso'?m.monto:-m.monto)},c.saldoInicial||0)};
  var libres=cuentas.filter(function(c){return !c.reserva}), reservadas=cuentas.filter(function(c){return c.reserva});

  var reserva=reservadas.reduce(function(s,c){return s+saldoCuenta(c)},0);
  var disponible=libre+reserva;

  var real=function(m){return !m.ajuste&&!m.traslado&&viva(m)};
  var delMes=function(k){return movs.filter(function(m){return m.fecha.slice(0,7)===k&&real(m)})};
  var sum=function(a,t){return a.filter(function(m){return m.tipo===t}).reduce(function(s,m){return s+m.monto},0)};
  var mm=delMes(MESK);
  var ingresoMes=sum(mm,'ingreso'), gastoMes=sum(mm,'gasto');
  var amortMes=mm.filter(function(m){return m.amortizacion}).reduce(function(s,m){return s+m.monto},0);
  var ahorroMes=mm.filter(function(m){return m.metaId}).reduce(function(s,m){return s+m.monto},0);
  var gastoPuro=gastoMes-amortMes-ahorroMes;
  var vitalMes=mm.filter(function(m){return m.tipo==='gasto'&&m.clase==='vital'&&!m.metaId&&!m.amortizacion}).reduce(function(s,m){return s+m.monto},0);
  var prescMes=mm.filter(function(m){return m.tipo==='gasto'&&m.clase==='prescindible'&&!m.metaId&&!m.amortizacion}).reduce(function(s,m){return s+m.monto},0);
  var recurMes=mm.filter(function(m){return m.tipo==='ingreso'&&m.clase==='fijo'}).reduce(function(s,m){return s+m.monto},0);

  var prev=[1,2,3].map(function(n){return mesAtras(MESK,n)});
  var con=prev.filter(function(k){return delMes(k).length>0});
  var prom=function(fn){return con.length?con.reduce(function(s,k){return s+fn(delMes(k))},0)/con.length:fn(mm)};
  var promIngreso=prom(function(a){return sum(a,'ingreso')});
  var promRecurrente=prom(function(a){return a.filter(function(m){return m.tipo==='ingreso'&&m.clase==='fijo'}).reduce(function(s,m){return s+m.monto},0)});
  var esVariableGasto=function(m){return m.tipo==='gasto'&&!m.fijoId&&!m.deudaId&&!m.metaId};
  var promVariable=prom(function(a){return a.filter(esVariableGasto).reduce(function(s,m){return s+m.monto},0)});
  var promVitalVar=prom(function(a){return a.filter(function(m){return esVariableGasto(m)&&m.clase==='vital'}).reduce(function(s,m){return s+m.monto},0)});

  var fijosEsen=fijos.filter(function(x){return x.esencial!==false});
  var totalFijos=fijos.reduce(function(s,x){return s+x.monto},0);
  var fijosVitales=fijosEsen.reduce(function(s,x){return s+x.monto},0);
  var totalCuotas=deudas.reduce(function(s,x){return s+cuotaViva(x)},0);
  var saldoDeudas=deudas.reduce(function(s,x){return s+(x.saldo||0)},0);
  var deudaConsumo=deudas.filter(function(x){return x.tipo!=='patrimonial'}).reduce(function(s,x){return s+x.saldo},0);
  var costoBase=totalFijos+promVariable, costoMes=costoBase+totalCuotas;
  var pisoVital=fijosVitales+promVitalVar+totalCuotas;
  var mesesRest=12-HOY.getMonth();
  var autonomia=costoMes>0?libre/costoMes:0;
  var autonomiaCol=costoMes>0?disponible/costoMes:0;
  var fechaAut=new Date(HOY.getTime()+autonomia*30.44*86400000);
  var cuotasDic=deudas.reduce(function(s,x){return s+cuotaViva(x)*Math.min(cuotasRest(x),mesesRest)},0);
  var faltaDic=Math.max(0,costoBase*mesesRest+cuotasDic-libre);
  var faltaCero=Math.max(0,costoBase*mesesRest+saldoDeudas-libre);
  var faltaMetas=metas.reduce(function(s,m){return s+Math.max(0,(m.objetivo||0)-(m.ahorrado||0))},0);

  var liberacion=deudas.filter(function(x){return cuotasRest(x)>0&&cuotaViva(x)>0})
    .map(function(x){return{nombre:x.nombre,mes:finDeuda(x),monto:cuotaViva(x),restan:cuotasRest(x)}})
    .sort(function(p,q){return p.mes<q.mes?-1:1});

  var pend=fijos.map(function(x){return{f:x,pagado:!!(x.pagos&&x.pagos[MESK]),dias:x.dia-HOY.getDate()}})
    .sort(function(x,y){return x.f.dia-y.f.dia});
  var mapa={};mm.filter(function(x){return x.tipo==='gasto'}).forEach(function(x){mapa[x.categoria]=(mapa[x.categoria]||0)+x.monto});
  var porCat=Object.keys(mapa).map(function(k){return[k,mapa[k]]}).sort(function(x,y){return y[1]-x[1]});
  var agrupar=function(arr,tipo){
    var g={};arr.filter(function(x){return x.tipo===tipo}).forEach(function(x){
      var k=x.grupo||grupoDe(x.categoria,tipo);
      if(!g[k])g[k]={total:0,cats:{}};
      g[k].total+=x.monto;g[k].cats[x.categoria]=(g[k].cats[x.categoria]||0)+x.monto});
    return Object.keys(g).map(function(k){return[k,g[k]]}).sort(function(x,y){return y[1].total-x[1].total})};
  var delAnio=movs.filter(function(m){return m.fecha.slice(0,4)===String(ANIO)&&real(m)});
  var grGastoMes=agrupar(mm,'gasto'), grIngMes=agrupar(mm,'ingreso');
  var grGastoAnio=agrupar(delAnio,'gasto'), grIngAnio=agrupar(delAnio,'ingreso');
  var fuentes={};delAnio.filter(function(m){return m.tipo==='ingreso'}).forEach(function(m){
    var k=(m.fuente&&m.fuente.trim())||catNom(m.categoria);
    fuentes[k]=(fuentes[k]||0)+m.monto});
  var porFuente=Object.keys(fuentes).map(function(k){return[k,fuentes[k]]}).sort(function(x,y){return y[1]-x[1]});

  var valorActivos=activos.reduce(function(s,x){return s+(x.valor||0)},0);
  var ahorrado=metas.reduce(function(s,x){return s+(x.ahorrado||0)},0);
  var porCobrar=otrosBloques(b).reduce(function(s,o){return s+Math.max(0,saldoEntre(b,o))},0);
  var porPagar=otrosBloques(b).reduce(function(s,o){return s+Math.max(0,saldoEntre(o,b))},0);
  var patrimonio=disponible+valorActivos-saldoDeudas+porCobrar-porPagar;
  var imprevistos=notas.filter(function(n){return n.tipo==='imprevisto'&&!n.hecho}).reduce(function(s,n){return s+(n.monto||0)},0);
  var pendientes=notas.filter(function(n){return !n.hecho}).length;

  var aporte={a:0,b:0,otro:0};
  if(b==='casa')mm.forEach(function(m){if(m.tipo==='ingreso'&&m.categoria!=='reembolso'){
    var k=(m.de==='a'||m.de==='b')?m.de:'otro';aporte[k]+=m.monto}});

  var renta={};
  movs.filter(function(m){return m.renta&&m.fecha.slice(0,4)===String(ANIO)}).forEach(function(m){
    if(!renta[m.renta])renta[m.renta]={total:0,n:0};
    renta[m.renta].total+=m.monto;renta[m.renta].n++});

  return {movs:movs,fijos:fijos,deudas:deudas,cuentas:cuentas,metas:metas,activos:activos,notas:notas,
   saldoCuenta:saldoCuenta,libre:libre,reserva:reserva,disponible:disponible,
   ingresoMes:ingresoMes,gastoMes:gastoMes,amortMes:amortMes,ahorroMes:ahorroMes,gastoPuro:gastoPuro,
   vitalMes:vitalMes,prescMes:prescMes,recurMes:recurMes,promIngreso:promIngreso,promRecurrente:promRecurrente,
   promVariable:promVariable,totalFijos:totalFijos,fijosVitales:fijosVitales,totalCuotas:totalCuotas,
   saldoDeudas:saldoDeudas,deudaConsumo:deudaConsumo,costoBase:costoBase,costoMes:costoMes,pisoVital:pisoVital,
   mesesRest:mesesRest,autonomia:autonomia,autonomiaCol:autonomiaCol,fechaAut:fechaAut,
   faltaDic:faltaDic,faltaCero:faltaCero,faltaMetas:faltaMetas,liberacion:liberacion,cuotasDic:cuotasDic,
   pend:pend,porCat:porCat,grGastoMes:grGastoMes,grIngMes:grIngMes,grGastoAnio:grGastoAnio,
   grIngAnio:grIngAnio,porFuente:porFuente,valorActivos:valorActivos,ahorrado:ahorrado,patrimonio:patrimonio,
   imprevistos:imprevistos,pendientes:pendientes,aporte:aporte,renta:renta,
   anuladas:movs.filter(function(m){return !viva(m)}).length,
   porCobrar:porCobrar,porPagar:porPagar,queda:ingresoMes-gastoMes}
}

/* ===== sesión (Supabase Auth por REST, sin librerías) =====
   Cada persona se registra con su correo y su contraseña — cuenta 100%
   individual, ya no un PIN local compartido. Al entrar, se cargan los
   "espacios" a los que pertenece: su espacio personal (siempre uno, privado)
   y cero o más Casas (compartidas, por ahora de a dos, unidas por un código
   corto que genera quien la crea). */
var SKEY='jm:sesion';
var SESION={url:'',key:'',token:'',refresh:'',usuarioId:'',correo:'',nombre:'',estado:'',error:''};
var MIS_ESPACIOS=[], ESPACIO_ACTUAL=null, MI_SLOT='a';
function cargarSesion(){try{var s=localStorage.getItem(SKEY);if(s)SESION=JSON.parse(s)}catch(e){}}
function guardarSesion(){try{localStorage.setItem(SKEY,JSON.stringify(SESION))}catch(e){}}
function sesionLista(){return !!(SESION.url&&SESION.key)}
function autenticado(){return !!(sesionLista()&&SESION.token)}
function api(path,opts){
  opts=opts||{};
  var h={'apikey':SESION.key,'Content-Type':'application/json'};
  if(SESION.token)h['Authorization']='Bearer '+SESION.token;
  if(opts.headers)for(var k in opts.headers)h[k]=opts.headers[k];
  return fetch(SESION.url.replace(/\/$/,'')+path,{method:opts.method||'GET',headers:h,body:opts.body})
}
function capturarSesion(){
  try{
    var h=location.hash||'';
    if(h.indexOf('access_token=')<0)return false;
    var p={};h.replace(/^#/,'').split('&').forEach(function(x){var q=x.split('=');p[q[0]]=decodeURIComponent(q[1]||'')});
    if(!p.access_token)return false;
    SESION.token=p.access_token;SESION.refresh=p.refresh_token||'';guardarSesion();
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
    return p.type==='recovery'?'recovery':true
  }catch(e){return false}
}
function registrar(correo,clave,nombre){
  SESION.error='';SESION.estado='cargando';render();
  api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:correo,password:clave,
    data:{nombre:nombre},options:{email_redirect_to:location.origin+location.pathname}})})
   .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
   .then(function(res){
     if(!res.ok){SESION.estado='error';
       SESION.error=(res.j&&(res.j.msg||res.j.error_description||res.j.error))||'No se pudo crear la cuenta.';
       render();return}
     if(res.j.access_token){
       SESION.token=res.j.access_token;SESION.refresh=res.j.refresh_token||'';
       SESION.usuarioId=res.j.user&&res.j.user.id;SESION.correo=correo;SESION.nombre=nombre;
       SESION.estado='ok';guardarSesion();arrancarSesion()
     }else{
       SESION.estado='revisa-correo';SESION.correo=correo;guardarSesion();render()
     }
   }).catch(function(){SESION.estado='error';SESION.error='No se pudo conectar.';render()})
}
function iniciarSesion(correo,clave){
  SESION.error='';SESION.estado='cargando';render();
  api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:correo,password:clave})})
   .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
   .then(function(res){
     if(!res.ok){SESION.estado='error';
       SESION.error=(res.j&&(res.j.error_description||res.j.msg))||'Correo o clave incorrectos.';
       render();return}
     SESION.token=res.j.access_token;SESION.refresh=res.j.refresh_token||'';
     SESION.usuarioId=res.j.user&&res.j.user.id;SESION.correo=correo;SESION.estado='ok';guardarSesion();
     arrancarSesion()
   }).catch(function(){SESION.estado='error';SESION.error='No se pudo conectar.';render()})
}
function recuperarClave(correo){
  SESION.error='';SESION.estado='cargando';render();
  api('/auth/v1/recover',{method:'POST',body:JSON.stringify({email:correo,
    options:{redirect_to:location.origin+location.pathname}})})
   .then(function(){SESION.estado='recuperar-enviado';render()})
   .catch(function(){SESION.estado='error';SESION.error='No se pudo enviar el correo.';render()})
}
function ponerNuevaClave(clave){
  SESION.error='';SESION.estado='cargando';render();
  api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:clave})})
   .then(function(r){if(!r.ok)throw 0;SESION.estado='ok';guardarSesion();arrancarSesion()})
   .catch(function(){SESION.estado='error';SESION.error='No se pudo cambiar la clave. Pide el enlace de nuevo.';render()})
}
function cerrarSesion(){
  SESION={url:SESION.url,key:SESION.key,token:'',refresh:'',usuarioId:'',correo:'',nombre:'',estado:'',error:''};
  guardarSesion();MIS_ESPACIOS=[];ESPACIO_ACTUAL=null;D=null;VIEW='portal';render()
}

/* ===== espacios: tu cuenta personal + las Casas a las que perteneces ===== */
/* Revisa toda respuesta de la nube: si algo falló, arma un mensaje de error
   legible (con el código y el motivo real que dio Supabase) en vez de
   dejarlo pasar en silencio y romper más adelante con un error confuso. */
function chk(r){
  if(r.ok)return r.status===204?null:r.json().catch(function(){return null});
  return r.text().then(function(t){
    var msg=t;
    try{var j=JSON.parse(t);msg=j.message||j.error_description||j.msg||j.hint||t}catch(e){}
    if(r.status===401||/jwt|row-level security/i.test(msg||'')){
      SESION.token='';guardarSesion();
      throw new Error('Tu sesión venció o quedó incompleta. Sal y vuelve a entrar con tu correo y clave — no perdiste nada.')
    }
    throw new Error('Error '+r.status+': '+(msg||'sin detalle'))
  })
}
function cargarMisEspacios(){
  return api('/rest/v1/miembros_espacio?usuario_id=eq.'+SESION.usuarioId+'&select=rol,slot,espacios(id,nombre,tipo)')
   .then(chk)
   .then(function(rows){
     MIS_ESPACIOS=(rows||[]).filter(function(r){return r.espacios}).map(function(r){
       return {id:r.espacios.id,nombre:r.espacios.nombre,tipo:r.espacios.tipo,rol:r.rol,slot:r.slot}});
     return MIS_ESPACIOS
   })
}
function miEspacioPersonal(){return MIS_ESPACIOS.filter(function(e){return e.tipo==='personal'})[0]}
function misCasas(){return MIS_ESPACIOS.filter(function(e){return e.tipo==='casa'})}
function generarCodigo(){
  var abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';
  for(var i=0;i<6;i++)s+=abc[Math.floor(Math.random()*abc.length)];
  return s
}
function crearCasa(nombre){
  return api('/rest/v1/espacios',{method:'POST',headers:{'Prefer':'return=representation'},
    body:JSON.stringify({tipo:'casa',nombre:nombre})})
   .then(chk)
   .then(function(esp){
     if(!esp||!esp[0])throw new Error('No se pudo crear la Casa (no llegó respuesta).');
     var espId=esp[0].id;
     return api('/rest/v1/miembros_espacio',{method:'POST',
       body:JSON.stringify({espacio_id:espId,usuario_id:SESION.usuarioId,slot:'a',rol:'propietario'})})
      .then(chk)
      .then(function(){
        var blob=VACIO_CASA(SESION.nombre,'Tu pareja o familiar');
        return api('/rest/v1/espacios_datos',{method:'POST',body:JSON.stringify({espacio_id:espId,estado:blob})})
      })
      .then(chk)
      .then(function(){
        var codigo=generarCodigo();
        return api('/rest/v1/codigos_casa',{method:'POST',headers:{'Prefer':'return=representation'},
          body:JSON.stringify({codigo:codigo,nombre_casa:nombre,espacio_id:espId,creado_por:SESION.usuarioId})})
      })
      .then(chk)
      .then(function(c){
        if(!c||!c[0])throw new Error('La Casa quedó creada, pero no se pudo generar el código. Entra a Ajustes → Mi cuenta para generar uno.');
        return {espacioId:espId,codigo:c[0].codigo}
      })
   })
}
function unirseConCodigo(codigo){
  var cod=(codigo||'').trim().toUpperCase();
  return api('/rest/v1/codigos_casa?codigo=eq.'+encodeURIComponent(cod)+'&estado=eq.pendiente',
    {method:'PATCH',headers:{'Prefer':'return=representation'},
     body:JSON.stringify({estado:'usado',usado_por:SESION.usuarioId,usado_en:new Date().toISOString()})})
   .then(chk)
   .then(function(rows){
     if(!rows||!rows.length)throw new Error('Ese código no existe, ya se usó, o es tuyo.');
     var espId=rows[0].espacio_id;
     return api('/rest/v1/miembros_espacio',{method:'POST',
       body:JSON.stringify({espacio_id:espId,usuario_id:SESION.usuarioId,slot:'b',rol:'miembro'})})
      .then(chk)
      .then(function(){return api('/rest/v1/espacios_datos?espacio_id=eq.'+espId+'&select=estado')})
      .then(chk)
      .then(function(rows2){
        var estado=rows2&&rows2[0]&&rows2[0].estado&&Object.keys(rows2[0].estado).length
          ?rows2[0].estado:VACIO_CASA('Tu pareja o familiar',SESION.nombre);
        if(estado.personas)estado.personas.b=SESION.nombre;
        return api('/rest/v1/espacios_datos?espacio_id=eq.'+espId,{method:'PATCH',body:JSON.stringify({estado:estado})})
      })
      .then(chk)
      .then(function(){return espId})
   })
}
/* Generar un código adicional para una Casa que ya existe (por si el
   primero se perdió o venció sin usarse). Solo sirve mientras la Casa
   tenga cupo — hoy, mientras no tenga ya sus dos personas. */
function generarCodigoParaCasa(espId,nombre){
  var codigo=generarCodigo();
  return api('/rest/v1/codigos_casa',{method:'POST',headers:{'Prefer':'return=representation'},
    body:JSON.stringify({codigo:codigo,nombre_casa:nombre,espacio_id:espId,creado_por:SESION.usuarioId})})
   .then(chk)
   .then(function(c){return c&&c[0]?c[0].codigo:''})
}
/* Registra un movimiento directo en TU Casa (no en tu espacio personal) —
   para el "¿es tuyo o de la Casa?" al anotar un gasto desde tu bloque
   personal. Personal y Casa son espacios separados (cada uno con su propio
   blob), así que no basta con guardar local: hay que ir a buscar el blob de
   la Casa y sumarlo ahí. Si tienes más de una Casa, por ahora usa la primera
   — abrir esto a elegir cuál queda para una siguiente vuelta. */
function registrarEnCasa(mv){
  var casa=misCasas()[0];
  if(!casa)return Promise.reject(new Error('No tienes ninguna Casa todavía.'));
  return api('/rest/v1/espacios_datos?espacio_id=eq.'+casa.id+'&select=estado')
   .then(chk)
   .then(function(rows){
     var estado=rows&&rows[0]&&rows[0].estado&&Object.keys(rows[0].estado).length?rows[0].estado:VACIO_CASA('—','—');
     estado.movs=estado.movs||[];estado.movs.push(mv);estado.actualizado=new Date().toISOString();
     return api('/rest/v1/espacios_datos?espacio_id=eq.'+casa.id,{method:'PATCH',body:JSON.stringify({estado:estado})})
   }).then(chk)
}
/* ===== arranque tras iniciar sesión: cargar espacios, migrar datos de
   prueba locales a tu espacio personal si aplica, e ir al portal ===== */
function arrancarSesion(){
  cargarMisEspacios().then(function(){
    var personal=miEspacioPersonal();
    if(!personal){SESION.estado='error';SESION.error='No se pudo preparar tu cuenta. Intenta de nuevo en un momento.';render();return}
    var local=localGet();
    if(local&&local.movs&&local.movs.length){
      return api('/rest/v1/espacios_datos?espacio_id=eq.'+personal.id+'&select=estado')
       .then(chk)
       .then(function(rows){
         var vacioEnLaNube=!rows||!rows[0]||!rows[0].estado||!Object.keys(rows[0].estado).length;
         if(!vacioEnLaNube)return;
         var migrado=migrar(local);
         return api('/rest/v1/espacios_datos?espacio_id=eq.'+personal.id,{method:'PATCH',
           body:JSON.stringify({estado:migrado,actualizado:new Date().toISOString()})})
          .then(function(){MSG='Tus datos de prueba quedaron guardados en tu espacio personal.'})
       }).then(function(){irAPortal()})
    }
    irAPortal()
  }).catch(function(){SESION.estado='error';SESION.error='No se pudo cargar tu cuenta.';render()})
}
function irAPortal(){VIEW='portal';SHEET=null;ESPACIO_ACTUAL=null;D=null;render()}
function abrirEspacio(espId,cb){
  var esp=MIS_ESPACIOS.filter(function(e){return e.id===espId})[0];
  if(!esp)return;
  ESPACIO_ACTUAL=espId;B=esp.tipo==='casa'?'casa':'a';MI_SLOT=esp.slot||'a';
  TAB='inicio';VIEW='cargando';render();
  load(function(d){
    D=migrar(d)||(esp.tipo==='casa'?VACIO_CASA(SESION.nombre,'—'):VACIO_PERSONAL(SESION.nombre));
    VIEW='block';
    if(cb)cb();else render();
    setTimeout(revisarAlertas,1200)
  })
}

/* ===== próximos pagos ===== */
function proximaFecha(dia){
  var d=new Date(HOY.getFullYear(),HOY.getMonth(),Math.min(dia,28));
  d.setDate(dia>28?dia:dia);
  if(d.getMonth()!==HOY.getMonth())d=new Date(HOY.getFullYear(),HOY.getMonth()+1,0);
  if(d<new Date(HOY.getFullYear(),HOY.getMonth(),HOY.getDate()))d=new Date(HOY.getFullYear(),HOY.getMonth()+1,dia);
  return d
}
function proximos(b){
  var out=[];
  D.fijos.filter(function(f){return f.bloque===b&&f.activo}).forEach(function(f){
    var pagado=!!(f.pagos&&f.pagos[MESK]);
    var fe=proximaFecha(f.dia);
    out.push({id:f.id,clase:'fijo',nombre:f.nombre,monto:f.monto,dia:f.dia,fecha:fe,pagado:pagado,
      dias:Math.round((fe-new Date(HOY.getFullYear(),HOY.getMonth(),HOY.getDate()))/86400000),bloque:b})});
  D.deudas.filter(function(x){return x.bloque===b&&cuotasRest(x)>0&&x.cuota>0}).forEach(function(x){
    var fe=proximaFecha(x.dia);
    out.push({id:x.id,clase:'deuda',nombre:'Cuota · '+x.nombre,monto:x.cuota,dia:x.dia,fecha:fe,pagado:false,
      dias:Math.round((fe-new Date(HOY.getFullYear(),HOY.getMonth(),HOY.getDate()))/86400000),
      restan:cuotasRest(x),bloque:b})});
  return out.sort(function(p,q){return p.dias-q.dias})
}
function alertaSaldo(c){
  var dia=HOY.getDate(), diasMes=new Date(ANIO,HOY.getMonth()+1,0).getDate(), restan=diasMes-dia;
  if(restan<=0)return null;
  var fijosPend=c.pend.filter(function(p){return !p.pagado}).reduce(function(s,p){return s+p.f.monto},0);
  var cuotasPend=c.deudas.filter(function(x){return cuotasRest(x)>0&&x.dia>=dia}).reduce(function(s,x){return s+x.cuota},0);
  var ritmo=c.gastoPuro/Math.max(1,dia);
  var proyectado=ritmo*restan+fijosPend+cuotasPend;
  if(proyectado<=c.libre)return null;
  return {falta:proyectado-c.libre,restan:restan,proyectado:proyectado,ritmo:ritmo,
    fijosPend:fijosPend+cuotasPend,alcanza:ritmo>0?Math.floor(Math.max(0,c.libre-fijosPend-cuotasPend)/ritmo):restan}
}
function alertasActivas(b){
  var n=(D.alertas&&D.alertas.dias)||5;

}

function dosDig(n){return n<10?'0'+n:''+n}
function icsFecha(d){return d.getFullYear()+dosDig(d.getMonth()+1)+dosDig(d.getDate())}
function generarICS(bloques){
  var n=(D.alertas&&D.alertas.dias)||5;

  bloques.forEach(function(b){
    D.fijos.filter(function(f){return f.bloque===b&&f.activo}).forEach(function(f){
      var d=proximaFecha(f.dia);
      L=L.concat(['BEGIN:VEVENT','UID:fijo-'+f.id+'@jm-cuentas','DTSTAMP:'+stamp,
        'DTSTART;VALUE=DATE:'+icsFecha(d),'RRULE:FREQ=MONTHLY;BYMONTHDAY='+Math.min(f.dia,28),
        'SUMMARY:Pagar '+f.nombre+' — '+money(f.monto),
        'DESCRIPTION:'+nomB(b)+' · gasto fijo registrado en J&M Cuentas',
        'BEGIN:VALARM','TRIGGER:-P'+n+'D','ACTION:DISPLAY','DESCRIPTION:'+f.nombre+' vence en '+n+' días','END:VALARM',
        'BEGIN:VALARM','TRIGGER:-PT9H','ACTION:DISPLAY','DESCRIPTION:Hoy vence '+f.nombre,'END:VALARM',
        'END:VEVENT'])});
    D.deudas.filter(function(x){return x.bloque===b&&cuotasRest(x)>0&&x.cuota>0}).forEach(function(x){
      var d=proximaFecha(x.dia);
      L=L.concat(['BEGIN:VEVENT','UID:deuda-'+x.id+'@jm-cuentas','DTSTAMP:'+stamp,
        'DTSTART;VALUE=DATE:'+icsFecha(d),
        'RRULE:FREQ=MONTHLY;BYMONTHDAY='+Math.min(x.dia,28)+';COUNT='+cuotasRest(x),
        'SUMMARY:Cuota '+x.nombre+' — '+money(x.cuota),
        'DESCRIPTION:'+nomB(b)+' · quedan '+cuotasRest(x)+' cuotas',
        'BEGIN:VALARM','TRIGGER:-P'+n+'D','ACTION:DISPLAY','DESCRIPTION:Cuota de '+x.nombre+' en '+n+' días','END:VALARM',
        'END:VEVENT'])})});
  L.push('END:VCALENDAR');
  return L.join('\r\n')
}

/* ===== capa de juego: racha, nivel y medallas ===== */
var NIVELES=['Aprendiz','Ordenado','Constante','Estratega','Dueño del cuento','Maestro'];
function rachaDesde(dias){
  var racha=0, d=new Date(HOY);
  if(!dias[toISO(d)])d.setDate(d.getDate()-1);
  while(dias[toISO(d)]&&racha<400){racha++;d.setDate(d.getDate()-1)}
  return racha
}
function juego(c){
  var dias={};
  D.movs.filter(function(m){return viva(m)&&!m.ajuste}).forEach(function(m){dias[m.fecha]=1});
  var racha=rachaDesde(dias);
  var rachaMirar=rachaDesde((D.visitas&&D.visitas[B])||{});
  var pagados=0;D.fijos.forEach(function(f){for(var k in (f.pagos||{}))if(f.pagos[k])pagados++});
  var abonos=D.movs.filter(function(m){return m.metaId&&viva(m)}).length;
  var conc=D.movs.filter(function(m){return m.ajuste}).length;
  var pts=D.movs.filter(viva).length*5+pagados*10+abonos*20+conc*15+racha*3+D.metas.length*10;
  var nivel=Math.min(NIVELES.length,Math.floor(Math.sqrt(pts/40))+1);
  var sigue=Math.pow(nivel,2)*40, previo=Math.pow(nivel-1,2)*40;
  var medallas=[
   ['🌱','Primer paso','Registraste tu primer movimiento',D.movs.filter(viva).length>0],
   ['🔥','Semana viva','7 días seguidos anotando',racha>=7],
   ['📅','Al día','Marcaste 5 pagos fijos',pagados>=5],
   ['🎯','Con rumbo','Creaste tu primera meta',D.metas.length>0],
   ['💪','Ahorrador','5 abonos a metas',abonos>=5],
   ['⚖️','Cuadrado','Conciliaste con el banco',conc>0],
   ['🏦','Libre','Saldaste una deuda por completo',D.deudas.some(function(x){return x.saldo<=0})],
   ['🛡️','Con colchón','Tienes plata congelada de reserva',c.reserva>0],
   ['📈','En verde','Cerraste el mes con saldo a favor',c.queda>0&&HOY.getDate()>20],
   ['🧾','Ordenada','Etiquetaste algo para la renta',Object.keys(c.renta).length>0],
   ['👀','Sin miedo','Entraste 3 días seguidos solo a mirar',rachaMirar>=3],
   ['🔓','Te animaste','Abriste la Zona contable por primera vez',!!D.abrioContable],
   ['🐖','Chanchi creció','60 días distintos cuidando este bloque',Object.keys((D.visitas&&D.visitas[B])||{}).length>=60],
   ['❤️','Mejores amigos','Acariciaste a Chanchi 20 veces',((D.carinos&&D.carinos[B])||0)>=20]];
  return {racha:racha,rachaMirar:rachaMirar,pts:pts,nivel:nivel,nombre:NIVELES[nivel-1],
    prog:pct(pts-previo,sigue-previo),faltan:Math.max(0,sigue-pts),medallas:medallas,
    ganadas:medallas.filter(function(m){return m[3]}).length}
}
/* Chanchi: no mide si la plata está bien o mal, solo si volviste a mirar.
   La idea es que revisar las cuentas nunca se sienta como un examen.
   Cada persona tiene el suyo (uno para "a", uno para "b"). Tiene dos
   memorias distintas, como un Tamagotchi:
   - el ÁNIMO de hoy (rachaMirar) sube y baja, se puede perder sin drama.
   - la ETAPA de crecimiento (días cuidándolo + meses aportando a la casa)
     nunca retrocede, así te ausentes una semana. El cariño acumulado
     tampoco se pierde nunca: no hay forma de que Chanchi "se muera" o
     "se enferme" por descuido.
   Cuando los dos Chanchis de la pareja llevan varios meses de aportes a
   la casa, entre los dos tienen un Chanchito (ver bebeNacido más abajo).
*/
function mesesAportados(persona){
  var meses={};
  D.movs.filter(function(m){
    return m.bloque==='casa'&&m.tipo==='ingreso'&&m.categoria!=='reembolso'&&m.de===persona&&viva(m)
  }).forEach(function(m){meses[m.fecha.slice(0,7)]=1});
  return Object.keys(meses).length
}
function etapaChanchi(diasTotales){
  if(diasTotales<3)return{e:'🥚',n:'Huevito'};
  if(diasTotales<15)return{e:'🐽',n:'Cochinito bebé'};
  if(diasTotales<60)return{e:'🐷',n:'Chanchi joven'};
  if(diasTotales<180)return{e:'🐖',n:'Chanchi grande'};
  return{e:'👑',n:'Chanchi sabio'}
}
function crecimiento(persona){
  return Object.keys((D.visitas&&D.visitas[persona])||{}).length + mesesAportados(persona)*5
}
function bebeNacido(){return mesesAportados('a')>=3&&mesesAportados('b')>=3}
function chanchi(rachaMirar){
  if(rachaMirar<=0)return{e:'😴',t:'Chanchi está dormido',m:'Ábreme aunque sea solo a mirar, sin anotar nada. Eso ya cuenta.'};
  if(rachaMirar<3)return{e:'🙂',t:'Chanchi te saluda',m:'Viniste. Eso ya es más de lo que hace la mayoría.'};
  if(rachaMirar<7)return{e:'😊',t:'Chanchi está contento',m:'Ya casi es costumbre mirar tus cuentas sin miedo.'};
  if(rachaMirar<30)return{e:'🔥',t:'Chanchi está que arde',m:rachaMirar+' días seguidos mirando de frente tu plata.'};
  return{e:'🌟',t:'Chanchi brilla',m:'Un mes entero sin esconderte de tus cuentas. Esto ya es tuyo.'}
}
function marcarVisita(bloque){
  var hoy=toISO(HOY);
  if(!D.visitas)D.visitas={a:{},b:{},casa:{}};
  if(!D.visitas[bloque])D.visitas[bloque]={};
  if(!D.visitas[bloque][hoy]){
    D.visitas[bloque][hoy]=true;
    var actual=rachaDesde(D.visitas[bloque]);
    if(!D.rachaMirarMax)D.rachaMirarMax={a:0,b:0,casa:0};
    if(!D.rachaMirarMax[bloque]||actual>D.rachaMirarMax[bloque])D.rachaMirarMax[bloque]=actual;
    save(D)
  }
}

function calcProyecto(p){
  var mv=D.movs.filter(function(m){return m.proyectoId===p.id&&viva(m)});
  var ing=mv.filter(function(m){return m.tipo==='ingreso'}).reduce(function(s,m){return s+m.monto},0);
  var gas=mv.filter(function(m){return m.tipo==='gasto'}).reduce(function(s,m){return s+m.monto},0);
  var puso={casa:0,a:0,b:0}, recibio={casa:0,a:0,b:0};
  mv.forEach(function(m){
    if(m.tipo==='gasto')puso[m.bloque]=(puso[m.bloque]||0)+m.monto;
    else recibio[m.bloque]=(recibio[m.bloque]||0)+m.monto});
  var util=ing-gas;
  var toca={a:util*(p.reparto.a||0)/100,b:util*(p.reparto.b||0)/100};
  return {mv:mv,ing:ing,gas:gas,util:util,puso:puso,recibio:recibio,toca:toca}
}

/* ===== conciliación contra extracto ===== */
function leerExtracto(txt){
  var out=[], lineas=String(txt).split(/[\r\n]+/);
  lineas.forEach(function(L){
    if(!L||L.length<8)return;
    var f=L.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);
    if(!f)return;
    var montos=L.replace(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g,' ')
      .match(/-?\$?\s?\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|-?\$?\s?\d{4,}/g);
    if(!montos||!montos.length)return;
    var crudo=montos[montos.length-1];
    var neg=/-/.test(crudo)||/(RETIRO|PAGO|COMPRA|DEBITO|CARGO|TRANSF ENVIAD)/i.test(L);
    var num=Number(crudo.replace(/[^0-9]/g,''));
    if(!num)return;
    var yy=f[3]?(f[3].length===2?'20'+f[3]:f[3]):String(ANIO);
    var fecha=yy+'-'+pad(Number(f[2]))+'-'+pad(Number(f[1]));
    if(Number(f[1])>12&&Number(f[2])<=12){} else if(Number(f[2])>12){fecha=yy+'-'+pad(Number(f[1]))+'-'+pad(Number(f[2]))}
    var desc=L.replace(/[\d.,$\/\-]{4,}/g,' ').replace(/\s+/g,' ').trim().slice(0,42);
    out.push({fecha:fecha,monto:num,tipo:neg?'gasto':'ingreso',desc:desc})});
  return out
}
function compararExtracto(cuentaId,txt){
  var filas=leerExtracto(txt);
  var propios=D.movs.filter(function(m){return m.cuentaId===cuentaId&&viva(m)});
  var usados={}, ok=[], huerfanas=[];
  filas.forEach(function(f){
    var enc=null;
    for(var i=0;i<propios.length;i++){
      var m=propios[i];
      if(usados[m.id])continue;
      if(Math.round(m.monto)!==Math.round(f.monto))continue;
      var dif=Math.abs(new Date(m.fecha+'T00:00:00')-new Date(f.fecha+'T00:00:00'))/3600000;
      if(dif<=48){enc=m;break}}
    if(enc){usados[enc.id]=1;ok.push({f:f,m:enc})}else huerfanas.push(f)});
  return {total:filas.length,ok:ok,huerfanas:huerfanas}
}

    var dest=v, cta=cuentaDe(dest);

      grupo:grupoDe(pe.categoria,pe.tipo),nota:pe.comercio,clase:pe.tipo==='gasto'?'vital':'variable',
      bloque:dest,cuentaId:cta,renta:'',porCuentaDe:null,proyectoId:null,estado:'activa',
      origen:'correo',fuente:pe.tipo==='ingreso'?pe.comercio:''});
    pe.estado='aceptado';pe.dia=toISO(HOY);pe.bloque=dest;
    commit();avisar('Anotado en '+nomB(dest));return}
  if(a==='descartar'){
    D.pendientes.forEach(function(p){if(p.id===id){p.estado='descartado';p.dia=toISO(HOY)}});
    commit();avisar('Descartado');return}
  if(a==='lineabase'){
    var yo=B==='casa'?'a':B;
    abrir('base','Punto de partida · Formulario 210',{anio:ANIO-1,amb:yo,pb:0,de:0,pl:0,ib:0,rt:0});return}
  if(a==='savebase'){
    var amb=F.amb||'a';
    D.base=D.base.filter(function(x){return !(x.ambito===amb&&x.anio===F.anio)});
    D.base.push({id:uid(),ambito:amb,anio:F.anio,pb:F.pb||0,deudas:F.de||0,pl:F.pl||0,
      ingresos:F.ib||0,retenciones:F.rt||0});
    if(F.pb>0)D.activos.push({id:uid(),bloque:amb,nombre:'Patrimonio declarado '+F.anio,
      tipo:'otroa',valor:F.pb});
    SHEET=null;F={};commit();avisar('Línea base fijada');return}
  if(a==='ctarapida'){F.nombre=v;
    F.tipo=(v==='Nequi'||v==='Daviplata'||v==='Addi')?'billetera':(v==='Efectivo'?'efectivo':'ahorros');
    render();return}
  if(a==='sim'){SIM[id]=Number(v)||0;render();return}
  if(a==='copiar'){copiar(el.dataset.txt||'');return}
  if(a==='eddeuda'){abrir('deuda','Editar deuda',JSON.parse(JSON.stringify(D.deudas.filter(function(x){return x.id===id})[0])));return}
  if(a==='savedeuda'){
    var nd={nombre:F.nombre,saldo:F.saldo,cuota:F.cuota,dia:F.dia,bloque:B,
      cuotasTotal:F.cuotasTotal||0,cuotasPagadas:F.cuotasPagadas||0,tipo:F.tipo||'consumo',
      grupo:F.grupo||'bancario',avisar:F.avisar==='no'?'no':'si',
      entidad:(F.entidad||'').trim(),montoOriginal:F.montoOriginal||0,
      numeroCuenta:(F.numeroCuenta||'').trim(),referencia:(F.referencia||'').trim(),
      convenio:(F.convenio||'').trim(),tasa:F.tasa||'',notas:(F.notas||'').trim()};
    if(F.id){nd.id=F.id;D.deudas=D.deudas.map(function(x){return x.id===F.id?nd:x})}
    else{nd.id=uid();D.deudas.push(nd)}
    SHEET=null;F={};commit();return}
  if(a==='deldeuda'){D.deudas=D.deudas.filter(function(x){return x.id!==F.id});SHEET=null;F={};commit();return}
  if(a==='abonar'){var dz=D.deudas.filter(function(x){return x.id===id})[0];
    abrir('abono','Pagar '+dz.nombre,{deudaId:dz.id,monto:dz.cuota||0,modo:'cuota'});return}
  if(a==='saveabono'){
    var d2=D.deudas.filter(function(x){return x.id===F.deudaId})[0];
    d2.saldo=Math.max(0,d2.saldo-F.monto);
    if(F.modo==='cuota'&&d2.cuotasTotal>0)d2.cuotasPagadas=Math.min(d2.cuotasTotal,(d2.cuotasPagadas||0)+1);
    D.movs.push({id:uid(),fecha:toISO(HOY),tipo:'gasto',monto:F.monto,categoria:'deuda',
      nota:(F.modo==='cuota'?'Cuota de ':'Abono extra a ')+d2.nombre,bloque:B,cuentaId:cuentaDe(B),
      deudaId:d2.id,clase:'vital',renta:'',porCuentaDe:null,amortizacion:d2.tipo==='patrimonial'});
    SHEET=null;F={};commit();return}

  /* metas */
  if(a==='nuevameta'){abrir('meta','Nueva meta',{nombre:'',objetivo:0,ahorrado:0,fecha:''});return}
  if(a==='edmeta'){abrir('meta','Editar meta',JSON.parse(JSON.stringify(D.metas.filter(function(x){return x.id===id})[0])));return}
  if(a==='savemeta'){
    if(F.id)D.metas=D.metas.map(function(x){return x.id===F.id?
      {id:F.id,bloque:B,nombre:F.nombre,objetivo:F.objetivo,ahorrado:F.ahorrado,fecha:F.fecha||''}:x});
    else D.metas.push({id:uid(),bloque:B,nombre:F.nombre,objetivo:F.objetivo,ahorrado:F.ahorrado||0,fecha:F.fecha||''});
    SHEET=null;F={};commit();return}
  if(a==='delmeta'){D.metas=D.metas.filter(function(x){return x.id!==F.id});SHEET=null;F={};commit();return}
  if(a==='aportarmeta'){var mt=D.metas.filter(function(x){return x.id===id})[0];
    abrir('aportarmeta','Abonar a '+mt.nombre,{metaId:mt.id,monto:0});return}
  if(a==='saveaportemeta'){
    var m2=D.metas.filter(function(x){return x.id===F.metaId})[0];
    m2.ahorrado=(m2.ahorrado||0)+F.monto;
    D.movs.push({id:uid(),fecha:toISO(HOY),tipo:'gasto',monto:F.monto,categoria:'meta',nota:'Abono a '+m2.nombre,
      bloque:B,cuentaId:cuentaDe(B),metaId:m2.id,clase:'vital',renta:'',porCuentaDe:null});
    SHEET=null;F={};commit();return}

  /* entre bloques */
  if(a==='saldar'){abrir('saldar','Saldar con '+nomB(id),{otro:id});return}
  if(a==='savesaldar'){
    var o=F.otro, s=saldoEntre(B,o), abs=Math.abs(s);
    if(abs>0){
      var acreedor=s>0?B:o, deudor=s>0?o:B;
      D.movs.push({id:uid(),fecha:toISO(HOY),tipo:'ingreso',monto:abs,categoria:'reembolso',
        nota:'Reembolso de '+nomB(deudor),bloque:acreedor,cuentaId:cuentaDe(acreedor),clase:'variable',renta:'',porCuentaDe:null});
      D.movs.push({id:uid(),fecha:toISO(HOY),tipo:'gasto',monto:abs,categoria:'reembolso',
        nota:'Reembolso a '+nomB(acreedor),bloque:deudor,cuentaId:cuentaDe(deudor),clase:'vital',renta:'',porCuentaDe:null});
      D.movs.forEach(function(m){
        if(m.porCuentaDe&&!m.saldado&&((m.bloque===B&&m.porCuentaDe===o)||(m.bloque===o&&m.porCuentaDe===B)))m.saldado=true})}
    SHEET=null;F={};commit();return}

  /* patrimonio */
  if(a==='nuevoactivo'){abrir('activo','Nuevo bien',{nombre:'',valor:0,tipo:'ahorro'});return}
  if(a==='edactivo'){abrir('activo','Editar bien',JSON.parse(JSON.stringify(D.activos.filter(function(x){return x.id===id})[0])));return}
  if(a==='saveactivo'){
    if(F.id)D.activos=D.activos.map(function(x){return x.id===F.id?{id:F.id,bloque:B,nombre:F.nombre,valor:F.valor,tipo:F.tipo}:x});
    else D.activos.push({id:uid(),bloque:B,nombre:F.nombre,valor:F.valor,tipo:F.tipo});
    SHEET=null;F={};commit();return}
  if(a==='delactivo'){D.activos=D.activos.filter(function(x){return x.id!==F.id});SHEET=null;F={};commit();return}

  /* notas */
  if(a==='nuevanota'){abrir('nota','Nueva anotación',{texto:'',tipo:'pendiente',monto:0});return}
  if(a==='savenota'){D.notas.push({id:uid(),bloque:B,tipo:F.tipo,texto:F.texto,monto:F.monto||0,fecha:toISO(HOY),hecho:false});
    SHEET=null;F={};commit();return}
  if(a==='tognota'){D.notas.forEach(function(n){if(n.id===id)n.hecho=!n.hecho});commit();return}
  if(a==='delnota'){D.notas=D.notas.filter(function(n){return n.id!==id});commit();return}

  /* cuentas */
  if(a==='nuevacuenta'){abrir('cuenta','Nueva cuenta',{nombre:'',saldoInicial:0,res:'no',tipo:'ahorros'});return}
  if(a==='edcuenta'){var cu=D.cuentas.filter(function(x){return x.id===id})[0];
    abrir('cuenta','Editar cuenta',{id:cu.id,nombre:cu.nombre,saldoInicial:cu.saldoInicial,res:cu.reserva?'si':'no',tipo:cu.tipo||'corriente'});return}
  if(a==='transferir'){var ms=D.cuentas.filter(function(x){return x.bloque===B});
    abrir('traslado','Mover plata entre cuentas',{origen:(ms[0]||{}).id,destino:(ms[1]||ms[0]||{}).id,monto:0});return}
  if(a==='savetraslado'){
    if(F.origen!==F.destino&&F.monto>0){
      var no=D.cuentas.filter(function(x){return x.id===F.destino})[0]||{nombre:''};
      var nn=D.cuentas.filter(function(x){return x.id===F.origen})[0]||{nombre:''};
      D.movs.push({id:uid(),fecha:toISO(HOY),tipo:'gasto',monto:F.monto,categoria:'otro',nota:'Traslado a '+no.nombre,
        bloque:B,cuentaId:F.origen,traslado:true,clase:'vital',renta:'',porCuentaDe:null});
      D.movs.push({id:uid(),fecha:toISO(HOY),tipo:'ingreso',monto:F.monto,categoria:'otroi',nota:'Traslado desde '+nn.nombre,
        bloque:B,cuentaId:F.destino,traslado:true,clase:'variable',renta:'',porCuentaDe:null})}
    SHEET=null;F={};commit();return}
  if(a==='setdias'){D.alertas.dias=Number(v)||5;commit();return}
  if(a==='setfrec'){D.alertas.frecuencia=v;commit();return}
  if(a==='setdiasem'){D.alertas.diaSemana=Number(v);commit();return}
  if(a==='togavisofijo'){D.fijos.forEach(function(f){if(f.id===id)f.avisar=(f.avisar==='no'?'si':'no')});commit();return}
  if(a==='togavisodeuda'){D.deudas.forEach(function(x){if(x.id===id)x.avisar=(x.avisar==='no'?'si':'no')});commit();return}
  if(a==='pedirnotif'){pedirNotif();return}
  if(a==='ics'){
    var bl=(v==='todos')?['casa','a','b']:[v];
    bajar('pagos-jm-'+(v==='todos'?'todo':v)+'.ics',generarICS(bl),'text/calendar');
    MSG='Calendario descargado.';render();return}
  if(a==='savecuenta'){
    var nc={nombre:F.nombre,bloque:B,tipo:F.tipo||'corriente',saldoInicial:F.saldoInicial||0,reserva:F.res==='si'};
    if(F.id){nc.id=F.id;D.cuentas=D.cuentas.map(function(x){return x.id===F.id?nc:x})}
    else{nc.id=uid();D.cuentas.push(nc)}
    SHEET=null;F={};commit();return}
  if(a==='delcuenta'){D.cuentas=D.cuentas.filter(function(x){return x.id!==F.id});SHEET=null;F={};commit();return}
  if(a==='conciliar'){abrir('conciliar','Conciliar con el banco',{cuentaId:id,real:0});return}
  if(a==='extracto'){abrir('extracto','Auditar contra el extracto',{cuentaId:id,texto:'',res:null});return}
  if(a==='analizarextracto'){F.res=compararExtracto(F.cuentaId,F.texto||'');render();return}
  if(a==='huerfana'){
    var x=F.res.huerfanas[Number(id)];if(!x)return;
    D.movs.push({id:uid(),fecha:x.fecha,tipo:x.tipo,monto:x.monto,
      categoria:x.tipo==='gasto'?'otro':'otroi',grupo:'otros',nota:x.desc||'Del extracto',
      clase:x.tipo==='gasto'?'vital':'variable',bloque:B,cuentaId:F.cuentaId,renta:'',
      porCuentaDe:null,proyectoId:null,estado:'activa',verificado:true});
    F.res.huerfanas.splice(Number(id),1);F.res.ok.push({});commit();return}
  if(a==='nuevoproyecto'){abrir('proyecto','Nuevo proyecto',{nombre:'',pa:50,notas:'',act:'si'});return}
  if(a==='edproyecto'){var pz=proyecto(id);
    abrir('proyecto','Editar proyecto',{id:pz.id,nombre:pz.nombre,pa:pz.reparto.a,notas:pz.notas||'',
      act:pz.activo===false?'no':'si'});return}
  if(a==='saveproyecto'){
    var pa2=F.pa===undefined?50:Number(F.pa);
    var np={nombre:F.nombre,reparto:{a:pa2,b:100-pa2},notas:(F.notas||'').trim(),activo:F.act!=='no'};
    if(F.id){np.id=F.id;D.proyectos=D.proyectos.map(function(x){return x.id===F.id?np:x})}
    else{np.id=uid();D.proyectos.push(np)}
    SHEET=null;F={};commit();return}
  if(a==='delproyecto'){
    D.proyectos=D.proyectos.filter(function(x){return x.id!==F.id});
    D.movs.forEach(function(m){if(m.proyectoId===F.id)m.proyectoId=null});
    SHEET=null;F={};commit();return}
  if(a==='anular'){
    D.movs.forEach(function(m){if(m.id===id)m.estado=(m.estado==='anulada'?'activa':'anulada')});
    avisar('Movimiento anulado. Queda en la historia.');commit();return}
  if(a==='saveconciliar'){
    var cx=D.cuentas.filter(function(x){return x.id===F.cuentaId})[0];
    var cc2=calc(B), act=cc2.saldoCuenta(cx), dif=F.real-act;
    if(dif!==0)D.movs.push({id:uid(),fecha:toISO(HOY),tipo:dif>0?'ingreso':'gasto',monto:Math.abs(dif),
      categoria:'ajuste',nota:'Ajuste de saldo real',bloque:B,cuentaId:cx.id,ajuste:true,clase:dif>0?'extra':'vital',
      renta:'',porCuentaDe:null});
    SHEET=null;F={};commit();return}
  if(a==='edreparto'){abrir('reparto','Reparto de los gastos',{a:D.reparto.a});return}
  if(a==='savereparto'){var pa=Math.max(0,Math.min(100,F.a||0));D.reparto={a:pa,b:100-pa};SHEET=null;F={};commit();return}

  if(a==='export'){bajar('jm-cuentas-'+toISO(HOY)+'.json',JSON.stringify(D,null,2),'application/json');return}
  if(a==='exportrenta'){
    var f=['Fecha;Bloque;Tipo;Concepto;Etiqueta;Monto'];
    D.movs.filter(function(m){return m.bloque===B&&m.renta&&m.fecha.slice(0,4)===String(ANIO)})
      .sort(function(x,y){return x.fecha.localeCompare(y.fecha)})
      .forEach(function(m){f.push([m.fecha,nomB(m.bloque),m.tipo,(m.nota||catNom(m.categoria)).replace(/;/g,','),
        rentaNom(m.renta),m.monto].join(';'))});
    bajar('renta-'+ANIO+'-'+B+'.csv','\ufeff'+f.join('\n'),'text/csv');return}
  if(a==='demo'){D=DEMO();MSG='Datos de ejemplo cargados.';commit();return}
  if(a==='reset'){if(confirm('Se borra todo y queda en blanco. ¿Seguimos?')){
    D=esCasa()?VACIO_CASA(D.personas.a,D.personas.b):VACIO_PERSONAL(SESION.nombre||D.personas.a);
    MSG='Todo limpio.';commit()}return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&SHEET)cerrar()});

/* ===== arranque ===== */
cargarSesion();
var entro=capturarSesion();
if(entro==='recovery'){VIEW='nuevaclave';render()}
else if(entro===true&&!SESION.usuarioId){
  /* venimos de abrir el enlace de confirmación de correo: el hash trae el
     token pero no el usuario — hay que pedirlo antes de seguir */
  render();
  api('/auth/v1/user').then(chk).then(function(u){
    if(u&&u.id){SESION.usuarioId=u.id;SESION.correo=u.email||SESION.correo;guardarSesion()}
    arrancarSesion()
  }).catch(function(){SESION.estado='error';SESION.error='No se pudo completar tu sesión. Entra con tu correo y clave.';render()})
}
else if(autenticado()){arrancarSesion()}
else{render()}
})();

</script>
</body>
