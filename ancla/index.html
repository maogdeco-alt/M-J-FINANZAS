<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ancla</title>
<meta name="description" content="Un ancla para los días donde todo cuesta.">
<meta name="theme-color" content="#0e7c86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ancla">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece3d1; --card:#faf7f0; --ink:#161f22; --sub:#5c6a68; --teal:#0b4247; --teal-d:#082e32;
  --coral:#b25e39; --mint:#dbe1cd; --mint-ink:#37402c; --line:#dccfb3; --warn:#9c3a1e;
  --radius:14px; --radius-s:9px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a1213; --card:#131e20; --ink:#edf1ea; --sub:#8fa09c; --teal:#2f99a1; --teal-d:#1c6a70;
    --coral:#d9895c; --mint:#232c1d; --mint-ink:#c2d3a9; --line:#263335; --warn:#ff9a6b;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  min-height:100vh;
}
button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer}
button:active{transform:scale(.97)}
input, select, textarea{font-family:inherit; color:inherit}
h1,h2,h3,p{margin:0}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.envolt{max-width:540px; margin:0 auto; padding:18px 16px 6px}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 4px}
.marca-row{display:flex; align-items:center; gap:8px}
.marca{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:23px; letter-spacing:.1px; color:var(--ink)}
.beta-tag{font-family:var(--font-mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; background:none; color:var(--coral); padding:2px 0 2px 8px; border-left:1.5px solid var(--line)}
.topbar-der{display:flex; align-items:center; gap:10px}
.fecha{font-size:12px; color:var(--sub); text-transform:capitalize; letter-spacing:.1px}
.saludo-nombre{font-family:var(--font-display); font-style:italic; font-size:16px; color:var(--ink); font-weight:500; margin:2px 2px 12px}

.card{background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); border:1px solid var(--line)}
.card h3{font-family:var(--font-display); font-weight:600; font-size:17px; margin-bottom:4px; letter-spacing:.1px}
.sub{color:var(--sub); font-size:13px; line-height:1.55}

.banner{background:var(--mint); color:var(--mint-ink); border-radius:var(--radius-s); padding:13px 14px; margin-bottom:14px; font-size:13.5px; line-height:1.5; display:flex; gap:10px; align-items:flex-start}
.banner .acciones{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.banner .acciones button{background:var(--mint-ink); color:var(--mint); padding:7px 12px; border-radius:20px; font-size:12.5px; font-weight:600}

.boya-wrap{display:flex; flex-direction:column; gap:12px}
.boya-escenario{position:relative; width:100%; height:230px}
.boya-escenario-fondo{position:absolute; inset:0; border-radius:var(--radius); overflow:hidden; background:linear-gradient(160deg, var(--teal), var(--teal-d)); box-shadow:0 4px 14px rgba(14,124,134,.3)}
.boya{position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; border:none; background:none; padding:0 0 6px; cursor:pointer}
.boya svg{height:97%; width:auto; animation:respirar 4.2s ease-in-out infinite; transform-origin:bottom center; transform-box:fill-box}
.boya.tocada svg{animation:saludo .6s ease}
@keyframes respirar{ 0%,100%{transform:translateY(0) scale(1,1)} 50%{transform:translateY(-2.5px) scale(1.012,1.02)} }
@keyframes saludo{ 0%,100%{transform:rotate(0) scale(1)} 30%{transform:rotate(-3deg) scale(1.04)} 60%{transform:rotate(2deg) scale(1.04)} }
.boya-info-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
.ojo-parpadeo{animation:parpadeo 5.5s ease-in-out infinite}
@keyframes parpadeo{ 0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)} }
.cola-nutria{animation:colazo 4.2s ease-in-out infinite; transform-box:fill-box}
@keyframes colazo{ 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-4deg)} }
.brazo-nutria{transform-box:fill-box}
.boya.tocada .brazo-nutria{animation:saludoBrazo .65s ease}
@keyframes saludoBrazo{ 0%,100%{transform:rotate(0deg)} 35%{transform:rotate(-18deg)} 65%{transform:rotate(8deg)} }
.globo-dialogo{position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); background:var(--card); color:var(--ink); padding:10px 14px; border-radius:14px; font-size:13px; font-weight:600; max-width:240px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.18); animation:globoPop .25s ease; z-index:5}
.globo-dialogo:after{content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color:var(--card)}
@keyframes globoPop{ 0%{opacity:0; transform:translateX(-50%) translateY(6px) scale(.9)} 100%{opacity:1; transform:translateX(-50%) translateY(0) scale(1)} }

.huevo-wrap{display:flex; flex-direction:column; align-items:center; padding:26px 0 10px}
.huevo-svg{width:150px; height:180px; cursor:pointer; filter:drop-shadow(0 10px 18px rgba(0,0,0,.15))}
.huevo-svg.tambalea{animation:tambaleo .55s ease}
@keyframes tambaleo{ 0%,100%{transform:rotate(0)} 20%{transform:rotate(-8deg)} 40%{transform:rotate(7deg)} 60%{transform:rotate(-5deg)} 80%{transform:rotate(4deg)} }
.nace-retrato{width:130px; height:130px; margin:0 auto}
.boya-txt{flex:1; min-width:0}
.boya-txt .titulo{font-weight:700; font-size:15.5px; margin-bottom:2px}
.boya-txt .sub{font-size:13px}
.ver-boya-link{font-size:12px; font-weight:700; color:var(--mint-ink); margin-top:8px; display:inline-flex; align-items:center; gap:5px; background:var(--mint); padding:6px 12px; border-radius:20px}

.conchitas-chip{font-family:var(--font-mono); display:flex; align-items:center; gap:4px; background:var(--mint); color:var(--mint-ink); font-weight:600; font-size:12.5px; padding:5px 10px; border-radius:20px; transition:transform .15s}
.conchitas-chip.pulso{animation:pulso-conchita .4s ease}
@keyframes pulso-conchita{ 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }

.boya-panel-header{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.boya-panel-header button{font-size:14px; font-weight:700; color:var(--teal-d); display:flex; align-items:center; gap:4px}
@media (prefers-color-scheme:dark){ .boya-panel-header button{color:var(--teal)} }
.boya-retrato-wrap{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px}
.boya-retrato{position:relative; width:150px; height:150px; border-radius:50%; overflow:hidden; background:linear-gradient(160deg, var(--teal), var(--teal-d)); box-shadow:0 8px 24px rgba(14,124,134,.3)}
.boya-retrato svg{width:88%; height:88%; position:absolute; left:6%; top:6%; animation:respirar 4.2s ease-in-out infinite; transform-box:fill-box}
.boya-nombre-fila{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px}
.boya-nombre-fila input{font-family:var(--font-display); font-style:italic; font-size:22px; font-weight:600; text-align:center; border:none; background:none; color:var(--ink); width:auto; max-width:200px; border-bottom:1.5px dashed var(--line); padding:2px 4px}
.vinculo-barra{margin-top:14px; width:100%}
.subtabs{display:flex; gap:8px; margin:16px 0 14px; background:var(--bg); padding:4px; border-radius:20px}
.subtabs button{flex:1; padding:9px; border-radius:16px; font-size:13px; font-weight:700; color:var(--sub)}
.subtabs button.act{background:var(--card); color:var(--teal-d); box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){ .subtabs button.act{color:var(--teal)} }
.tienda-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.tienda-item{background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:14px 10px; text-align:center}
.tienda-item .emo{font-size:28px}
.tienda-item .nom{font-size:12.5px; font-weight:700; margin-top:6px}
.tienda-item .precio{font-size:12px; color:var(--sub); margin-top:2px}
.tienda-item button{margin-top:10px; width:100%; padding:8px; border-radius:14px; font-size:12px; font-weight:700; background:var(--coral); color:#fff}
.tienda-item button:disabled{background:var(--line); color:var(--sub)}
.tienda-item.puesto{border-color:var(--teal); background:var(--mint)}
.tienda-item .candado{font-size:10.5px; color:var(--sub); margin-top:8px}

.respirar-circulo-wrap{display:flex; flex-direction:column; align-items:center; padding:30px 10px 10px}
.respirar-circulo{width:190px; height:190px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--teal), var(--teal-d)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#fff; font-size:16px; font-weight:700; transition:transform 4s ease-in-out; box-shadow:0 10px 34px rgba(14,124,134,.35)}
.respirar-nutria{width:78px; height:78px}
.respirar-nutria svg{width:100%; height:100%}
.respirar-texto{text-align:center; padding:0 10px}
.respirar-circulo.chico{transform:scale(.72)}
.respirar-circulo.grande{transform:scale(1)}
.aterrizaje-paso{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-s); padding:20px; text-align:center; margin-top:16px}
.aterrizaje-paso .num{font-size:12px; color:var(--sub); font-weight:700; margin-bottom:8px}
.aterrizaje-paso .txt{font-size:16px; font-weight:600; line-height:1.5}

.grid-cats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:16px}
@media(min-width:420px){.grid-cats{grid-template-columns:repeat(4,1fr)}}
.cat{background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:14px 8px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; transition:all .12s}
.cat .emo{font-size:26px; line-height:1}
.cat .et{font-size:11.5px; font-weight:600; color:var(--sub)}
.cat.on{background:var(--mint); border-color:var(--teal)}
.cat.on .et{color:var(--mint-ink)}
.cat .badge-n{font-size:10.5px; font-weight:700; background:var(--teal); color:#fff; border-radius:20px; padding:1px 7px; margin-top:-2px}
.cat.on .badge-n{background:var(--teal-d)}
.agua-row{display:flex; align-items:center; justify-content:center; gap:4px; margin-top:2px}
.agua-row button{width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.08); font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center}

.nivel-card{background:linear-gradient(160deg, var(--teal-d), var(--teal)); color:#fff; border-radius:var(--radius); padding:18px; margin-bottom:14px}
.nivel-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.nivel-top .l{font-weight:700; font-size:15px}
.nivel-top .l span{display:block; font-weight:400; font-size:12.5px; opacity:.85; margin-top:2px}
.nivel-top .r{font-family:var(--font-mono); font-size:14px; font-weight:600; text-align:right; white-space:nowrap}
.nivel-top .r span{display:block; font-weight:400; font-size:11px; opacity:.85}
.bar{background:rgba(255,255,255,.18); height:8px; border-radius:20px; margin-top:14px; overflow:hidden}
.bar i{display:block; height:100%; background:#fff; border-radius:20px; transition:width .5s ease}
.medallas-mini{display:flex; gap:8px; margin-top:14px; align-items:center}
.medallas-mini span{font-size:19px; opacity:.5}
.medallas-mini span.on{opacity:1}
.medallas-mini button{font-family:var(--font-mono); margin-left:auto; font-size:12px; font-weight:500; background:rgba(255,255,255,.16); padding:5px 10px; border-radius:20px}

.medallas-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px}
@media(max-width:380px){.medallas-grid{grid-template-columns:repeat(4,1fr)}}
.medalla{background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:10px 4px; text-align:center; font-size:22px; opacity:.35}
.medalla.on{opacity:1; background:var(--mint)}
.medalla-desc{font-size:10.5px; color:var(--sub); margin-top:12px; line-height:1.5}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:13px 18px; border-radius:10px; font-weight:600; font-size:14.5px; letter-spacing:.1px}
.btn-principal{background:var(--coral); color:#fff; width:100%}
.btn-fantasma{background:var(--bg); border:1.5px solid var(--line); color:var(--ink)}
.btn-chico{padding:8px 14px; font-size:12.5px; border-radius:8px}

.fila-input{display:flex; gap:8px}
.fila-input input[type=text]{flex:1; padding:12px 14px; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px}

.ropa-lista{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.ropa-item{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:12px; padding:10px 12px; font-size:13.5px}
.ropa-item .t{flex:1}
.ropa-item button{color:var(--warn); font-size:16px; padding:2px 4px}
.elegida{background:var(--mint); color:var(--mint-ink); border-radius:var(--radius-s); padding:20px; text-align:center; margin-top:14px}
.elegida .grande{font-family:var(--font-display); font-style:italic; font-size:21px; font-weight:600; margin:6px 0 14px}

.pasos{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.paso{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:12px; padding:12px 13px; font-size:13.5px}
.paso .c{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:12px}
.paso.hecho{opacity:.5}
.paso.hecho .c{background:var(--teal); border-color:var(--teal); color:#fff}
.paso.hecho .t{text-decoration:line-through}

.pendiente-card{background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-s); padding:14px; margin-top:10px}
.pendiente-top{display:flex; align-items:flex-start; gap:10px}
.pendiente-top .t{flex:1; font-weight:600; font-size:14px; line-height:1.4}
.pendiente-top button{color:var(--warn); font-size:16px; padding:2px 4px}

.rutina-card.completa{border-color:var(--teal)}
.rutina-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.rutina-top button{font-size:12px; font-weight:600; color:var(--sub)}
.rutina-borrar{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap}
.paso-editable{display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:10px; padding:8px 10px; font-size:13px}
.paso-editable .t{flex:1}
.paso-editable button{color:var(--warn); font-size:14px}

.momento-titulo{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px}
.momento-chip{font-family:var(--font-mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--coral); background:var(--mint); padding:3px 8px; border-radius:20px}
.card.momento-actual{border-color:var(--coral)}
.cat-wrap{position:relative}
.foto-agregar, .foto-mini{position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; background:var(--card); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.15); cursor:pointer}
.foto-mini img{width:100%; height:100%; object-fit:cover}
.visor-foto img{width:100%; border-radius:10px; display:block}

.calma-picker{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
.calma-picker button{background:var(--card); border:1.5px solid var(--line); padding:9px 14px; border-radius:20px; font-size:13px; font-weight:600; color:var(--sub)}
.calma-picker button.act{background:var(--teal); border-color:var(--teal); color:#fff}
.escena-calma{position:relative; height:220px; border-radius:var(--radius); overflow:hidden; background:linear-gradient(180deg, #cfe3e6 0%, #8fb8c2 38%, var(--teal) 60%, var(--teal-d) 100%)}
@media (prefers-color-scheme:dark){ .escena-calma{background:linear-gradient(180deg, #1a2a30 0%, #123238 38%, var(--teal-d) 60%, #061518 100%)} }
.escena-ola{position:absolute; left:-10%; width:120%; height:70px; border-radius:45%; opacity:.5}
.escena-ola.o1{bottom:-20px; background:var(--teal-d); animation:olear 9s ease-in-out infinite}
.escena-ola.o2{bottom:-35px; background:var(--teal); opacity:.35; animation:olear 7s ease-in-out infinite reverse}
@keyframes olear{ 0%,100%{transform:translateX(-3%) scaleY(1)} 50%{transform:translateX(3%) scaleY(1.3)} }
.escena-nutria{position:absolute; left:50%; bottom:34px; width:70px; height:70px; transform:translateX(-50%); animation:flotarEscena 4s ease-in-out infinite}
@keyframes flotarEscena{ 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-9px)} }
.escena-texto{position:absolute; left:0; right:0; top:16px; text-align:center; color:#fff; font-size:12.5px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.25)}

.cuarto-boya{position:relative; width:100%; height:300px; border-radius:var(--radius); overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.15)}
.cuarto-pared{position:absolute; inset:0 0 34% 0}
.cuarto-piso{position:absolute; left:0; right:0; bottom:0; height:34%}
.cuarto-piso:before{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.14), transparent 40%)}
.cuarto-personaje{position:absolute; left:50%; bottom:0; transform:translateX(-50%); height:82%; display:flex; align-items:flex-end}
.cuarto-personaje svg{height:100%; width:auto; animation:respirar 4.2s ease-in-out infinite; transform-box:fill-box}
.cuarto-decor{position:absolute; font-size:34px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.25)); transition:filter .4s, opacity .4s}
.cuarto-decor.sucio{filter:grayscale(.75) brightness(.65); opacity:.75}
.cuarto-desorden{position:absolute; font-size:22px; opacity:.85; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.cuarto-velo{position:absolute; inset:0; background:rgba(20,20,25,.28); pointer-events:none; transition:opacity .4s}
.cuarto-brillo{position:absolute; inset:0; background:radial-gradient(ellipse at 50% 15%, rgba(255,255,255,.25), transparent 55%); pointer-events:none}
.cuarto-etiqueta{position:absolute; top:12px; left:12px; background:rgba(0,0,0,.35); color:#fff; font-size:11px; font-weight:700; padding:5px 11px; border-radius:20px; backdrop-filter:blur(2px)}
.cuarto-swatches{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px}
.swatches-label{font-size:12px; font-weight:700; color:var(--sub); margin-right:2px}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid var(--card); box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0; flex:none}
.swatch.act{box-shadow:0 0 0 2px var(--coral)}

.campo-fila{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.campo-fila:last-child{margin-bottom:0}
.campo-fila .l{font-size:14px; font-weight:600}
.campo-fila input[type=time]{border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:7px 9px; font-size:13.5px}
.campo-fila select{border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:7px 9px; font-size:13.5px}

.switch{position:relative; width:44px; height:26px; flex:none; border-radius:20px; background:var(--line); transition:.15s}

<script>
(function(){
"use strict";
var VERSION='0.9.0-beta';

/* ===================== utilidades ===================== */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hoyISO(){ return toISO(new Date()); }
function horaMin(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function normalizar(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function getPath(obj, path){ return path.split('.').reduce(function(o,k){ return (o===undefined||o===null) ? o : o[k]; }, obj); }
function setPath(obj, path, val){
  var partes=path.split('.'), o=obj;
  for(var i=0;i<partes.length-1;i++){ o=o[partes[i]]; }
  o[partes[partes.length-1]]=val;
}
function esc(s){
  return (s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function saludo(){
  var h=new Date().getHours();
  if(h<12) return 'Buenos días';

}

/* ===================== datos ===================== */

}

  fondo_atardecer:{grad:'linear-gradient(160deg, #ff9d6c, #d9634a)', pared:'linear-gradient(180deg, #ffcaa3, #ff9d6c)', piso:'#c96a45'},
  fondo_noche:{grad:'linear-gradient(160deg, #2b3a67, #0f1a3d)', pared:'linear-gradient(180deg, #3d4f8a, #1a2547)', piso:'#0b1530'},
  fondo_arrecife:{grad:'linear-gradient(160deg, #3fb8a3, #1a7f78)', pared:'linear-gradient(180deg, #7fd6c4, #3fb8a3)', piso:'#155f59'}
};
var PARED_DEFECTO='linear-gradient(180deg, #cfe3e6, #a9c8cd)';
var PISO_DEFECTO='#8a6d52';

var MENSAJES_BOYA=[
  'No tiene que ser perfecto. Tiene que ser hoy.',
  'Un dato, no una sentencia: hiciste algo. Eso es todo lo que esto mide.',
  'Cuando puedas, no cuando "deberías" — esa palabra no vive aquí.',
  'Tu cerebro está cableado distinto. Estar aquí ya es una decisión, no un accidente.',
  'No reparto puntos por sufrir de más. Ese negocio no es mío.',
  'Lo pequeño también es cuidado — solo que nadie te lo dijo con la seriedad que merece.',
  'Hoy no compite con ayer. Yo no llevo esa cuenta.',
  'Respira. Lo demás puede esperar cuatro segundos.',
  'La culpa nunca te hizo bañarte ni una sola vez. Probemos otra cosa.',
  'Volver cuenta. De hecho, cuenta más de lo que crees.',
  'Esto no es examen. No hay nota, ni curva, ni nadie decepcionado.',
  'No necesitas merecerlo. Necesitas hacerlo. Son cosas distintas.',
  '¿Sabías que las nutrias de mar duermen tomadas de la mano para no irse a la deriva? Yo hago algo parecido contigo, a mi manera.',
  'Si esto fuera examen, ya habrías reprobado por pensar que es examen.',
  'No tengo reloj, pero sé que este momento cuenta.',
  'Contarte estas cosas me hace sentir útil. Gracias por venir a buscarme.'
];
function mensajeAlTocar(){
  var stats=calcularEstadisticas();
  var cuenta=contarCategorias(entradaHoy());
  var h=new Date().getHours();
  var pool=MENSAJES_BOYA.slice();
  if(stats.racha>=30){
    pool=pool.concat([stats.racha+' días seguidos. A estas alturas esto ya es parte de quién eres.']);
  } else if(stats.racha>=7){
    pool=pool.concat([
      'Llevas '+stats.racha+' días seguidos. Eso no es casualidad.',
      stats.racha+' días. Te estás demostrando algo, aunque no lo digas en voz alta.'
    ]);
  }
  if(h<6 || h>=23){
    pool=pool.concat([
      '¿Despierta a esta hora? Yo también floto de noche a veces. No te voy a decir que deberías dormir.',
      'La madrugada pesa distinto. Aquí estoy, aunque no tenga mucho más que ofrecerte que compañía.'
    ]);
  } else if(cuenta===0 && h>=19){
    pool=pool.concat([
      'Hoy fue de esos días. Mañana es otra vez desde cero, sin arrastrar nada.',
      'No pasó mucho hoy y está bien. Ya estás aquí, conmigo.'
    ]);
  } else if(cuenta===0 && h<12){
    pool=pool.concat(['Recién empieza el día. Sin apuro, sin lista que cumplir todavía.']);
  }
  if(S.creado===hoyISO() && Object.keys(S.entradas).length<=1){
    pool=pool.concat(['Recién nos conocemos. Qué bueno que estás aquí.']);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

function estadoInicial(){
  return {
    version:2,
    creado:hoyISO(),
    onboardingVisto:false,
    usuario:{ nombre:'', foto:null },
    boya:{ nombre:'Boya' },
    modoSuave:false,
    efectos:true,
    nudgeVisto:null,
    aperturas:[],
    entradas:{},
    contadores:{ ropaUsos:0, tareasUsos:0, miniToques:0, tocarBoyaTotal:0, comprasTotal:0, conchitasGanadasTotal:0, pendientesResueltos:0, fotosTotal:0 },
    medallasGanadas:[],
    ropa:[],
    ropaHoy:null,
    tareaActual:null,
    miniRecordatorios:[],
    rutinas:[],
    rutinasHechas:{},
    pendientes:[],
    conchitas:0,
    comprados:[],
    equipado:{ sombrero:null, gafas:null, cuello:null, fondo:null },
    recordatorios:{
      activos:false,
      desayuno:{on:true, hora:'08:00'},
      almuerzo:{on:true, hora:'13:00'},
      cena:{on:true, hora:'19:30'},
      dormir:{on:true, hora:'22:30'},
      agua:{on:true, horas:2, ultimoMs:0},
      ultimoAviso:{}
    }
  };
}

var S = cargar();
function cargar(){
  try{
    var crudo=localStorage.getItem(CLAVE);
    if(!crudo) return estadoInicial();
    var d=JSON.parse(crudo);
    var base=estadoInicial();
    for(var k in base){ if(d[k]===undefined) d[k]=base[k]; }
    if(!d.recordatorios) d.recordatorios=base.recordatorios;
    else { for(var rk in base.recordatorios){ if(d.recordatorios[rk]===undefined) d.recordatorios[rk]=base.recordatorios[rk]; } }
    if(!d.contadores) d.contadores=base.contadores;
    else { ['ropaUsos','tareasUsos','miniToques','tocarBoyaTotal','comprasTotal','conchitasGanadasTotal','pendientesResueltos','fotosTotal'].forEach(function(ck){ if(d.contadores[ck]===undefined) d.contadores[ck]=0; }); }
    if(!d.usuario) d.usuario=base.usuario;
    else { if(d.usuario.nombre===undefined) d.usuario.nombre=''; if(d.usuario.foto===undefined) d.usuario.foto=null; }
    if(!d.boya) d.boya=base.boya;
    else if(d.boya.nombre===undefined) d.boya.nombre='Boya';
    if(!d.miniRecordatorios) d.miniRecordatorios=[];
    if(!d.rutinas) d.rutinas=[];
    if(!d.rutinasHechas) d.rutinasHechas={};
    if(!d.pendientes) d.pendientes=[];
    if(!d.medallasGanadas) d.medallasGanadas=[];
    if(d.conchitas===undefined) d.conchitas=0;
    if(!d.comprados) d.comprados=[];
    if(!d.equipado) d.equipado=base.equipado;
    else { ['sombrero','gafas','cuello','fondo'].forEach(function(sk){ if(d.equipado[sk]===undefined) d.equipado[sk]=null; }); }
    if(d.efectos===undefined) d.efectos=true;
    if(d.onboardingVisto===undefined) d.onboardingVisto=false;
    return d;
  }catch(e){ return estadoInicial(); }
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){}
}
function entradaHoy(){
  var iso=hoyISO();
  if(!S.entradas[iso]) S.entradas[iso]={ desayuno:false, almuerzo:false, cena:false, agua:0, ducha:false, bano:false, mover:false, dormir:false, extra:{}, fotos:{} };
  return S.entradas[iso];
}
function extraDeHoy(){
  var e=entradaHoy();
  if(!e.extra) e.extra={};
  return e.extra;
}
function fotosDeHoy(){
  var e=entradaHoy();
  if(!e.fotos) e.fotos={};
  return e.fotos;
}

/* ===================== rutinas ===================== */
var RUTINAS_SUGERIDAS=[
  {nombre:'Mañana', emo:'🌅', pasos:['Tomar agua','Medicación, si aplica','Ducha','Vestirme','Desayunar']},
  {nombre:'Antes de salir', emo:'🚪', pasos:['Llaves','Billetera y celular','Revisar la hora','Algo de comer, si hace falta']},
  {nombre:'Noche', emo:'🌙', pasos:['Lavarme la cara','Cepillarme los dientes','Dejar lista la ropa de mañana','Celular fuera de la cama']}
];
function pasosHechosHoy(rutinaId){
  var iso=hoyISO();
  if(!S.rutinasHechas[iso]) S.rutinasHechas[iso]={};
  if(!S.rutinasHechas[iso][rutinaId]) S.rutinasHechas[iso][rutinaId]=[];
  return S.rutinasHechas[iso][rutinaId];
}
function rutinaCompletaHoy(rutina){
  var hechos=pasosHechosHoy(rutina.id);
  return rutina.pasos.length>0 && rutina.pasos.every(function(p){ return hechos.indexOf(p.id)>=0; });
}
function rutinaRachaConsecutiva(rutina){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var n=0, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var hechos=(S.rutinasHechas[iso]&&S.rutinasHechas[iso][rutina.id])||[];
    var completa=rutina.pasos.length>0 && rutina.pasos.every(function(p){ return hechos.indexOf(p.id)>=0; });
    var esHoy=(cursor.getTime()===hoy.getTime());
    if(completa){ n++; }
    else if(esHoy){ /* hoy no cuenta en contra todavía */ }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return n;
}

/* ===================== cálculos del juego ===================== */
function contarCategorias(e){
  if(!e) return 0;
  var n=0;
  ['desayuno','almuerzo','cena','ducha','bano','mover','dormir'].forEach(function(k){ if(e[k]) n++; });
  if(e.agua>0) n++;
  return n;
}
var UMBRAL_DIA=3;

function calcularRacha(){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var streak=0, saltos=1, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var cuenta=contarCategorias(S.entradas[iso]);
    var esHoy=(cursor.getTime()===hoy.getTime());
    if(cuenta>=UMBRAL_DIA){ streak++; }
    else if(esHoy){ /* hoy no cuenta en contra, todavía no termina */ }
    else if(saltos>0){ saltos--; }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function calcularConsecutivos(campo){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var n=0, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var e=S.entradas[iso];
    var esHoy=(cursor.getTime()===hoy.getTime());
    var val = campo==='agua' ? (e && e.agua>0) : (e && e[campo]);
    if(val){ n++; }
    else if(esHoy){ /* hoy aún no cuenta en contra */ }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return n;
}
function detectarRegreso(){
  var dias=Object.keys(S.entradas).filter(function(k){ return contarCategorias(S.entradas[k])>0; }).sort();
  for(var i=1;i<dias.length;i++){
    var a=new Date(dias[i-1]+'T00:00:00'), b=new Date(dias[i]+'T00:00:00');
    var gap=Math.round((b-a)/86400000);
    if(gap>=3) return true;
  }
  return false;
}

function calcularEstadisticas(){
  var totalBool=0, totalAgua=0, desayunos=0, moverTotal=0, dormirTotal=0, aguaMaxDia=0;
  Object.keys(S.entradas).forEach(function(k){
    var e=S.entradas[k];
    ['desayuno','almuerzo','cena','ducha','bano','mover','dormir'].forEach(function(c){ if(e[c]) totalBool++; });
    totalAgua += (e.agua||0);
    if(e.desayuno) desayunos++;
    if(e.mover) moverTotal++;
    if(e.dormir) dormirTotal++;
    if(e.agua>aguaMaxDia) aguaMaxDia=e.agua;

function calcularProgreso(){
  var stats=calcularEstadisticas();
  var crudas=medallasCrudas(stats);
  var yaGanadas=S.medallasGanadas||[];
  var medallas=crudas.map(function(m){
    return {id:m.id, emo:m.emo, titulo:m.titulo, desc:m.desc, on:(m.cumple || yaGanadas.indexOf(m.id)>=0)};
  });
  var pts = stats.totalBool*3 + stats.totalAgua*1 + stats.racha*5 + stats.ropaUsos*2 + stats.tareasUsos*4 + stats.miniToques*2;
  var nivel=Math.min(NIVELES.length, Math.floor(Math.sqrt(pts/40))+1);
  var sigue=Math.pow(nivel,2)*40, previo=Math.pow(nivel-1,2)*40;
  var esMax=nivel>=NIVELES.length;
  return {
    pts:pts, nivel:nivel, nombre:NIVELES[nivel-1], esMax:esMax,
    prog: esMax ? 100 : Math.max(0, Math.min(100, Math.round((pts-previo)/(sigue-previo)*100))),
    faltan: esMax ? 0 : Math.max(0, sigue-pts),
    racha:stats.racha, medallas:medallas, ganadas:medallas.filter(function(m){ return m.on; }).length
  };
}
function mensajeBoya(cuenta){
  var n=(S.boya&&S.boya.nombre)||'Boya';
  if(cuenta<=0) return {id:'deriva', t:n+' está dormida', s:'Tócala, aunque sea solo para saludar. Eso también cuenta.'};
  if(cuenta<=2) return {id:'bajito', t:n+' flota bajo', s:'Lo que sea que hagas ahora suma, sin apuro.'};
  if(cuenta<=4) return {id:'flote', t:n+' se mantiene a flote', s:'Vas bien, a tu ritmo — no al de nadie más.'};
  if(cuenta<=6) return {id:'tranquila', t:n+' nada tranquila', s:'Hoy te estás cuidando de verdad. Se nota.'};
  return {id:'brilla', t:n+' está que brilla', s:'Día completo. Orgullo, no perfección.'};
}

function calcularVinculo(){
  var c=S.contadores||{};
  var pts=(c.conchitasGanadasTotal||0) + (c.tocarBoyaTotal||0) + (c.comprasTotal||0)*4;
  var nivel=Math.min(NIVELES_VINCULO.length, Math.floor(Math.sqrt(pts/20))+1);
  var sigue=Math.pow(nivel,2)*20, previo=Math.pow(nivel-1,2)*20;
  var esMax=nivel>=NIVELES_VINCULO.length;
  return {
    pts:pts, nivel:nivel, nombre:NIVELES_VINCULO[nivel-1], esMax:esMax,
    prog: esMax?100:Math.max(0,Math.min(100,Math.round((pts-previo)/(sigue-previo)*100)))
  };
}

function ordenCuarto(){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var total=0, dias=0;
  for(var i=0;i<3;i++){
    var d=new Date(hoy); d.setDate(d.getDate()-i);
    var e=S.entradas[toISO(d)];
    if(e){ total+=contarCategorias(e); dias++; }
  }
  var prom = dias ? (total/dias)/CATS.length : 0;
  if(prom>=0.75) return 3;
  if(prom>=0.45) return 2;
  if(prom>=0.2) return 1;
  return 0;
}
function actividadBoya(){
  var hr=new Date().getHours();
  if(hr>=23 || hr<6) return 'durmiendo';
  var e=entradaHoy();
  if((hr>=7&&hr<10&&e.desayuno)||(hr>=12&&hr<15&&e.almuerzo)||(hr>=18&&hr<21&&e.cena)) return 'comiendo';
  return 'de_pie';
}

/* ===================== sonido, vibración, confeti, puntos flotantes ===================== */
var audioCtx=null;
function obtenerAudioCtx(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function tono(freq, inicio, dur){
  if(S.efectos===false) return;
  var ctx=obtenerAudioCtx(); if(!ctx) return;
  try{
    var t0=ctx.currentTime+inicio;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function sonidoPop(freq){ tono(freq||660, 0, 0.16); }
function sonidoArpegio(){ tono(523,0,0.14); tono(659,0.09,0.14); tono(784,0.18,0.22); }
function vibrar(patron){
  if(S.efectos===false) return;
  if(navigator.vibrate){ try{ navigator.vibrate(patron); }catch(e){} }
}
function flotarPuntos(origenEl, texto){
  if(!origenEl || !texto) return;
  var r=origenEl.getBoundingClientRect();
  var el=document.createElement('div');
  el.className='puntos-flot';
  el.textContent=texto;
  el.style.left=(r.left+r.width/2)+'px';
  el.style.top=(r.top)+'px';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 950);
}
function lanzarConfeti(n){
  var cont=document.createElement('div');
  cont.className='confeti-cont';
  var colores=['#0e7c86','#ff8a65','#ffd166','#06d6a0','#ef476f'];
  for(var i=0;i<n;i++){
    var s=document.createElement('span');
    s.className='confeti-pieza';
    s.style.left=(Math.random()*100)+'%';
    s.style.background=colores[i%colores.length];
    s.style.animationDelay=(Math.random()*0.25)+'s';
    s.style.animationDuration=(1.1+Math.random()*0.9)+'s';
    s.style.transform='rotate('+(Math.random()*360)+'deg)';
    cont.appendChild(s);
  }
  document.body.appendChild(cont);
  setTimeout(function(){ cont.remove(); }, 2300);
}

/* ===================== foto de perfil ===================== */
function comprimirImagen(file, tam, calidad, cb){
  if(!file || file.type.indexOf('image/')!==0){ cb(null); return; }
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      canvas.width=tam; canvas.height=tam;
      var ctx=canvas.getContext('2d');
      var lado=Math.min(img.width, img.height);
      var sx=(img.width-lado)/2, sy=(img.height-lado)/2;
      ctx.drawImage(img, sx, sy, lado, lado, 0, 0, tam, tam);
      var dataURL=null;
      try{ dataURL=canvas.toDataURL('image/jpeg', calidad); }catch(e){}
      cb(dataURL);
    };
    img.onerror=function(){ cb(null); };
    img.src=reader.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}
function manejarFoto(file){
  comprimirImagen(file, 160, 0.82, function(dataURL){
    if(!dataURL) return;
    S.usuario.foto=dataURL;
    guardar(); render();
  });
}

  });
}

  });
  var mitad=Math.max(1, Math.ceil(candidatos.length/2));

      h+='<div class="paso-editable"><span class="t">'+esc(t)+'</span><button data-action="quitar-paso-nueva-rutina" data-value="'+i+'">✕</button></div>';

  h+='<button class="btn btn-principal" style="margin-top:14px" data-action="crear-rutina">Crear rutina</button>';

/* ===================== interacción ===================== */
function toggleCategoria(id){
  var e=entradaHoy();
  e[id]=!e[id];
  guardar();
}
function cambiarAgua(delta){
  var e=entradaHoy();
  e.agua=Math.max(0, (e.agua||0)+delta);
  guardar();
}

var ACCIONES_JUEGO=['toggle-cat','agua-mas','agua-menos','toggle-mini','elegir-ropa','dividir-tarea','tarea-rapida','toggle-paso-rutina'];

app.addEventListener('click', function(ev){
  var b=ev.target.closest('[data-action]');
  if(!b) return;
  var act=b.dataset.action, val=b.dataset.value;

  var esJuego = ACCIONES_JUEGO.indexOf(act)>=0;
  var prevCuenta = esJuego ? contarCategorias(entradaHoy()) : 0;
  var prevJg = esJuego ? calcularProgreso() : null;
  var rutinaIdActual=null, prevRutinaCompleta=false, nombreRutinaActual='';
  if(act==='toggle-paso-rutina'){
    rutinaIdActual=val.split('|')[0];
    var rutPrev=S.rutinas.filter(function(r){ return r.id===rutinaIdActual; })[0];
    if(rutPrev){ prevRutinaCompleta=rutinaCompletaHoy(rutPrev); nombreRutinaActual=rutPrev.emo+' '+rutPrev.nombre; }
  }

  if(act==='nav'){ V.tab=val; V.mostrarMedallas=false; }
  else if(act==='toggle-cat'){
    toggleCategoria(val);
    if(entradaHoy()[val]){ flotarPuntos(b, S.modoSuave?'✨':'+3'); sonidoPop(660); vibrar(12); ganarConchitas(1); }
  }
  else if(act==='agua-mas'){
    cambiarAgua(1);
    flotarPuntos(b, S.modoSuave?'✨':'+1'); sonidoPop(720); vibrar(10); ganarConchitas(1);
  }
  else if(act==='agua-menos'){ cambiarAgua(-1); }
  else if(act==='tocar-boya'){
    S.contadores.tocarBoyaTotal=(S.contadores.tocarBoyaTotal||0)+1;
    sonidoPop(540); vibrar(8);
    V.dialogoBoya=mensajeAlTocar();
    V.boyaTocada=true;
    guardar();
    render();
    clearTimeout(dialogoTimer);
    dialogoTimer=setTimeout(function(){ V.dialogoBoya=null; V.boyaTocada=false; render(); }, 4200);
    return;
  }
  else if(act==='ver-medallas'){ V.mostrarMedallas=!V.mostrarMedallas; }
  else if(act==='activar-suave'){ S.modoSuave=true; S.nudgeVisto=hoyISO(); guardar(); }
  else if(act==='descartar-nudge'){ S.nudgeVisto=hoyISO(); guardar(); }
  else if(act==='toggle-modo-suave'){ S.modoSuave=!S.modoSuave; guardar(); }
  else if(act==='toggle-efectos'){ S.efectos=(S.efectos===false); guardar(); }
  else if(act==='romper-huevo'){
    if(V.huevoTambaleando) return;
    sonidoArpegio(); vibrar([15,30,15,30,60]);
    V.huevoTambaleando=true;
    render();
    setTimeout(function(){
      V.onboardingPaso='nace';
      V.huevoTambaleando=false;
      lanzarConfeti(40);
      render();
    }, 650);
    return;
  }
  else if(act==='terminar-onboarding'){
    var inpN=document.getElementById('inp-nombre-onboarding');
    var inpB=document.getElementById('inp-nombre-boya-onboarding');
    S.usuario.nombre=(inpN?inpN.value:'').trim();
    var nombreBoya=(inpB?inpB.value:'').trim();
    if(nombreBoya) S.boya.nombre=nombreBoya;
    S.onboardingVisto=true; guardar();
    celebrar('bienvenida', {titulo:'Listo'+(S.usuario.nombre?', '+S.usuario.nombre:'')+' 🎉', sub:'Cuando quieras, tocá lo que ya hiciste hoy.'});
  }
  else if(act==='saltar-onboarding'){
    S.onboardingVisto=true; guardar();
    celebrar('bienvenida', {titulo:'Listo 🎉', sub:'Cuando quieras, tocá lo que ya hiciste hoy.'});
  }
  else if(act==='quitar-foto'){ S.usuario.foto=null; guardar(); }
  else if(act==='agregar-ropa'){
    var inp=document.getElementById('inp-ropa');
    var texto=(inp?inp.value:'').trim();
    if(texto){ S.ropa.push({id:'r'+Date.now(), texto:texto, ultimoUso:null}); V.ropaNueva=''; guardar(); }
  }
  else if(act==='quitar-ropa'){
    S.ropa=S.ropa.filter(function(r){ return r.id!==val; });
    if(S.ropaHoy && S.ropaHoy.id===val) S.ropaHoy=null;
    guardar();
  }
  else if(act==='elegir-ropa'){
    var elegido=elegirRopa();
    if(elegido){
      elegido.ultimoUso=hoyISO();
      S.contadores.ropaUsos=(S.contadores.ropaUsos||0)+1;
      S.ropaHoy={id:elegido.id, fecha:hoyISO()};
      sonidoPop(600); vibrar(10); ganarConchitas(1);
      guardar();
    }
  }
  else if(act==='elegir-mini-emo'){ V.miniEmo=val; }
  else if(act==='agregar-mini'){
    var inpM=document.getElementById('inp-mini-texto');
    var texto=(inpM?inpM.value:'').trim();
    if(texto){
      S.miniRecordatorios.push({id:'m'+Date.now(), emo:V.miniEmo||'📌', texto:texto});
      V.miniTexto=''; V.miniEmo='📌'; guardar();
    }
  }
  else if(act==='quitar-mini'){
    S.miniRecordatorios=S.miniRecordatorios.filter(function(m){ return m.id!==val; });
    guardar();
  }
  else if(act==='toggle-mini'){
    var extra=extraDeHoy();
    extra[val]=!extra[val];
    if(extra[val]){
      S.contadores.miniToques=(S.contadores.miniToques||0)+1;
      flotarPuntos(b, S.modoSuave?'✨':'+2'); sonidoPop(760); vibrar(12); ganarConchitas(1);
    }
    guardar();
  }
  else if(act==='dividir-tarea' || act==='tarea-rapida'){
    var texto = act==='tarea-rapida' ? val : (function(){ var inpT=document.getElementById('inp-tarea'); return (inpT?inpT.value:'').trim(); })();
    if(texto){
      S.tareaActual=dividirTarea(texto);
      S.contadores.tareasUsos=(S.contadores.tareasUsos||0)+1;
      V.tareaTexto=''; sonidoPop(600); vibrar(10); ganarConchitas(1); guardar();
    }
  }
  else if(act==='subtab-boya'){ V.subtabBoya=val; }
  else if(act==='comprar-item'){
    var art=ITEMS_BOYA.filter(function(x){return x.id===val;})[0];
    var vinc=calcularVinculo();
    if(art && S.comprados.indexOf(art.id)===-1 && (S.conchitas||0)>=art.precio && vinc.nivel>=art.vinculoMin){
      S.conchitas-=art.precio;
      S.comprados.push(art.id);
      if(art.tipo!=='decor') S.equipado[art.tipo]=art.id;
      S.contadores.comprasTotal=(S.contadores.comprasTotal||0)+1;
      sonidoArpegio(); vibrar([20,30,20]);
      mostrarToast(art.tipo==='decor' ? 'Ya está en el cuarto de '+(S.boya.nombre||'Boya')+' 🎉' : (S.boya.nombre||'Boya')+' ya tiene '+art.nombre.toLowerCase()+' 🎉');
    }
  }
  else if(act==='equipar-item'){
    var art2=ITEMS_BOYA.filter(function(x){return x.id===val;})[0];
    if(art2){
      S.equipado[art2.tipo] = (S.equipado[art2.tipo]===art2.id) ? null : art2.id;
      sonidoPop(600); vibrar(10);
    }
  }
  else if(act==='iniciar-respiracion'){ iniciarRespiracion(); return; }
  else if(act==='detener-respiracion'){ detenerRespiracion(); }
  else if(act==='siguiente-aterrizaje'){ V.aterrizajePaso=(V.aterrizajePaso||0)+1; vibrar(8); }
  else if(act==='reiniciar-aterrizaje'){ V.aterrizajePaso=0; }
  else if(act==='elegir-calma'){ V.calmaVista=val; V.aterrizajePaso=0; V.relajacionPaso=0; detenerRespiracion(); }
  else if(act==='siguiente-relajacion'){ V.relajacionPaso=(V.relajacionPaso||0)+1; vibrar(8); }
  else if(act==='reiniciar-relajacion'){ V.relajacionPaso=0; }
  else if(act==='toggle-paso'){
    if(S.tareaActual){
      var p=S.tareaActual.pasos[Number(val)];
      if(p){ p.hecho=!p.hecho; guardar(); }
    }
  }
  else if(act==='cerrar-tarea'){ S.tareaActual=null; guardar(); }
  else if(act==='toggle-activos'){
    if(!S.recordatorios.activos){
      pedirPermiso().then(function(){ S.recordatorios.activos=true; guardar(); render(); });
      return;
    }
    S.recordatorios.activos=false; guardar();
  }
  else if(act==='toggle-rec'){
    if(val==='agua'){ S.recordatorios.agua.on=!S.recordatorios.agua.on; }
    else { S.recordatorios[val].on=!S.recordatorios[val].on; }
    guardar();
  }
  else if(act==='snooze'){ recordar30(val); return; }
  else if(act==='exportar'){ exportarDatos(); return; }
  else if(act==='agregar-pendiente'){
    var inpP=document.getElementById('inp-pendiente');
    var textoP=(inpP?inpP.value:'').trim();
    if(textoP){ S.pendientes.push({id:'pd'+Date.now(), texto:textoP}); V.pendienteTexto=''; guardar(); }
  }
  else if(act==='quitar-pendiente'){ S.pendientes=S.pendientes.filter(function(p){ return p.id!==val; }); guardar(); }
  else if(act==='completar-pendiente'){
    S.pendientes=S.pendientes.filter(function(p){ return p.id!==val; });
    S.contadores.pendientesResueltos=(S.contadores.pendientesResueltos||0)+1;
    ganarConchitas(1); sonidoPop(680); vibrar(10);
    guardar();
  }
  else if(act==='toggle-paso-rutina'){
    var partesR=val.split('|'), rid=partesR[0], pid=partesR[1];
    var hechosR=pasosHechosHoy(rid);
    var iR=hechosR.indexOf(pid);
    if(iR>=0){ hechosR.splice(iR,1); }
    else{ hechosR.push(pid); flotarPuntos(b, S.modoSuave?'✨':'+1'); sonidoPop(660); vibrar(12); ganarConchitas(1); }
  }
  else if(act==='adoptar-rutina'){
    var rs=RUTINAS_SUGERIDAS[Number(val)];
    if(rs){
      S.rutinas.push({id:'rt'+Date.now(), nombre:rs.nombre, emo:rs.emo, pasos:rs.pasos.map(function(t,i){ return {id:'p'+i, t:t}; })});
      sonidoPop(600); vibrar(10);
      mostrarToast('Rutina agregada.');
      guardar();
    }
  }
  else if(act==='quitar-rutina'){
    if(confirm('¿Quitar esta rutina? Se borra su racha de días seguidos.')){
      S.rutinas=S.rutinas.filter(function(r){ return r.id!==val; });
      guardar();
    } else { return; }
  }
  else if(act==='agregar-paso-nueva-rutina'){
    var inpRP=document.getElementById('inp-rutina-paso');
    var textoRP=(inpRP?inpRP.value:'').trim();
    if(textoRP){ V.rutinaPasos.push(textoRP); V.rutinaPasoTexto=''; }
  }
  else if(act==='quitar-paso-nueva-rutina'){ V.rutinaPasos.splice(Number(val), 1); }
  else if(act==='crear-rutina'){
    var inpRN=document.getElementById('inp-rutina-nombre');
    var nombreR=(inpRN?inpRN.value:'').trim();
    if(nombreR && V.rutinaPasos.length){
      S.rutinas.push({id:'rt'+Date.now(), nombre:nombreR, emo:'🗺️', pasos:V.rutinaPasos.map(function(t,i){ return {id:'p'+i, t:t}; })});
      V.rutinaNombre=''; V.rutinaPasoTexto=''; V.rutinaPasos=[];
      sonidoArpegio(); vibrar([15,30,15]);
      mostrarToast('Rutina creada.');
      guardar();
    } else {
      mostrarToast(nombreR ? 'Agrega al menos un paso.' : 'Ponle un nombre primero.');
      return;
    }
  }
  else if(act==='ver-foto'){ V.verFoto=val; }
  else if(act==='cerrar-foto'){ V.verFoto=null; }
  else if(act==='quitar-foto-cat'){
    var fotosQ=fotosDeHoy();
    delete fotosQ[val];
    V.verFoto=null;
    guardar();
  }
  else if(act==='cerrar-celebracion'){ clearTimeout(celebracionTimer); V.celebracion=null; }
  else if(act==='borrar-todo'){
    if(confirm('¿Borrar todos tus datos de Ancla? No se puede deshacer.')){
      S=estadoInicial(); guardar();
    } else { return; }
  }

  if(esJuego){
    var stats=calcularEstadisticas();
    sincronizarMedallasGanadas(stats);
    var nuevoJg=calcularProgreso();
    var subioNivel = nuevoJg.nivel>prevJg.nivel;
    var medallaNueva=null;
    nuevoJg.medallas.forEach(function(m){
      var antes=prevJg.medallas.filter(function(x){ return x.id===m.id; })[0];
      if(!medallaNueva && m.on && antes && !antes.on) medallaNueva=m;
    });
    var nuevoCuenta=contarCategorias(entradaHoy());
    var completoAhora = nuevoCuenta>=CATS.length && prevCuenta<CATS.length;
    var rutinaCompletadaAhora=false;
    if(act==='toggle-paso-rutina' && rutinaIdActual){
      var rutAhora=S.rutinas.filter(function(r){ return r.id===rutinaIdActual; })[0];
      if(rutAhora){ rutinaCompletadaAhora = !prevRutinaCompleta && rutinaCompletaHoy(rutAhora); }
    }

    if(subioNivel){ celebrar('nivel', {titulo:S.modoSuave?'Subiste de nivel':'Nivel '+nuevoJg.nivel, sub:nuevoJg.nombre}); }
    else if(medallaNueva){ celebrar('medalla', {emo:medallaNueva.emo, titulo:'Nueva medalla', sub:medallaNueva.titulo}); }
    else if(rutinaCompletadaAhora){ celebrar('rutina', {titulo:'Rutina completa', sub:nombreRutinaActual}); }
    else if(completoAhora){ celebrar('dia', {titulo:'Día completo', sub:'Orgullo, no perfección.'}); }
  }

  guardar();
  render();
});

app.addEventListener('change', function(ev){
  var el=ev.target.closest('[data-bind]');
  if(el){
    var val = el.type==='checkbox' ? el.checked : el.value;
    if(el.dataset.num) val=Number(val);
    setPath(S, el.dataset.bind, val);
    guardar();
    render();
    return;
  }
  if((ev.target.id==='inp-foto-onboarding' || ev.target.id==='inp-foto-perfil') && ev.target.files && ev.target.files[0]){
    manejarFoto(ev.target.files[0]);
    return;
  }
  if(ev.target.id && ev.target.id.indexOf('inp-foto-cat-')===0 && ev.target.files && ev.target.files[0]){
    manejarFotoCategoria(ev.target.id.slice('inp-foto-cat-'.length), ev.target.files[0]);
    return;
  }
  if(ev.target.id==='inp-importar' && ev.target.files && ev.target.files[0]){
    importarDatos(ev.target.files[0]);
  }
});
app.addEventListener('input', function(ev){
  if(ev.target.id==='inp-ropa') V.ropaNueva=ev.target.value;
  if(ev.target.id==='inp-tarea') V.tareaTexto=ev.target.value;
  if(ev.target.id==='inp-nombre-onboarding') V.onboardingNombre=ev.target.value;
  if(ev.target.id==='inp-mini-texto') V.miniTexto=ev.target.value;
  if(ev.target.id==='inp-pendiente') V.pendienteTexto=ev.target.value;
  if(ev.target.id==='inp-rutina-nombre') V.rutinaNombre=ev.target.value;
  if(ev.target.id==='inp-rutina-paso') V.rutinaPasoTexto=ev.target.value;
});
app.addEventListener('keydown', function(ev){
  if(ev.key==='Enter'){
    if(ev.target.id==='inp-ropa'){ ev.preventDefault(); document.querySelector('[data-action="agregar-ropa"]').click(); }
    if(ev.target.id==='inp-tarea'){ ev.preventDefault(); document.querySelector('[data-action="dividir-tarea"]').click(); }
    if(ev.target.id==='inp-nombre-onboarding'){ ev.preventDefault(); document.querySelector('[data-action="terminar-onboarding"]').click(); }
    if(ev.target.id==='inp-mini-texto'){ ev.preventDefault(); document.querySelector('[data-action="agregar-mini"]').click(); }
    if(ev.target.id==='inp-pendiente'){ ev.preventDefault(); document.querySelector('[data-action="agregar-pendiente"]').click(); }
    if(ev.target.id==='inp-rutina-paso'){ ev.preventDefault(); document.querySelector('[data-action="agregar-paso-nueva-rutina"]').click(); }
  }
});

function exportarDatos(){
  var blob=new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='ancla-datos-'+hoyISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  mostrarToast('Descargando tu copia…');
}
function importarDatos(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var nuevo=JSON.parse(reader.result);
      if(nuevo && nuevo.entradas){
        if(confirm('Esto va a reemplazar los datos actuales de este dispositivo con los del archivo. ¿Seguir?')){
          S=nuevo; guardar(); render(); mostrarToast('Datos importados.');
        }
      } else { mostrarToast('Ese archivo no parece ser de Ancla.'); }
    }catch(e){ mostrarToast('No se pudo leer el archivo.'); }
  };
  reader.readAsText(file);
}

podarFotosViejas();
revisarRecordatorios();
setInterval(revisarRecordatorios, 30000);
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

})();
