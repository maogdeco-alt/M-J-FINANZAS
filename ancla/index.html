<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ancla</title>
<meta name="description" content="Un ancla para los días donde todo cuesta.">
<meta name="theme-color" content="#0e7c86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ancla">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece3d1; --card:#faf7f0; --ink:#161f22; --sub:#5c6a68; --teal:#0b4247; --teal-d:#082e32;
  --coral:#b25e39; --mint:#dbe1cd; --mint-ink:#37402c; --line:#dccfb3; --warn:#9c3a1e;
  /* Un color por dominio, siempre el mismo. El color aquí no decora:
     identifica. Por eso son tonos profundos y de saturación pareja —
     conviven sin pelearse, que es lo que un montón de emoji nunca hace. */
  --h-ambar:#b8801f; --h-terra:#b0573a; --h-oliva:#5c7a41; --h-azul:#3a6c91;
  --h-ciruela:#7c4763; --h-indigo:#4a5093; --h-agua:#1c7f86; --h-humo:#6b7a72;
  --radius:14px; --radius-s:9px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a1213; --card:#131e20; --ink:#edf1ea; --sub:#8fa09c; --teal:#2f99a1; --teal-d:#1c6a70;
    --coral:#d9895c; --mint:#232c1d; --mint-ink:#c2d3a9; --line:#263335; --warn:#ff9a6b;
    --h-ambar:#e0aa4e; --h-terra:#e0866a; --h-oliva:#94b56f; --h-azul:#74a6c9;
    --h-ciruela:#c084a1; --h-indigo:#8f95d6; --h-agua:#4fc0c6; --h-humo:#9fb0a6;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  min-height:100vh;
}
button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer}
button:active{transform:scale(.97)}
input, select, textarea{font-family:inherit; color:inherit}
h1,h2,h3,p{margin:0}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.envolt{max-width:540px; margin:0 auto; padding:18px 16px 6px}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 4px}
.marca-row{display:flex; align-items:center; gap:8px}
.marca{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:23px; letter-spacing:.1px; color:var(--ink)}
.beta-tag{font-family:var(--font-mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; background:none; color:var(--coral); padding:2px 0 2px 8px; border-left:1.5px solid var(--line)}
.topbar-der{display:flex; align-items:center; gap:10px}
.fecha{font-size:12px; color:var(--sub); text-transform:capitalize; letter-spacing:.1px}
.saludo-nombre{font-family:var(--font-display); font-style:italic; font-size:16px; color:var(--ink); font-weight:500; margin:2px 2px 12px}

.card{background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); border:1px solid var(--line)}
.card h3{font-family:var(--font-display); font-weight:600; font-size:17px; margin-bottom:4px; letter-spacing:.1px}
.sub{color:var(--sub); font-size:13px; line-height:1.55}

.banner{background:var(--mint); color:var(--mint-ink); border-radius:var(--radius-s); padding:13px 14px; margin-bottom:14px; font-size:13.5px; line-height:1.5; display:flex; gap:10px; align-items:flex-start}
.banner .acciones{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.banner .acciones button{background:var(--mint-ink); color:var(--mint); padding:7px 12px; border-radius:20px; font-size:12.5px; font-weight:600}

.boya-wrap{display:flex; flex-direction:column; gap:12px}
.boya-escenario{position:relative; width:100%; height:230px}
.boya-escenario-fondo{position:absolute; inset:0; border-radius:var(--radius); overflow:hidden; background:linear-gradient(160deg, var(--teal), var(--teal-d)); box-shadow:0 4px 14px rgba(14,124,134,.3)}
.boya{position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; border:none; background:none; padding:0 0 6px; cursor:pointer}
.boya svg{height:97%; width:auto; animation:respirar 4.6s ease-in-out infinite; transform-origin:50% 100%}
.boya.tocada svg{animation:saludo .66s cubic-bezier(.34,1.4,.64,1)}
@keyframes respirar{ 0%,100%{transform:translateY(0) scale(1,1)} 50%{transform:translateY(-1.6px) scale(.995,1.014)} }
@keyframes saludo{ 0%,100%{transform:translateY(0) scale(1,1)} 26%{transform:translateY(-5px) scale(.96,1.055)} 56%{transform:translateY(0) scale(1.05,.95)} 80%{transform:translateY(-1px) scale(.99,1.014)} }
.boya-info-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
/* transform-box:view-box = el transform-origin se mide en coordenadas del
   viewBox del dibujo. Sin esto se mide desde la caja de cada pieza y el
   pivote cae fuera del personaje: la parte sale volando. */
.ojo-parpadeo{transform-box:view-box; animation:parpadeo 6.4s ease-in-out infinite}
@keyframes parpadeo{ 0%,93%,100%{transform:scaleY(1)} 95.6%{transform:scaleY(.08)} }
.cola-nutria{transform-box:view-box; transform-origin:70px 112px; animation:colazo 4.6s ease-in-out infinite}
@keyframes colazo{ 0%,100%{transform:rotate(2.2deg)} 50%{transform:rotate(-3deg)} }
.globo-dialogo{position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); background:var(--card); color:var(--ink); padding:10px 14px; border-radius:14px; font-size:13px; font-weight:600; max-width:240px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.18); animation:globoPop .25s ease; z-index:5}
.globo-dialogo:after{content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color:var(--card)}
@keyframes globoPop{ 0%{opacity:0; transform:translateX(-50%) translateY(6px) scale(.9)} 100%{opacity:1; transform:translateX(-50%) translateY(0) scale(1)} }


/* ---- qué toca ahora ---- */
.ahora{background:var(--card); border:1.5px solid var(--line); border-left:4px solid var(--sub); border-radius:var(--radius); padding:15px 16px; margin-bottom:14px}
.ahora.n1{border-left-color:var(--coral)}
.ahora.n2{border-left-color:var(--warn); background:linear-gradient(180deg, rgba(156,58,30,.07), transparent)}
.ahora.n-1{border-left-color:var(--mint-ink)}
.ahora-et{font-family:var(--font-mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--sub); margin-bottom:8px}
.ahora-fila{display:flex; gap:12px; align-items:flex-start}
.ahora-emo{font-size:30px; line-height:1; flex:none}
.ahora-txt{min-width:0}
.ahora-txt b{display:block; font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.25; color:var(--ink)}
.ahora-txt i{display:block; font-style:normal; font-size:13px; color:var(--sub); line-height:1.5; margin-top:3px}
.ahora-btns{display:flex; gap:8px; margin-top:13px; flex-wrap:wrap}
.ahora-btns .btn{flex:1; min-width:118px}

/* ---- tiras compactas en Hoy ---- */
.tira-cab{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.tira-cab h3{margin:0}
.tira-link{font-size:12.5px; font-weight:700; color:var(--coral); background:none; padding:0}
/* ---- perras ---- */
.perras-cabecera{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
.perra-titulo{display:flex; align-items:center; gap:9px; margin-bottom:6px}
.perra-titulo .emo{font-size:23px}
.perra-titulo .nom{font-family:var(--font-display); font-size:19px; font-weight:600; flex:1}
.quitar-perra{background:none; color:var(--sub); font-size:15px; padding:4px 8px}
.cuidado{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--bg); margin-top:9px}
.cuidado.urg1{border-color:var(--coral)}
.cuidado.urg2{border-color:var(--warn); background:rgba(156,58,30,.08)}
.cui-emo{font-size:21px; flex:none}
.cui-txt{flex:1; min-width:0}
.cui-et{font-size:14px; font-weight:700; color:var(--ink)}
.cui-cont{font-family:var(--font-mono); font-size:11px; font-weight:500; color:var(--sub); margin-left:5px}
.cui-ult{font-size:11.5px; color:var(--sub); margin-top:2px}
.cuidado.urg2 .cui-ult{color:var(--warn); font-weight:600}
.cui-btn{flex:none; background:var(--coral); color:#fff; font-size:12.5px; font-weight:700; padding:9px 13px; border-radius:16px}
.cuidado.ok .cui-btn{background:var(--mint); color:var(--mint-ink); padding:9px 15px}
.cui-ajuste{display:flex; align-items:center; gap:7px}
.cui-ajuste button{background:var(--bg); border:1.5px solid var(--line); color:var(--ink); width:28px; height:28px; border-radius:50%; font-size:15px; font-weight:700; line-height:1}
.cui-ajuste button:disabled{opacity:.35}
.cui-ajuste b{font-family:var(--font-mono); font-size:13px; min-width:32px; text-align:center}
.cui-onoff{background:none; color:var(--sub); font-size:11px; text-decoration:underline; padding:4px 2px; width:auto; height:auto; border:none}

/* ---- enfoque ---- */
.enfoque-cifra{display:flex; align-items:baseline; gap:7px; margin:10px 0 10px}
.enfoque-cifra b{font-family:var(--font-mono); font-size:34px; color:var(--ink); line-height:1}
.enfoque-cifra span{font-size:13px; color:var(--sub)}
.tramos{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:13px}
.tramo{background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:14px 10px; display:flex; flex-direction:column; gap:3px}
.tramo.destacado{border-color:var(--coral); background:rgba(178,94,57,.09)}
.tramo b{font-family:var(--font-mono); font-size:17px; color:var(--ink)}
.tramo span{font-size:11.5px; color:var(--sub)}
.sesion-card{text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px}
.sesion-boya{width:120px; height:150px}
.sesion-boya svg{height:100%; width:auto; animation:respirar 4.6s ease-in-out infinite; transform-origin:50% 100%}
.sesion-et{font-size:13px; color:var(--sub); font-weight:600}
.reloj{font-family:var(--font-mono); font-size:52px; font-weight:600; color:var(--ink); letter-spacing:1px; line-height:1.1}
.sesion-btns{display:flex; gap:9px; margin-top:14px; width:100%}
.sesion-btns .btn{flex:1}
.semana{display:flex; align-items:flex-end; gap:7px; margin-top:14px; height:78px}
.dia-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%}
.dia-barra{flex:1; width:100%; background:var(--line); border-radius:5px; display:flex; align-items:flex-end; overflow:hidden}
.dia-barra i{display:block; width:100%; background:var(--teal); border-radius:5px}
.dia-col.hoy .dia-barra i{background:var(--coral)}
.dia-col span{font-family:var(--font-mono); font-size:9.5px; color:var(--sub)}

/* ---- vestirme ---- */
.clima-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.clima-op{flex:1; min-width:82px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:11px 6px; font-size:12.5px; font-weight:700; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:3px}
.clima-op span{font-size:17px}
.clima-op.sel{border-color:var(--coral); background:rgba(178,94,57,.1)}
.clima-op.chico{padding:8px 6px; font-size:11.5px; min-width:66px}
.clima-op.chico span{font-size:14px}
.ropa-resultado{margin-top:16px; padding:20px 16px; border-radius:var(--radius); background:linear-gradient(160deg, var(--teal), var(--teal-d)); color:#fff; text-align:center}
.rr-et{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:1.2px; opacity:.75}
.rr-txt{font-family:var(--font-display); font-size:24px; font-weight:600; line-height:1.3; margin-top:8px}
.rr-btns{margin-top:16px; display:flex; justify-content:center}
.rr-btns .btn{background:rgba(255,255,255,.16); color:#fff}
.ropa-ult{display:block; font-style:normal; font-family:var(--font-mono); font-size:10px; color:var(--sub); margin-top:2px}

/* ---- más ---- */
.mas-lista{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.mas-item{display:flex; align-items:center; gap:12px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:13px 14px; text-align:left; width:100%}
.mi-emo{font-size:21px; flex:none}
.mi-txt{flex:1; min-width:0}
.mi-txt b{display:block; font-size:14px; font-weight:700; color:var(--ink)}
.mi-txt i{display:block; font-style:normal; font-size:11.5px; color:var(--sub); margin-top:2px}
.mi-fl{color:var(--sub); font-size:18px; flex:none}

/* ================= sistema visual =================
   El problema no era el contenido, era que TODO pesaba igual: diez
   tarjetas idénticas compitiendo. Reglas de acá en adelante:
   1. Una sola cosa fuerte por pantalla (.ahora). El resto se calla.
   2. Lo secundario va en renglones sobre el fondo, sin caja.
   3. El coral se reserva para LA acción; el resto es tinta y gris.
   4. Nada que ya esté hecho ocupa espacio: se pliega a un contador. */

.seccion{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:22px 2px 10px}
.seccion span{font-family:var(--font-mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1.3px; color:var(--sub)}
.seccion em{font-family:var(--font-mono); font-style:normal; font-size:10.5px; color:var(--sub); opacity:.8}

/* renglones: lo pendiente, sin caja propia */
.filas{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-s); overflow:hidden}
.fila{display:flex; align-items:center; gap:11px; padding:13px 14px; background:var(--card)}
.fila.u1{background:linear-gradient(90deg, rgba(178,94,57,.09), var(--card) 55%)}
.fila.u2{background:linear-gradient(90deg, rgba(156,58,30,.16), var(--card) 65%)}
.f-emo{font-size:17px; flex:none; opacity:.9}
.f-txt{flex:1; min-width:0}
.f-txt b{display:block; font-size:14px; font-weight:600; color:var(--ink); line-height:1.3}
.f-txt i{display:block; font-style:normal; font-family:var(--font-mono); font-size:10.5px; color:var(--sub); margin-top:2px}
.fila.u2 .f-txt i{color:var(--warn); font-weight:600}
.f-btn{flex:none; background:var(--bg); border:1.5px solid var(--line); color:var(--ink); font-size:12px; font-weight:700; padding:8px 13px; border-radius:14px}
.fila.u1 .f-btn, .fila.u2 .f-btn{background:var(--coral); border-color:var(--coral); color:#fff}

/* franjas del día: solo la de ahora abierta */
.franjas{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-s); overflow:hidden}
.franja{background:var(--card)}
.fr-cab{display:flex; align-items:center; gap:9px; width:100%; padding:13px 14px; background:none; text-align:left}
.fr-et{flex:1; font-size:14px; font-weight:600; color:var(--ink)}
.franja.esahora .fr-et{color:var(--ink)}
.franja.abierta .fr-et{font-family:var(--font-display); font-size:16px}
.fr-chip{font-family:var(--font-mono); font-size:8.5px; font-weight:600; text-transform:uppercase; letter-spacing:.7px; color:var(--coral); border:1px solid var(--coral); border-radius:10px; padding:2px 6px}
.fr-cont{font-family:var(--font-mono); font-size:11px; color:var(--sub)}
.fr-fl{font-size:11px; color:var(--sub); width:12px; text-align:right}
.franja .grid-cats{padding:2px 14px 15px}

/* Boya en Hoy: acompaña, no ocupa media pantalla */
.boya-tira{position:relative; display:flex; align-items:center; gap:13px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:11px 13px 11px 11px; margin-top:14px}
.bt-retrato{flex:none; width:74px; height:74px; border-radius:18px; overflow:hidden; background:linear-gradient(160deg, var(--teal), var(--teal-d)); display:flex; align-items:flex-end; justify-content:center; padding:0; border:none; cursor:pointer}
.bt-retrato svg{height:104%; width:auto; animation:respirar 4.6s ease-in-out infinite; transform-origin:50% 100%}
.bt-retrato.tocada svg{animation:saludo .66s cubic-bezier(.34,1.4,.64,1)}
.bt-txt{flex:1; min-width:0; cursor:pointer}
.bt-txt b{display:block; font-family:var(--font-display); font-size:15.5px; font-weight:600; color:var(--ink); line-height:1.25}
.bt-txt i{display:block; font-style:normal; font-size:11.5px; color:var(--sub); line-height:1.45; margin-top:2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.bt-bar{height:5px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:8px}
.bt-bar i{display:block; height:100%; background:var(--coral); border-radius:4px; transition:width .35s}
.bt-ir{flex:none; background:none; color:var(--sub); font-size:20px; padding:6px 2px}
.boya-tira .globo-dialogo{bottom:calc(100% + 6px); left:46px}

/* medicamentos */
.med-card{padding:15px 16px}
.med-cab{display:flex; align-items:flex-start; gap:10px}
.med-nom{flex:1; font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--ink); line-height:1.25}
.med-nom i{display:block; font-style:normal; font-family:var(--font-body); font-size:12px; font-weight:400; color:var(--sub); margin-top:2px}
.tomas{display:flex; flex-direction:column; gap:7px; margin-top:12px}
.toma{display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--bg); text-align:left}
.toma.urg1{border-color:var(--coral); background:rgba(178,94,57,.08)}
.toma.urg2{border-color:var(--warn); background:rgba(156,58,30,.11)}
.toma.tomada{border-color:var(--mint); background:var(--mint)}
.tm-hora{font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--ink); flex:none; min-width:46px}
.toma.tomada .tm-hora{color:var(--mint-ink)}
.tm-est{flex:1; font-size:11.5px; color:var(--sub)}
.toma.tomada .tm-est{color:var(--mint-ink)}
.toma.urg2 .tm-est{color:var(--warn); font-weight:600}
.tm-check{flex:none; font-size:14px; color:var(--mint-ink); font-weight:700}
.med-pie{font-family:var(--font-mono); font-size:10px; color:var(--sub); margin-top:11px; padding-top:10px; border-top:1px solid var(--line)}
.horas-med{display:flex; align-items:center; gap:10px; margin-top:11px; flex-wrap:wrap}
.hm-nom{flex:1; min-width:110px; font-size:13px; font-weight:600; color:var(--ink)}
.hm-inputs{display:flex; gap:6px; flex-wrap:wrap}
.inp-hora{font-family:var(--font-mono); font-size:13px; background:var(--bg); border:1.5px solid var(--line); border-radius:11px; padding:7px 9px; color:var(--ink); width:auto}

/* los iconos heredan el color del texto y se alinean con él */
.ico{display:block; flex:none}
.cat .emo .ico, .cui-emo .ico, .f-emo .ico, .ahora-emo .ico{margin:0 auto}
.cat .emo{display:flex; align-items:center; justify-content:center; height:26px}
.nav button .ic{display:flex; align-items:center; justify-content:center; height:23px}
.cui-emo{display:flex; align-items:center}
.f-emo{display:flex; align-items:center}
.ahora-emo{display:flex; align-items:center; padding-top:2px}
.calma-picker button{display:inline-flex; align-items:center; gap:7px}
.fila-mas{width:100%; padding:11px 14px; background:var(--card); font-size:12px; font-weight:700; color:var(--coral); text-align:center}
.foto-agregar{color:var(--sub); display:flex; align-items:center; justify-content:center}

/* ================= color con oficio =================
   Cada dominio tiene SU color y no lo cambia nunca: el desayuno siempre
   ámbar, el sueño siempre índigo, las perras su verde. Así el color dice
   algo — se reconoce la cosa antes de leer la palabra — en vez de ser
   adorno. Todos los tonos comparten saturación, por eso conviven sin
   pelearse, que es justo lo que veinte emoji distintos nunca logran. */
.cat{position:relative; overflow:hidden}
.cat .emo{color:var(--t, var(--sub))}
.cat .et{color:var(--sub)}
.cat:before{content:''; position:absolute; inset:0; background:var(--t); opacity:.06; pointer-events:none}
.cat.on{border-color:var(--t)}
.cat.on:before{opacity:.17}
.cat.on .et{color:var(--t); font-weight:700}
.cat.on .badge-n{background:var(--t)}
.cat .badge-n{background:var(--t)}

.cui-emo{color:var(--t, var(--sub))}
.cuidado{border-left:3.5px solid var(--t)}
.cuidado.ok{background:var(--card)}

.f-emo{color:var(--t, var(--sub))}
.fila{border-left:3.5px solid var(--t)}
.fila.u1{background:var(--card)}
.fila.u2{background:var(--card)}
.fila.u1:after, .fila.u2:after{display:none}
.fila.u2{box-shadow:inset 0 0 0 99px rgba(156,58,30,.07)}
.fila.u1 .f-btn{background:var(--t); border-color:var(--t); color:#fff}
.fila.u2 .f-btn{background:var(--warn); border-color:var(--warn); color:#fff}

.ahora{border-left-width:5px; border-left-color:var(--t); position:relative; overflow:hidden}
.ahora:before{content:''; position:absolute; inset:0; background:var(--t); opacity:.075; pointer-events:none}
.ahora.n2:before{opacity:.15}
.ahora-emo{color:var(--t)}
.ahora .btn-principal{background:var(--t)}
.ahora-txt b{position:relative}

.calma-picker button .ico{color:var(--t)}
.calma-picker button.act{background:var(--t); border-color:var(--t); color:#fff}
.calma-picker button.act .ico{color:#fff}

.toma.urg1{border-left:3.5px solid var(--h-ciruela)}
.tm-hora{letter-spacing:.5px}

/* la barra de abajo también se despierta */
.nav button.act{color:var(--teal-d)}
.nav button.act .ic{transform:translateY(-1px)}
@media (prefers-color-scheme:dark){ .nav button.act{color:var(--teal)} }

/* ---- Boya recupera presencia: la había encogido demasiado ---- */
.boya-tira{padding:14px 15px 14px 14px; gap:15px; background:var(--card);
  border:1px solid var(--line); box-shadow:0 2px 10px rgba(20,40,42,.07)}
.bt-retrato{width:96px; height:96px; border-radius:20px;
  box-shadow:inset 0 -18px 26px rgba(0,0,0,.16), 0 3px 10px rgba(14,124,134,.22)}
.bt-txt b{font-size:17px}
.bt-txt i{font-size:12px; -webkit-line-clamp:2}
.bt-bar{height:6px; margin-top:10px}
.bt-ir{font-size:22px}

/* ---- la escena de Boya: es el alma de la app, no un ítem de lista ---- */
.escena{position:relative; height:148px; border-radius:var(--radius); margin-top:14px; overflow:visible;
  background:linear-gradient(165deg, var(--esc1, #14666e) 0%, var(--teal) 52%, var(--esc2, var(--teal-d)) 100%);
  box-shadow:0 6px 20px rgba(11,66,71,.28)}
.escena:before{content:''; position:absolute; inset:0; border-radius:var(--radius); overflow:hidden;
  background:radial-gradient(ellipse at 22% 18%, rgba(255,255,255,.16), transparent 58%)}
.esc-suelo{position:absolute; left:0; right:0; bottom:0; height:34%; border-radius:0 0 var(--radius) var(--radius);
  background:linear-gradient(180deg, rgba(0,0,0,.16), rgba(0,0,0,.28))}
.esc-boya{position:absolute; left:12px; bottom:0; height:96%; width:auto; padding:0; background:none; border:none; cursor:pointer; z-index:2}
.esc-boya svg{height:100%; width:auto; animation:respirar 4.6s ease-in-out infinite; transform-origin:50% 100%;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.3))}
.esc-boya.tocada svg{animation:saludo .66s cubic-bezier(.34,1.4,.64,1)}
.esc-panel{position:absolute; right:13px; top:15px; bottom:15px; width:56%; z-index:3; cursor:pointer;
  display:flex; flex-direction:column; justify-content:center; color:#fff}
.esc-panel b{display:block; font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.2;
  text-shadow:0 1px 6px rgba(0,0,0,.35)}
.esc-panel i{display:block; font-style:normal; font-size:12px; line-height:1.45; margin-top:5px; color:rgba(255,255,255,.86);
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.esc-bar{height:6px; background:rgba(255,255,255,.22); border-radius:5px; overflow:hidden; margin-top:11px}
.esc-bar span{display:block; height:100%; background:#f0b17e; border-radius:5px; transition:width .35s}
.esc-panel em{display:block; font-style:normal; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.4px;
  color:rgba(255,255,255,.72); margin-top:8px}
.escena .globo-dialogo{bottom:calc(100% + 8px); left:78px}
@media(max-width:359px){ .esc-panel{width:52%} .esc-panel b{font-size:16px} }

/* fondo con algo de profundidad, no un plano beige */
body{background:linear-gradient(178deg, var(--bg2, #f2ebdc) 0%, var(--bg) 34%)}
@media (prefers-color-scheme:dark){ body{background:linear-gradient(178deg, var(--bg2, #0e191b) 0%, var(--bg) 34%)} }

/* la barra de abajo toma el color de su propia sección */
.nav button[data-value="hoy"].act{color:var(--h-agua)}
.nav button[data-value="cuidados"].act{color:var(--h-ciruela)}
.nav button[data-value="enfoque"].act{color:var(--h-terra)}
.nav button[data-value="calma"].act{color:var(--h-azul)}
.nav button[data-value="mas"].act{color:var(--ink)}

/* selector de tema */
.temas{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:9px; margin-top:14px}
.tema-op{display:flex; align-items:center; gap:9px; padding:10px 11px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--bg); font-size:12.5px; font-weight:700; color:var(--ink)}
.tema-op.sel{border-color:var(--coral); box-shadow:0 0 0 1.5px var(--coral)}
.tema-punto{width:22px; height:22px; border-radius:50%; flex:none; border:1.5px solid rgba(0,0,0,.14)}

/* ---- claridad: los rótulos se leen, los botones se alinean ---- */
.seccion{margin:24px 3px 11px}
.seccion span{font-family:var(--font-body); font-size:12px; font-weight:800; text-transform:uppercase;
  letter-spacing:1.1px; color:var(--ink); opacity:.62}
.seccion em{font-family:var(--font-body); font-size:11.5px; font-weight:600; color:var(--sub)}

/* la acción principal manda; la secundaria acompaña, no compite */
.ahora-btns{gap:9px}
.ahora-btns .btn{flex:2 1 0; min-width:0; padding:11px 12px}
.ahora-btns .btn-fantasma{flex:1 1 0; background:transparent; border-color:var(--t); color:var(--t)}

/* todos los botones de renglón miden lo mismo: la fila deja de verse rota */
.f-btn{min-width:74px; text-align:center; padding:9px 12px}
.fila{padding:12px 13px; gap:12px}
.f-txt b{font-size:14.5px}

/* qué hay dentro de una franja cerrada, sin abrirla */
.fr-cab{gap:10px; padding:14px}
.fr-mini{display:flex; gap:5px; align-items:center}
.fr-mini span{color:var(--t); opacity:.32; display:flex}
.fr-mini span.ok{opacity:1}
.fr-cont{font-family:var(--font-mono); font-size:10.5px; color:var(--sub); white-space:nowrap}
.franja.abierta .fr-cab{padding-bottom:10px}

/* la cámara quedaba flotando en el hueco entre casillas */
.foto-agregar, .foto-mini{top:5px; right:5px; width:23px; height:23px}
.foto-agregar{background:var(--card); border-color:var(--t, var(--line)); color:var(--t, var(--sub))}

/* separar los bloques para que se lean como bloques */
.filas{margin-top:10px}
.escena{margin-top:20px}
.franjas{margin-top:2px}
.nivel-card{margin-top:22px}

/* ---- menos botones, más lista: el ritmo transmite orden ---- */
.fila{width:100%; text-align:left; background:var(--card); cursor:pointer}
.f-marca{flex:none; width:25px; height:25px; border-radius:50%; border:1.8px solid var(--t);
  opacity:.4; display:flex; align-items:center; justify-content:center; transition:opacity .15s}
.f-marca.flecha{border:none; opacity:.55; font-size:19px; color:var(--sub); width:auto}
.fila:active .f-marca{opacity:1; background:var(--t)}
.fila:active{background:var(--bg)}

/* la acción secundaria de la tarjeta deja de ser un bloque */
.ahora-btns{gap:14px; align-items:center}
.ahora-btns .btn-principal{flex:0 1 auto; min-width:158px; width:auto}
.ahora-link{background:none; padding:6px 2px; font-size:12.5px; font-weight:700; color:var(--t); opacity:.85}

/* el pie de nivel se toca entero, sin botón propio */
.nivel-card{cursor:pointer}
.medallas-mini .med-link{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; opacity:.75; color:rgba(255,255,255,.75); white-space:nowrap; flex:none}
.fr-cab.plegar{color:var(--sub)}
.fr-cab.plegar .fr-et{font-size:12.5px; color:var(--sub); font-weight:600}

/* ---- Boya como mascota: mirada, gestos e interacción ---- */
.ojo-mira{transform-box:view-box; transform:translate(var(--mx,0), var(--my,0)); transition:transform .18s ease-out}
@keyframes gEstira{ 0%,100%{transform:translateY(0) scale(1,1)} 40%{transform:translateY(-5px) scale(.96,1.07)} 70%{transform:translateY(0) scale(1.03,.97)} }
@keyframes gMira{ 0%,100%{transform:rotate(0)} 30%{transform:rotate(-3.5deg)} 65%{transform:rotate(3deg)} }
@keyframes gBrinco{ 0%,100%{transform:translateY(0)} 30%{transform:translateY(-9px)} 55%{transform:translateY(0) scale(1.05,.94)} 75%{transform:translateY(-3px) scale(1,1)} }
.gesto-estira{animation:gEstira 1.5s ease-in-out !important}
.gesto-mira{animation:gMira 1.5s ease-in-out !important}
.gesto-brinco{animation:gBrinco 1.4s cubic-bezier(.34,1.4,.64,1) !important}

.cuarto-boya{height:340px}
.cuarto-personaje{border:none; background:none; padding:0; cursor:pointer; z-index:3}
.cuarto-desorden{border:none; padding:0; cursor:pointer; z-index:4; transition:transform .15s}
.cuarto-desorden:active{transform:scale(.75) rotate(-12deg); opacity:.4}
.globo-cuarto{position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:6;
  background:var(--card); color:var(--ink); padding:9px 14px; border-radius:14px; font-size:12.5px;
  font-weight:600; max-width:78%; text-align:center; box-shadow:0 5px 16px rgba(0,0,0,.25); animation:globoPop .25s ease}

.pide{margin-top:14px; text-align:center; font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--ink)}
.acciones-boya{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:13px}
.acc{display:flex; flex-direction:column; align-items:center; gap:3px; padding:13px 8px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--bg); color:var(--sub)}
.acc span{font-size:12.5px; font-weight:700; color:var(--ink)}
.acc i{font-style:normal; font-family:var(--font-mono); font-size:9.5px; color:var(--sub)}
.acc.urge{border-color:var(--coral); background:rgba(178,94,57,.09); color:var(--coral)}
.acc:disabled{opacity:.45}
.acc:active{transform:scale(.97)}
.medidores{display:flex; flex-direction:column; gap:7px; margin-top:15px}
.medidor{display:flex; align-items:center; gap:10px}
.md-et{flex:none; width:82px; font-size:11.5px; font-weight:600; color:var(--sub)}
.md-bar{flex:1; height:7px; background:var(--line); border-radius:5px; overflow:hidden}
.md-bar i{display:block; height:100%; background:var(--t); border-radius:5px; transition:width .4s}

/* ---- guardarropa ---- */
.conjunto{display:flex; gap:9px; margin-top:16px; justify-content:center; flex-wrap:wrap}
.cj-pieza{width:88px; display:flex; flex-direction:column; gap:5px; align-items:center}
.cj-pieza img{width:88px; height:88px; object-fit:cover; border-radius:var(--radius-s); border:1.5px solid var(--line); display:block}
.cj-pieza i{font-style:normal; font-size:10.5px; color:var(--sub); text-align:center; line-height:1.3}
.cj-sinfoto{width:88px; height:88px; border-radius:var(--radius-s); border:1.5px dashed var(--line); background:var(--bg);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--sub); text-align:center; padding:6px}
.cj-btns{display:flex; align-items:center; gap:16px; margin-top:18px; justify-content:center; flex-wrap:wrap}
.cj-btns .btn-principal{flex:0 1 auto; min-width:172px; width:auto}
.cj-btns .ahora-link{white-space:nowrap; color:var(--coral)}
.prendas-fila{display:flex; gap:9px; overflow-x:auto; margin-top:13px; padding-bottom:5px}
.pf-item{flex:none; width:76px; background:none; border:none; padding:0; display:flex; flex-direction:column; gap:4px; align-items:center}
.pf-item img{width:76px; height:76px; object-fit:cover; border-radius:var(--radius-s); border:1.5px solid var(--coral); display:block}
.pf-item .cj-sinfoto{width:76px; height:76px}
.pf-item i{font-style:normal; font-family:var(--font-mono); font-size:9.5px; color:var(--coral)}
.tipo-row{display:flex; gap:7px; margin-top:14px; flex-wrap:wrap}
.tipo-op{flex:1; min-width:74px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s);
  padding:9px 7px; font-size:11.5px; font-weight:700; color:var(--ink)}
.tipo-op.sel{border-color:var(--coral); background:rgba(178,94,57,.1)}
.arm-tit{margin:18px 0 9px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.9px; color:var(--ink); opacity:.6}
.arm-tit span{font-family:var(--font-mono); font-weight:500; opacity:.7}
.prendas-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(94px,1fr)); gap:10px}
.pg-item{position:relative; display:flex; flex-direction:column; gap:4px}
.pg-item img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:var(--radius-s); border:1.5px solid var(--line); display:block}
.pg-item .cj-sinfoto{width:100%; height:auto; aspect-ratio:1}
.pg-item b{font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.25}
.pg-item i{font-style:normal; font-family:var(--font-mono); font-size:9px; color:var(--sub)}
.pg-x{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.5);
  color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; padding:0}

/* ---- el día: rejilla siempre visible ---- */
.dia-card{padding:6px 14px 16px}
.dia-grupo{margin-top:14px}
.dia-grupo.ahora .dg-et{color:var(--coral)}
.dg-et{display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:800; text-transform:uppercase;
  letter-spacing:.9px; color:var(--sub); margin-bottom:9px}
.dg-et span{font-family:var(--font-mono); font-size:8.5px; font-weight:600; letter-spacing:.7px;
  border:1px solid var(--coral); border-radius:10px; padding:2px 6px; text-transform:uppercase}
.dia-grupo.ahora .grid-cats .cat{box-shadow:0 1px 5px rgba(0,0,0,.07)}

/* ---- nivel: una tira, no un bloque ---- */
.nivel-tira{display:flex; align-items:center; gap:10px; width:100%; margin-top:20px; padding:12px 14px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-s); text-align:left}
.nt-niv{font-size:12.5px; font-weight:700; color:var(--ink); white-space:nowrap}
.nt-dato{font-family:var(--font-mono); font-size:10.5px; color:var(--sub); white-space:nowrap}
.nt-bar{flex:1; min-width:26px; height:5px; background:var(--line); border-radius:4px; overflow:hidden}
.nt-bar i{display:block; height:100%; background:var(--coral); border-radius:4px}
.nt-fl{color:var(--sub); font-size:16px}

/* ---- hub "Más": informa, no solo lista ---- */
.hub{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:var(--radius-s); overflow:hidden}
.hub-item{display:flex; align-items:center; gap:13px; padding:15px 14px; background:var(--card); text-align:left; width:100%}
.hb-emo{color:var(--t); flex:none; display:flex}
.hb-txt{flex:1; min-width:0}
.hb-txt b{display:block; font-size:14.5px; font-weight:700; color:var(--ink)}
.hb-txt i{display:block; font-style:normal; font-size:11.5px; color:var(--sub); margin-top:2px}
.hb-fl{color:var(--sub); font-size:18px; flex:none}

/* ---- ajustes de la mascota ---- */
.ritmo-op{display:block; width:100%; text-align:left; padding:13px 14px; margin-top:9px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--bg)}
.ritmo-op.sel{border-color:var(--coral); background:rgba(178,94,57,.09)}
.ritmo-op b{display:block; font-size:14px; font-weight:700; color:var(--ink)}
.ritmo-op i{display:block; font-style:normal; font-size:12px; color:var(--sub); margin-top:3px; line-height:1.45}
.juntas{display:grid; grid-template-columns:repeat(auto-fit, minmax(84px,1fr)); gap:10px; margin-top:13px}
.jt{background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:12px 8px; text-align:center}
.jt b{display:block; font-family:var(--font-mono); font-size:20px; color:var(--ink)}
.jt span{font-size:10.5px; color:var(--sub)}

.hub-item.urge{background:linear-gradient(90deg, rgba(178,94,57,.1), var(--card) 60%)}
.hub-item.urge .hb-txt i{color:var(--coral); font-weight:600}
.huevo-wrap{display:flex; flex-direction:column; align-items:center; padding:26px 0 10px}
.huevo-svg{width:150px; height:180px; cursor:pointer; filter:drop-shadow(0 10px 18px rgba(0,0,0,.15))}
.huevo-svg.tambalea{animation:tambaleo .55s ease}
@keyframes tambaleo{ 0%,100%{transform:rotate(0)} 20%{transform:rotate(-8deg)} 40%{transform:rotate(7deg)} 60%{transform:rotate(-5deg)} 80%{transform:rotate(4deg)} }
.nace-retrato{width:130px; height:130px; margin:0 auto}
.boya-txt{flex:1; min-width:0}
.boya-txt .titulo{font-weight:700; font-size:15.5px; margin-bottom:2px}
.boya-txt .sub{font-size:13px}
.ver-boya-link{font-size:12px; font-weight:700; color:var(--mint-ink); margin-top:8px; display:inline-flex; align-items:center; gap:5px; background:var(--mint); padding:6px 12px; border-radius:20px}

.conchitas-chip{font-family:var(--font-mono); display:flex; align-items:center; gap:4px; background:var(--mint); color:var(--mint-ink); font-weight:600; font-size:12.5px; padding:5px 10px; border-radius:20px; transition:transform .15s}
.conchitas-chip.pulso{animation:pulso-conchita .4s ease}
@keyframes pulso-conchita{ 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }

.boya-panel-header{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.boya-panel-header button{font-size:14px; font-weight:700; color:var(--teal-d); display:flex; align-items:center; gap:4px}
@media (prefers-color-scheme:dark){ .boya-panel-header button{color:var(--teal)} }
.boya-retrato-wrap{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px}
.boya-retrato{position:relative; width:150px; height:150px; border-radius:50%; overflow:hidden; background:linear-gradient(160deg, var(--teal), var(--teal-d)); box-shadow:0 8px 24px rgba(14,124,134,.3)}
.boya-retrato svg{width:88%; height:88%; position:absolute; left:6%; top:6%; animation:respirar 4.6s ease-in-out infinite; transform-origin:50% 100%}
.boya-nombre-fila{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px}
.boya-nombre-fila input{font-family:var(--font-display); font-style:italic; font-size:22px; font-weight:600; text-align:center; border:none; background:none; color:var(--ink); width:auto; max-width:200px; border-bottom:1.5px dashed var(--line); padding:2px 4px}
.vinculo-barra{margin-top:14px; width:100%}
.subtabs{display:flex; gap:8px; margin:16px 0 14px; background:var(--bg); padding:4px; border-radius:20px}
.subtabs button{flex:1; padding:9px; border-radius:16px; font-size:13px; font-weight:700; color:var(--sub)}
.subtabs button.act{background:var(--card); color:var(--teal-d); box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){ .subtabs button.act{color:var(--teal)} }
.tienda-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}

function mensajeAlTocar(){
  /* primero lo que está pasando de verdad hoy; el pozo genérico es el respaldo */
  var n=necesidadesBoya();
  var pm=pendientesMedicamentos();
  var propios=[];
  if(pm.length) propios.push('Te falta la de las '+pm[0].hora+'. Lo digo y ya, sin drama.');
  if(n.hambre>=85) propios.push('Oye… ¿me das algo de comer?');
  if(n.juego>=85) propios.push('¿Jugamos un rato? Te vendría bien a ti también.');
  if(desordenPendiente()>=3) propios.push('Hay cosas tiradas. Si quieres las recogemos juntas.');
  if(minutosHoy()>=metaEnfoque()) propios.push('Llegaste a tus minutos de hoy. Yo vi todo el rato.');
  var rr=calcularProgreso();
  if(rr.racha>=3) propios.push('Van '+rr.racha+' días seguidos. No lo digo por presionar, lo digo porque lo vi.');
  if(propios.length && Math.random()<0.62) return propios[Math.floor(Math.random()*propios.length)];
  var stats=statsExtra(calcularEstadisticas());
  var cuenta=contarCategorias(entradaHoy());
  var h=new Date().getHours();
  var pool=MENSAJES_BOYA.slice();
  if(stats.racha>=30){
    pool=pool.concat([stats.racha+' días seguidos. A estas alturas esto ya es parte de quién eres.']);
  } else if(stats.racha>=7){
    pool=pool.concat([
      'Llevas '+stats.racha+' días seguidos. Eso no es casualidad.',
      stats.racha+' días. Te estás demostrando algo, aunque no lo digas en voz alta.'
    ]);
  }
  if(h<6 || h>=23){
    pool=pool.concat([
      '¿Despierta a esta hora? Yo también floto de noche a veces. No te voy a decir que deberías dormir.',
      'La madrugada pesa distinto. Aquí estoy, aunque no tenga mucho más que ofrecerte que compañía.'
    ]);
  } else if(cuenta===0 && h>=19){
    pool=pool.concat([
      'Hoy fue de esos días. Mañana es otra vez desde cero, sin arrastrar nada.',
      'No pasó mucho hoy y está bien. Ya estás aquí, conmigo.'
    ]);
  } else if(cuenta===0 && h<12){
    pool=pool.concat(['Recién empieza el día. Sin apuro, sin lista que cumplir todavía.']);
  }
  if(S.creado===hoyISO() && Object.keys(S.entradas).length<=1){
    pool=pool.concat(['Recién nos conocemos. Qué bueno que estás aquí.']);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

    for(var k in base){ if(d[k]===undefined) d[k]=base[k]; }

    if(!d.contadores) d.contadores=base.contadores;
    else { ['ropaUsos','tareasUsos','miniToques','tocarBoyaTotal','comprasTotal','conchitasGanadasTotal','pendientesResueltos','fotosTotal'].forEach(function(ck){ if(d.contadores[ck]===undefined) d.contadores[ck]=0; }); }

    else { if(d.usuario.nombre===undefined) d.usuario.nombre=''; if(d.usuario.foto===undefined) d.usuario.foto=null; }
    if(!d.boya) d.boya=base.boya;

    if(!d.pendientes) d.pendientes=[];

    if(d.tema===undefined) d.tema=null;
    if(!d.eventos) d.eventos=[];

    if(d.conjuntoHoy===undefined) d.conjuntoHoy=null;
    if(!d.cuidadosCfg) d.cuidadosCfg={};
    if(!d.enfoque) d.enfoque=base.enfoque;
    else { if(d.enfoque.metaMin===undefined) d.enfoque.metaMin=120;
           if(!d.enfoque.min) d.enfoque.min={};
           if(d.enfoque.activa===undefined) d.enfoque.activa=null; }
    if(d.conchitas===undefined) d.conchitas=0;

function rutinaRachaConsecutiva(rutina){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var n=0, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var hechos=(S.rutinasHechas[iso]&&S.rutinasHechas[iso][rutina.id])||[];
    var completa=rutina.pasos.length>0 && rutina.pasos.every(function(p){ return hechos.indexOf(p.id)>=0; });
    var esHoy=(cursor.getTime()===hoy.getTime());
    if(completa){ n++; }
    else if(esHoy){ /* hoy no cuenta en contra todavía */ }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return n;
}

/* ===================== cálculos del juego ===================== */
function contarCategorias(e){
  if(!e) return 0;
  var n=0;
  ['desayuno','almuerzo','cena','ducha','bano','mover','dormir'].forEach(function(k){ if(e[k]) n++; });
  if(e.agua>0) n++;
  return n;
}
var UMBRAL_DIA=3;

function calcularRacha(){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var streak=0, saltos=1, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var cuenta=contarCategorias(S.entradas[iso]);
    var esHoy=(cursor.getTime()===hoy.getTime());
    if(cuenta>=UMBRAL_DIA){ streak++; }
    else if(esHoy){ /* hoy no cuenta en contra, todavía no termina */ }
    else if(saltos>0){ saltos--; }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function calcularConsecutivos(campo){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var n=0, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var e=S.entradas[iso];
    var esHoy=(cursor.getTime()===hoy.getTime());
    var val = campo==='agua' ? (e && e.agua>0) : (e && e[campo]);
    if(val){ n++; }
    else if(esHoy){ /* hoy aún no cuenta en contra */ }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return n;
}
function detectarRegreso(){
  var dias=Object.keys(S.entradas).filter(function(k){ return contarCategorias(S.entradas[k])>0; }).sort();
  for(var i=1;i<dias.length;i++){
    var a=new Date(dias[i-1]+'T00:00:00'), b=new Date(dias[i]+'T00:00:00');
    var gap=Math.round((b-a)/86400000);
    if(gap>=3) return true;
  }
  return false;
}

function calcularEstadisticas(){
  var totalBool=0, totalAgua=0, desayunos=0, moverTotal=0, dormirTotal=0, aguaMaxDia=0;
  Object.keys(S.entradas).forEach(function(k){
    var e=S.entradas[k];
    ['desayuno','almuerzo','cena','ducha','bano','mover','dormir'].forEach(function(c){ if(e[c]) totalBool++; });
    totalAgua += (e.agua||0);
    if(e.desayuno) desayunos++;
    if(e.mover) moverTotal++;
    if(e.dormir) dormirTotal++;
    if(e.agua>aguaMaxDia) aguaMaxDia=e.agua;
  });
  var rutinasCompletadasTotal=0;
  Object.keys(S.rutinasHechas).forEach(function(iso){
    S.rutinas.forEach(function(r){
      var hechos=S.rutinasHechas[iso][r.id]||[];
      if(r.pasos.length>0 && r.pasos.every(function(p){ return hechos.indexOf(p.id)>=0; })) rutinasCompletadasTotal++;
    });
  });
  var rutinaMejorRacha=0;
  S.rutinas.forEach(function(r){ rutinaMejorRacha=Math.max(rutinaMejorRacha, rutinaRachaConsecutiva(r)); });
  return {
    totalBool:totalBool, totalAgua:totalAgua, desayunos:desayunos, moverTotal:moverTotal, dormirTotal:dormirTotal,
    aguaMaxDia:aguaMaxDia, racha:calcularRacha(), duchaSeguidos:calcularConsecutivos('ducha'),
    ropaUsos:S.contadores.ropaUsos||0, tareasUsos:S.contadores.tareasUsos||0, miniToques:S.contadores.miniToques||0,
    comprasTotal:S.contadores.comprasTotal||0, vinculoNivel:calcularVinculo().nivel,
    rutinasCompletadasTotal:rutinasCompletadasTotal, rutinaMejorRacha:rutinaMejorRacha,
    pendientesResueltos:S.contadores.pendientesResueltos||0, fotosTotal:S.contadores.fotosTotal||0,
    volviste:detectarRegreso()
  };
}
function statsExtra(st){
  st.medTomas=(S.contadores&&S.contadores.medTomas)||0;
  st.cuidadosPerra=(S.contadores&&S.contadores.cuidadosPerra)||0;
  st.minutosEnfoque=(S.contadores&&S.contadores.minutosEnfoque)||0;
  var meta=metaEnfoque(), dias=0;
  for(var k in (S.enfoque&&S.enfoque.min)||{}){ if(S.enfoque.min[k]>=meta) dias++; }
  st.enfoqueMetaDias=dias;
  st.medDiaCompleto=(S.medicamentos||[]).length>0 && (S.medicamentos||[]).every(function(m){
    return m.activo===false || tomasDeHoy(m).every(function(t){ return t.tomada; });
  });
  st.perrasDiaCompleto=(S.perras||[]).length>0 && pendientesPerras().length===0 &&
    (S.perras||[]).some(function(pe){ return CUIDADOS.some(function(c){ return cuidadoActivo(c) && vecesHoy('perra:'+pe.id+':'+c.id)>0; }); });

  });

function calcularProgreso(){
  /* las medallas nuevas necesitan datos que no vivían en calcularEstadisticas */
  var stats=statsExtra(calcularEstadisticas());
  var crudas=medallasCrudas(stats);
  var yaGanadas=S.medallasGanadas||[];
  var medallas=crudas.map(function(m){
    return {id:m.id, emo:m.emo, titulo:m.titulo, desc:m.desc, on:(m.cumple || yaGanadas.indexOf(m.id)>=0)};
  });
  var pts = stats.totalBool*3 + stats.totalAgua*1 + stats.racha*5 + stats.ropaUsos*2 + stats.tareasUsos*4 + stats.miniToques*2;
  var nivel=Math.min(NIVELES.length, Math.floor(Math.sqrt(pts/40))+1);
  var sigue=Math.pow(nivel,2)*40, previo=Math.pow(nivel-1,2)*40;
  var esMax=nivel>=NIVELES.length;
  return {
    pts:pts, nivel:nivel, nombre:NIVELES[nivel-1], esMax:esMax,
    prog: esMax ? 100 : Math.max(0, Math.min(100, Math.round((pts-previo)/(sigue-previo)*100))),
    faltan: esMax ? 0 : Math.max(0, sigue-pts),
    racha:stats.racha, medallas:medallas, ganadas:medallas.filter(function(m){ return m.on; }).length
  };
}
function mensajeBoya(cuenta){
  var n=(S.boya&&S.boya.nombre)||'Boya';
  if(cuenta<=0) return {id:'deriva', t:n+' está dormida', s:'Tócala, aunque sea solo para saludar. Eso también cuenta.'};
  if(cuenta<=2) return {id:'bajito', t:n+' flota bajo', s:'Lo que sea que hagas ahora suma, sin apuro.'};
  if(cuenta<=4) return {id:'flote', t:n+' se mantiene a flote', s:'Vas bien, a tu ritmo — no al de nadie más.'};
  if(cuenta<=6) return {id:'tranquila', t:n+' nada tranquila', s:'Hoy te estás cuidando de verdad. Se nota.'};
  return {id:'brilla', t:n+' está que brilla', s:'Día completo. Orgullo, no perfección.'};
}

function calcularVinculo(){
  var c=S.contadores||{};
  var pts=(c.conchitasGanadasTotal||0) + (c.tocarBoyaTotal||0) + (c.comprasTotal||0)*4;
  var nivel=Math.min(NIVELES_VINCULO.length, Math.floor(Math.sqrt(pts/20))+1);
  var sigue=Math.pow(nivel,2)*20, previo=Math.pow(nivel-1,2)*20;
  var esMax=nivel>=NIVELES_VINCULO.length;
  return {
    pts:pts, nivel:nivel, nombre:NIVELES_VINCULO[nivel-1], esMax:esMax,
    prog: esMax?100:Math.max(0,Math.min(100,Math.round((pts-previo)/(sigue-previo)*100)))
  };
}

function ordenCuarto(){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var total=0, dias=0;
  for(var i=0;i<3;i++){
    var d=new Date(hoy); d.setDate(d.getDate()-i);
    var e=S.entradas[toISO(d)];
    if(e){ total+=contarCategorias(e); dias++; }
  }
  var prom = dias ? (total/dias)/CATS.length : 0;
  if(prom>=0.75) return 3;
  if(prom>=0.45) return 2;
  if(prom>=0.2) return 1;
  return 0;
}
function actividadBoya(){
  var hr=new Date().getHours();
  if(hr>=23 || hr<6) return 'durmiendo';
  var e=entradaHoy();
  if((hr>=7&&hr<10&&e.desayuno)||(hr>=12&&hr<15&&e.almuerzo)||(hr>=18&&hr<21&&e.cena)) return 'comiendo';
  return 'de_pie';
}

/* ===================== registro con hora =====================
   El resto de la app guarda "hoy si / hoy no". Eso no alcanza: con TDAH
   el problema no es saber SI algo pasó, es no tener ni idea de CUÁNDO.
   Este log guarda la hora de cada cosa, y de ahí sale todo lo que
   necesita reloj: "hace cuánto", "cuántas veces hoy", "ya toca". */
function registrarEvento(k, extra){
  if(!S.eventos) S.eventos=[];
  var ev={t:Date.now(), k:k};
  if(extra){ for(var x in extra) ev[x]=extra[x]; }
  S.eventos.push(ev);
  if(S.eventos.length>4000) S.eventos=S.eventos.slice(-3000);
}
function podarEventos(){
  if(!S.eventos){ S.eventos=[]; return; }
  var limite=Date.now()-45*24*3600*1000;
  var antes=S.eventos.length;
  S.eventos=S.eventos.filter(function(e){ return e && e.t>=limite; });
  if(S.eventos.length!==antes) guardar();
}
function ultimaVez(k){
  if(!S.eventos) return null;
  for(var i=S.eventos.length-1;i>=0;i--){ if(S.eventos[i].k===k) return S.eventos[i].t; }
  return null;
}
function vecesHoy(k){
  if(!S.eventos) return 0;
  var d=new Date(); d.setHours(0,0,0,0); var ini=d.getTime(), n=0;
  for(var i=S.eventos.length-1;i>=0;i--){
    if(S.eventos[i].t<ini) break;
    if(S.eventos[i].k===k) n++;
  }
  return n;
}
function haceTexto(ms){
  if(ms===null||ms===undefined) return 'sin registro todavía';
  var min=Math.floor((Date.now()-ms)/60000);
  if(min<2) return 'hace un momento';
  if(min<60) return 'hace '+min+' min';
  var h=Math.floor(min/60), r=min%60;
  if(h<24) return 'hace '+h+' h'+(r>=10?' '+r+' min':'');
  var d=Math.floor(h/24);
  return 'hace '+d+(d===1?' día':' días');
}
function horaDe(ms){
  if(ms===null||ms===undefined) return '—';
  var d=new Date(ms);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}

function cuidadoDe(id){ return CUIDADOS.filter(function(c){ return c.id===id; })[0]; }
function vecesMeta(c){
  var cfg=S.cuidadosCfg&&S.cuidadosCfg[c.id];
  return (cfg&&cfg.veces)||c.veces;
}
function cuidadoActivo(c){
  var cfg=S.cuidadosCfg&&S.cuidadosCfg[c.id];
  return !(cfg&&cfg.off);
}
/* urgencia: 0 al día · 1 ya toca · 2 lleva mucho */
function estadoCuidado(perra, c){
  var k='perra:'+perra.id+':'+c.id;
  var meta=vecesMeta(c), hechas=vecesHoy(k), ult=ultimaVez(k);
  var horas = ult===null ? 999 : (Date.now()-ult)/3600000;
  var urg=0;
  if(hechas<meta){
    if(horas>=c.cadaH*1.7) urg=2;
    else if(horas>=c.cadaH) urg=1;
  }
  return {clave:k, meta:meta, hechas:hechas, ultima:ult, horas:horas, urgencia:urg, cuidado:c};
}
function pendientesPerras(){
  var out=[];
  (S.perras||[]).forEach(function(pe){
    CUIDADOS.forEach(function(c){
      if(!cuidadoActivo(c)) return;
      var st=estadoCuidado(pe, c);
      if(st.urgencia>0){ st.perra=pe; out.push(st); }
    });
  });
  out.sort(function(a,b){ return (b.urgencia-a.urgencia) || (b.horas-a.horas); });
  return out;
}
function nombresPerras(){
  var n=(S.perras||[]).map(function(p){ return p.nombre; });
  if(n.length===0) return '';
  if(n.length===1) return n[0];
  return n.slice(0,-1).join(', ')+' y '+n[n.length-1];
}

/* ===================== bloques de enfoque =====================
   "Dos horas al día" es imposible de empezar porque el cerebro ve las dos
   horas enteras. Acá nunca se empieza una sesión larga: se empieza una de
   5 minutos, y al terminar decides si sigues. Los minutos se acumulan
   igual, así que dos horas se construyen de a pedazos sin decidirlo una
   sola vez. El contador va a la vista porque el tiempo no se siente. */
var TRAMOS=[
  {min:5,  et:'5 min', sub:'solo arrancar'},
  {min:15, et:'15 min', sub:'un empujón'},
  {min:25, et:'25 min', sub:'un bloque'},
  {min:45, et:'45 min', sub:'a fondo'}
];
function minutosHoy(){
  return Math.round((S.enfoque.min && S.enfoque.min[hoyISO()]) || 0);
}
function metaEnfoque(){ return S.enfoque.metaMin || 120; }
function sumarMinutos(m){
  if(!S.enfoque.min) S.enfoque.min={};
  var k=hoyISO();
  S.enfoque.min[k]=(S.enfoque.min[k]||0)+m;
  var lim=Date.now()-120*24*3600*1000;
  for(var d in S.enfoque.min){
    if(new Date(d+'T00:00:00').getTime()<lim) delete S.enfoque.min[d];
  }
}
/* la sesión vive en S, no en memoria: si cierras la app sigue corriendo */
function sesionRestanteMs(){
  var a=S.enfoque.activa;
  if(!a) return 0;
  var fin=a.inicio + a.durMin*60000 + (a.pausaAcum||0);
  if(a.pausadaEn) fin += (Date.now()-a.pausadaEn);
  return Math.max(0, fin-Date.now());
}
function sesionTranscurridoMin(){
  var a=S.enfoque.activa;
  if(!a) return 0;
  var ms=Date.now()-a.inicio-(a.pausaAcum||0);
  if(a.pausadaEn) ms-=(Date.now()-a.pausadaEn);
  return Math.max(0, ms/60000);
}
function mmss(ms){
  var t=Math.ceil(ms/1000);
  return pad(Math.floor(t/60))+':'+pad(t%60);
}
function iniciarSesion(min){
  S.enfoque.activa={ inicio:Date.now(), durMin:min, pausadaEn:null, pausaAcum:0 };
  registrarEvento('enfoque:inicio', {min:min});
  arrancarRelojEnfoque();
}
function terminarSesion(completada){
  var a=S.enfoque.activa;
  if(!a) return;
  var m=Math.round(sesionTranscurridoMin());
  S.enfoque.activa=null;
  detenerRelojEnfoque();
  if(m>=1){
    sumarMinutos(m);
    registrarEvento('enfoque:fin', {min:m});
    S.contadores.minutosEnfoque=(S.contadores.minutosEnfoque||0)+m;
    ganarConchitas(Math.max(2, Math.round(m/5)));
    guardar();
    celebrar('enfoque', {titulo:m+' min de trabajo', sub: completada ? 'Bloque completo. Eso ya está hecho.' : 'Cuenta igual — el tiempo que estuviste, estuviste.'});
  } else {
    guardar(); render();
  }
}
var relojEnfoque=null;
function arrancarRelojEnfoque(){
  detenerRelojEnfoque();
  relojEnfoque=setInterval(function(){
    var a=S.enfoque.activa;
    if(!a){ detenerRelojEnfoque(); return; }
    if(!a.pausadaEn && sesionRestanteMs()<=0){ terminarSesion(true); return; }
    var el=document.getElementById('reloj-enfoque');
    if(el) el.textContent=mmss(sesionRestanteMs());
    else render();
  }, 1000);
}
function detenerRelojEnfoque(){ if(relojEnfoque){ clearInterval(relojEnfoque); relojEnfoque=null; } }

/* ===================== medicamentos =====================
   A diferencia de las perras (que van por intervalo), los medicamentos van
   por HORA fija, y la pregunta que hay que responder no es "¿ya toca?" sino
   "¿ya me la tomé o me lo estoy imaginando?". Por eso cada toma del día es
   una casilla propia con su hora: se ve de un vistazo cuál está tomada, a
   qué hora exacta se tomó, y cuál falta — sin tener que recordar nada.
   Ancla registra y recuerda; qué hacer con una dosis saltada lo decide ella
   con su médico, no la app. */
var HORAS_SUGERIDAS={1:['08:00'], 2:['08:00','20:00'], 3:['08:00','14:00','20:00'], 4:['08:00','13:00','18:00','22:00']};
function minutosDeHora(hhmm){
  var pr=(hhmm||'08:00').split(':');
  return Number(pr[0])*60+Number(pr[1]);
}
function eventosHoyDe(k){
  if(!S.eventos) return [];
  var d=new Date(); d.setHours(0,0,0,0); var ini=d.getTime(), out=[];
  for(var i=S.eventos.length-1;i>=0;i--){
    if(S.eventos[i].t<ini) break;
    if(S.eventos[i].k===k) out.push(S.eventos[i]);
  }
  return out;
}
/* urgencia por casilla: 0 al día · 1 ya pasó la hora · 2 lleva más de 2 h */
function tomasDeHoy(m){
  var evs=eventosHoyDe('med:'+m.id);
  var ahora=new Date().getHours()*60+new Date().getMinutes();
  return (m.horas||[]).map(function(hh, i){
    var ev=evs.filter(function(e){ return e.slot===i; })[0];
    var atraso = ahora - minutosDeHora(hh);
    var urg = ev ? 0 : atraso>=120 ? 2 : atraso>=15 ? 1 : 0;
    return {i:i, hora:hh, tomada:!!ev, cuando:ev?ev.t:null, urgencia:urg, pendiente:!ev};
  });
}
function pendientesMedicamentos(){
  var out=[];
  (S.medicamentos||[]).forEach(function(m){
    if(m.activo===false) return;
    tomasDeHoy(m).forEach(function(t){
      if(t.urgencia>0){ t.med=m; out.push(t); }
    });
  });
  out.sort(function(a,b){ return (b.urgencia-a.urgencia) || (minutosDeHora(a.hora)-minutosDeHora(b.hora)); });
  return out;
}
function ultimaTomaDe(m){ return ultimaVez('med:'+m.id); }

/* ===================== qué toca ahora =====================
   El resto de la app es una lista: la lista obliga a elegir, y elegir es
   justo lo que se traba. Esto devuelve UNA sola cosa, la que más pesa en
   este momento, con el botón para hacerla ahí mismo. Prioridad: primero
   lo que afecta a alguien que depende de ti, después tú, después trabajo. */
function listaPendientes(){
  var hr=new Date().getHours();
  var e=entradaHoy();
  var out=[];

  pendientesMedicamentos().forEach(function(t){
    out.push({ urg:t.urgencia===2?2:1, ico:'pastilla', tono:'ciruela',
      t:t.med.nombre, meta:t.hora,
      sub:'Esta toma no está registrada'+(t.med.dosis?' ('+t.med.dosis+')':'')+'. La última que anotaste fue '+(ultimaTomaDe(t.med)?haceTexto(ultimaTomaDe(t.med)):'—')+'.',
      tipo:'marcar', actos:[{act:'tomar-med', val:t.med.id+'|'+t.i, et:'Ya la tomé', cls:'btn-principal'},
                         {act:'nav', val:'medicamentos', et:'Ver todo', cls:'btn-fantasma'}] });
  });

  if(S.enfoque && S.enfoque.activa){
    out.push({ urg:1, ico:'reloj', tono:'terra', t:'Bloque corriendo', meta:mmss(sesionRestanteMs()),
      sub:'Quedan '+mmss(sesionRestanteMs())+'. Vuelve a él, no lo dejes abierto.',
      tipo:'ir', actos:[{act:'nav', val:'enfoque', et:'Volver al bloque', cls:'btn-principal'}] });
  }

  /* solo lo más urgente de cada perra: cuatro renglones por perra hacían
     esta lista tan larga como la que se quiso evitar */
  var yaPerra={};
  pendientesPerras().forEach(function(u){
    if(yaPerra[u.perra.id]) return;
    yaPerra[u.perra.id]=true;
    out.push({ urg:u.urgencia, ico:u.cuidado.ico, tono:u.cuidado.tono,
      t:u.perra.nombre+' · '+u.cuidado.et.toLowerCase(),
      meta:(u.ultima===null?'sin registro':haceTexto(u.ultima)),
      sub:(u.ultima===null?'Hoy no hay registro todavía.':'La última vez fue '+haceTexto(u.ultima)+'.')+' Ella no puede recordártelo.',
      tipo:'marcar', actos:[{act:'registrar-cuidado', val:u.perra.id+'|'+u.cuidado.id, et:u.cuidado.verbo, cls:'btn-principal'},
                          {act:'nav', val:'medicamentos', et:'Ver todo', cls:'btn-fantasma'}] });
  });

  var tieneRopa=(S.prendas&&S.prendas.length)||S.ropa.length;
  var yaVestida=(S.conjuntoHoy && S.conjuntoHoy.fecha===hoyISO() && S.conjuntoHoy.puesto);
  if(hr>=6 && hr<13 && tieneRopa && !yaVestida){
    out.push({ urg:0, ico:'camiseta', tono:'indigo', t:'Vestirte', meta:'sin elegir',
      sub:'No lo pienses: deja que Ancla elija de lo que ya guardaste.',
      tipo:'ir', actos:[{act:'nav', val:'vestirme', et:'Que elija por mí', cls:'btn-principal'}] });
  }

  var mom=momentoActual();
  var pendCat=CATS.filter(function(c){ return c.momento===mom && !c.contable && !e[c.id]; })[0];
  if(pendCat){
    out.push({ urg:0, ico:pendCat.ico, tono:pendCat.tono, t:pendCat.et, meta:'de esta franja',
      sub:'Es lo que toca en esta franja. Si ya lo hiciste, márcalo y listo.',
      tipo:'marcar', actos:[{act:'toggle-cat', val:pendCat.id, et:'Hecho', cls:'btn-principal'}] });
  }

  var faltan=metaEnfoque()-minutosHoy();
  if(!(S.enfoque&&S.enfoque.activa) && faltan>0 && hr>=7 && hr<22){
    out.push({ urg:0, ico:'diana', tono:'terra', t:'Trabajo', meta:minutosHoy()+' de '+metaEnfoque()+' min',
      sub:minutosHoy()>0 ? 'Llevas '+minutosHoy()+' min. Faltan '+faltan+' y no tienen que ser seguidos.'
                          : 'Empieza con 5 minutos. Solo cinco — después decides.',
      tipo:'ir', actos:[{act:'iniciar-sesion', val:'5', et:'Arrancar 5 min', cls:'btn-principal'},
                          {act:'nav', val:'enfoque', et:'Otro tramo', cls:'btn-fantasma'}] });
  }

  if(S.pendientes && S.pendientes.length){
    out.push({ urg:0, ico:'caja', tono:'oliva', t:S.pendientes[0].texto, meta:'lo anotaste tú',
      sub:'Lo anotaste tú. Si ya no aplica, bórralo sin culpa.',
      tipo:'ir', actos:[{act:'nav', val:'rutinas', et:'Ver pendientes', cls:'btn-principal'}] });
  }

  out.sort(function(a,b){ return b.urg-a.urg; });
  return out;
}

/* ===================== Boya como mascota =====================
   Sus necesidades NO corren con un temporizador: se calculan desde la
   hora del último evento. Así funcionan igual si la app estuvo cerrada
   tres días, sin procesos colgados ni estados imposibles.

   Regla de diseño que no se rompe: Boya nunca se enferma, nunca se pone
   triste "por tu culpa" y nunca se pierde nada por no atenderla. Esta app
   es para alguien a quien la culpa ya le pesa de sobra; una mascota que
   sufre por descuido sería exactamente lo contrario de lo que hace falta.
   Sus necesidades son una invitación, jamás un reproche. */
/* El punto medio: que Boya tenga vida interior sin volverse una tarea
   más. El ritmo lo elige la usuaria; por defecto pide poco. Aunque pida,
   nunca pasa nada malo si no la atienden — eso no cambia. */
var RITMOS_BOYA=[
  {id:'tranquila', et:'Tranquila', desc:'Casi nunca pide nada. Está ahí y ya.', hambre:26, juego:60},
  {id:'normal',    et:'Normal',    desc:'Pide algo de vez en cuando, sin insistir.', hambre:13, juego:32},
  {id:'compania',  et:'Compañera', desc:'Más presente: te busca varias veces al día.', hambre:7,  juego:18}
];
function ritmoBoya(){
  var id=(S.boya&&S.boya.ritmo)||'normal';
  return RITMOS_BOYA.filter(function(r){ return r.id===id; })[0] || RITMOS_BOYA[1];
}
function necesidadesBoya(){
  var _r=ritmoBoya(), HORAS_HAMBRE=_r.hambre, HORAS_JUEGO=_r.juego;
  var tc=ultimaVez('boya:comer'), tj=ultimaVez('boya:jugar'), tm=ultimaVez('boya:caricia');
  var hc = tc===null ? HORAS_HAMBRE : (Date.now()-tc)/3600000;
  var hj = tj===null ? HORAS_JUEGO : (Date.now()-tj)/3600000;
  var hm = tm===null ? 12 : (Date.now()-tm)/3600000;
  var HORAS_MIMO=Math.round(HORAS_JUEGO*0.7);
  var hambre=Math.max(0, Math.min(100, Math.round(hc/HORAS_HAMBRE*100)));
  var juego =Math.max(0, Math.min(100, Math.round(hj/HORAS_JUEGO*100)));
  var mimos =Math.max(0, Math.min(100, Math.round(hm/HORAS_MIMO*100)));
  return {
    hambre:hambre, juego:juego, mimos:mimos,
    saciada:100-hambre, entretenida:100-juego, querida:100-mimos,
    ultimaComida:tc, ultimoJuego:tj, ultimaCaricia:tm,
    // el ánimo es el promedio de lo que sí está cubierto
    animo: Math.round(((100-hambre)+(100-juego)+(100-mimos))/3)
  };
}
function boyaPideAlgo(){
  var n=necesidadesBoya();
  if(n.hambre>=85) return {id:'comer', et:'Tiene hambre', accion:'dar-comer'};
  if(n.juego>=85) return {id:'jugar', et:'Quiere jugar', accion:'jugar-boya'};
  if(n.mimos>=90) return {id:'caricia', et:'Quiere un mimo', accion:'tocar-boya'};
  return null;
}
/* cuántas cosas tiradas quedan por recoger hoy */
function desordenPendiente(){
  var orden=ordenCuarto();
  var total = orden===0?5:orden===1?3:orden===2?1:0;
  var recogidas=vecesHoy('boya:limpiar');
  return Math.max(0, total-recogidas);
}

/* ===================== reacciones de Boya =====================
   Una acción no es solo guardar un dato: Boya cambia de cara, hace algo
   durante unos segundos y dice algo que viene de lo que de verdad pasó.
   Eso es lo que separa una mascota de un contador. */
var accionTimer=null;
var REACCIONES={
  comer:['Mmm. Gracias.','Justo tenía hambre.','Esto estaba muy bueno.','Comer también es cuidarse — para las dos.'],
  jugar:['¡Otra vez!','Me encanta cuando jugamos.','Ya me cansé un poquito. Del bueno.','Esto también cuenta como un descanso, ¿sabías?'],
  caricia:['Ay, qué rico.','Me quedo así un rato.','Yo también me alegro de verte.','Gracias por venir.'],
  ordenado:['¡Quedó impecable!','Ahora sí se respira.','Gracias — se sentía apretado.','Mira cómo se ve todo.']
};
function accionBoya(actividad, tipo){
  clearTimeout(accionTimer); clearTimeout(dialogoTimer);
  V.boyaAccion=actividad;
  V.boyaTocada=true;
  var pool=REACCIONES[tipo];
  V.dialogoBoya = pool ? pool[Math.floor(Math.random()*pool.length)] : mensajeAlTocar();
  ganarConchitas(1);
  sonidoArpegio(); vibrar([12,28,12]);
  guardar(); render();
  accionTimer=setTimeout(function(){
    V.boyaAccion=null; V.boyaTocada=false; render();
  }, 3400);
  dialogoTimer=setTimeout(function(){ V.dialogoBoya=null; render(); }, 4400);
}

/* La mirada sigue el dedo. Es el detalle barato que más la hace parecer
   viva: mueve los ojos unos píxeles hacia donde está tocando. */
function seguirMirada(ev){
  var esc=ev.target.closest && ev.target.closest('.escena, .cuarto-boya');
  if(!esc) return;
  /* la decoración también son SVG: hay que apuntar a la de Boya, no a la
     primera del cuarto, o la maceta terminaría "mirando" en su lugar */
  var svg=esc.querySelector('.cuarto-personaje svg, .esc-boya svg');
  if(!svg) return;
  var r=svg.getBoundingClientRect();
  var px=(ev.clientX-(r.left+r.width/2))/(r.width/2);
  var py=(ev.clientY-(r.top+r.height*0.32))/(r.height/2);
  var mx=Math.max(-1,Math.min(1,px))*1.7, my=Math.max(-1,Math.min(1,py))*1.2;
  svg.style.setProperty('--mx', mx.toFixed(2)+'px');
  svg.style.setProperty('--my', my.toFixed(2)+'px');
}
document.addEventListener('pointermove', seguirMirada, {passive:true});
document.addEventListener('pointerleave', function(){
  document.querySelectorAll('.cuarto-personaje svg, .esc-boya svg').forEach(function(sv){
    sv.style.removeProperty('--mx'); sv.style.removeProperty('--my');
  });
}, {passive:true});

/* Gestos sueltos cada tanto: estirarse, mirar alrededor, sacudir la cola.
   Se aplican tocando la clase en el DOM, sin volver a renderizar. */
var GESTOS=['gesto-estira','gesto-mira','gesto-brinco'];
function gestoBoya(){
  var sv=document.querySelector('.escena svg, .cuarto-personaje svg');
  if(sv && !V.boyaAccion){
    var g=GESTOS[Math.floor(Math.random()*GESTOS.length)];
    GESTOS.forEach(function(x){ sv.classList.remove(x); });
    void sv.offsetWidth;
    sv.classList.add(g);
    setTimeout(function(){ sv.classList.remove(g); }, 1600);
  }

var audioCtx=null;
function obtenerAudioCtx(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function tono(freq, inicio, dur){
  if(S.efectos===false) return;
  var ctx=obtenerAudioCtx(); if(!ctx) return;
  try{
    var t0=ctx.currentTime+inicio;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function sonidoPop(freq){ tono(freq||660, 0, 0.16); }
function sonidoArpegio(){ tono(523,0,0.14); tono(659,0.09,0.14); tono(784,0.18,0.22); }
function vibrar(patron){
  if(S.efectos===false) return;
  if(navigator.vibrate){ try{ navigator.vibrate(patron); }catch(e){} }
}
function flotarPuntos(origenEl, texto){

  var r=origenEl.getBoundingClientRect();
  var el=document.createElement('div');

  el.textContent=texto;
  el.style.left=(r.left+r.width/2)+'px';
  el.style.top=(r.top)+'px';

}

/* ===================== foto de perfil ===================== */
function comprimirImagen(file, tam, calidad, cb){
  if(!file || file.type.indexOf('image/')!==0){ cb(null); return; }
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      canvas.width=tam; canvas.height=tam;
      var ctx=canvas.getContext('2d');
      var lado=Math.min(img.width, img.height);
      var sx=(img.width-lado)/2, sy=(img.height-lado)/2;
      ctx.drawImage(img, sx, sy, lado, lado, 0, 0, tam, tam);
      var dataURL=null;
      try{ dataURL=canvas.toDataURL('image/jpeg', calidad); }catch(e){}
      cb(dataURL);
    };
    img.onerror=function(){ cb(null); };
    img.src=reader.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}

function revisarRecordatorios(){
  if(!S.recordatorios.activos) return;
  var ahora=new Date(), hm=horaMin(ahora), hoy=hoyISO();
  ['desayuno','almuerzo','cena','dormir'].forEach(function(k){
    var r=S.recordatorios[k];
    if(r && r.on && r.hora===hm && S.recordatorios.ultimoAviso[k]!==hoy){
      notificar(TEXTOS_REC[k][0], TEXTOS_REC[k][1]);
      S.recordatorios.ultimoAviso[k]=hoy; guardar();
    }
  });
  /* medicamentos: avisan a su hora exacta, y una sola vez por casilla */
  (S.medicamentos||[]).forEach(function(m){
    if(m.activo===false) return;
    (m.horas||[]).forEach(function(hh, i){
      var clave='med:'+m.id+':'+i;
      if(hh!==hm || S.recordatorios.ultimoAviso[clave]===hoy) return;
      if(eventosHoyDe('med:'+m.id).some(function(ev){ return ev.slot===i; })) return;
      notificar('Es hora de '+m.nombre, (m.dosis?m.dosis+'. ':'')+'Toca para anotarla en Ancla.');
      S.recordatorios.ultimoAviso[clave]=hoy; guardar();
    });
  });
  /* perras: aviso cuando algo lleva mucho vencido, maximo uno por hora */
  var vencidas=pendientesPerras().filter(function(u){ return u.urgencia===2; });
  if(vencidas.length){
    var claveP='perras-vencido';
    var ultP=S.recordatorios.ultimoAviso[claveP]||0;
    if(Date.now()-ultP >= 3600000){
      var v0=vencidas[0];
      notificar(v0.cuidado.et+' de '+v0.perra.nombre,
        v0.ultima===null ? 'Hoy no hay registro todavía.' : 'La última vez fue '+haceTexto(v0.ultima)+'.');
      S.recordatorios.ultimoAviso[claveP]=Date.now(); guardar();
    }
  }
  var ag=S.recordatorios.agua;
  if(ag && ag.on){
    var h=ahora.getHours();
    if(h>=7 && h<=22 && (Date.now()-(ag.ultimoMs||0))>=ag.horas*3600000){
      notificar('💧 Agua','¿Tomaste agua hace rato? Un vaso ahora.');
      ag.ultimoMs=Date.now(); guardar();
    }
  }
}

function elegirRopa(clima){
  var candidatos=S.ropa.filter(function(r){ return !clima || !r.clima || r.clima===clima; });
  if(candidatos.length===0) candidatos=S.ropa.slice();
  if(candidatos.length===0) return null;
  candidatos.sort(function(a,b){
    var ua=a.ultimoUso||''; var ub=b.ultimoUso||'';
    return ua<ub ? -1 : ua>ub ? 1 : 0;
  });
  var mitad=Math.max(1, Math.ceil(candidatos.length/2));
  var top=candidatos.slice(0, mitad);
  return top[Math.floor(Math.random()*top.length)];
}

/* ===================== guardarropa =====================
   El problema real no es "no sé combinar": es no acordarse de lo que se
   tiene. Por eso las prendas van con FOTO — la memoria visual no depende
   de recordar el nombre — y la app lleva la cuenta de cuándo se usó cada
   una. Con eso puede armar conjuntos prefiriendo lo que lleva más tiempo
   guardado, que es justo lo contrario de repetir siempre lo mismo. */
var TIPOS_PRENDA=[
  {id:'superior', et:'Arriba',   ico:'camiseta', nec:true},
  {id:'inferior', et:'Abajo',    ico:'camiseta', nec:true},
  {id:'completo', et:'Vestido / enterizo', ico:'camiseta', nec:false},
  {id:'calzado',  et:'Zapatos',  ico:'camiseta', nec:false},
  {id:'abrigo',   et:'Abrigo',   ico:'camiseta', nec:false}
];
function prendasDe(tipo, clima){
  return (S.prendas||[]).filter(function(pr){
    if(pr.tipo!==tipo) return false;
    if(clima && pr.clima && pr.clima!==clima) return false;
    return true;
  });
}
function diasSinUsar(pr){
  if(!pr.ultimoUso) return 999;
  var d=new Date(pr.ultimoUso+'T00:00:00');
  return Math.floor((Date.now()-d.getTime())/86400000);
}
/* elige entre las que llevan más tiempo sin ponerse, con algo de azar
   para que no sea siempre la misma rotación mecánica */
function elegirPrenda(tipo, clima, excluir){
  var lista=prendasDe(tipo, clima).filter(function(pr){ return !excluir || excluir.indexOf(pr.id)<0; });
  if(!lista.length) lista=prendasDe(tipo, null).filter(function(pr){ return !excluir || excluir.indexOf(pr.id)<0; });
  if(!lista.length) return null;
  lista.sort(function(a,b){ return diasSinUsar(b)-diasSinUsar(a); });
  var tope=Math.max(1, Math.ceil(lista.length/2));
  return lista[Math.floor(Math.random()*tope)];
}
function armarConjunto(clima){
  var piezas=[], usados=[];
  var vestido = prendasDe('completo', clima).length && Math.random()<0.5 ? elegirPrenda('completo', clima, usados) : null;
  if(vestido){ piezas.push(vestido); usados.push(vestido.id); }
  else {
    var arriba=elegirPrenda('superior', clima, usados);
    if(arriba){ piezas.push(arriba); usados.push(arriba.id); }
    var abajo=elegirPrenda('inferior', clima, usados);
    if(abajo){ piezas.push(abajo); usados.push(abajo.id); }
  }
  var zap=elegirPrenda('calzado', clima, usados);
  if(zap){ piezas.push(zap); usados.push(zap.id); }
  if(clima==='frio'){
    var abr=elegirPrenda('abrigo', clima, usados);
    if(abr) piezas.push(abr);
  }
  return piezas.length ? piezas : null;
}
function olvidadas(n){
  return (S.prendas||[]).slice()

    .slice(0, n||6);
}
