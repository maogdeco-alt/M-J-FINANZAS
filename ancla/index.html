function renderHoy(){
  var e=entradaHoy();
  var cuenta=contarCategorias(e);
  var bm=mensajeBoya(cuenta);
  var jg=calcularProgreso();
  var pct=Math.round(cuenta/CATS.length*100);
  var h='';

  if(S.usuario.nombre){
    h+='<div class="saludo-nombre">'+esc(saludo())+', '+esc(S.usuario.nombre)+'</div>';
  }
  if(debeMostrarNudge()){
    h+='<div class="banner">🫧 <div>¿Sientes que estás revisando esto muchas veces seguidas? Puedes activar el <b>modo suave</b>, que oculta números y rachas.<div class="acciones"><button data-action="activar-suave">Activar modo suave</button><button data-action="descartar-nudge">Ahora no</button></div></div></div>';
  }

  /* ---- 1. lo que sigue: el primero en grande, el resto en renglones.
         Antes esto eran dos bloques ("Ahora" y "Pendiente ahora") y el
         mismo pendiente salía dos veces seguidas. ---- */
  var pend=listaPendientes();
  h+='<div class="seccion"><span>Ahora</span>'+(pend.length>1?'<em>'+pend.length+' pendientes</em>':'')+'</div>';
  if(!pend.length){
    h+='<div class="ahora n-1" style="--t:var(--h-agua)">';
    h+='<div class="ahora-fila"><span class="ahora-emo">'+ico('ola',28)+'</span>';
    h+='<div class="ahora-txt"><b>No hay nada urgente</b><i>En serio. Lo de hoy está cubierto — '+esc((S.boya&&S.boya.nombre)||'Boya')+' también lo nota.</i></div></div>';
    h+='</div>';
  } else {
    var jefe=pend[0];
    h+='<div class="ahora n'+jefe.urg+'" style="--t:var(--h-'+jefe.tono+')">';
    h+='<div class="ahora-fila"><span class="ahora-emo">'+ico(jefe.ico,28)+'</span>';
    h+='<div class="ahora-txt"><b>'+esc(jefe.t)+(jefe.meta&&jefe.meta.indexOf(':')>0?' · '+jefe.meta:'')+'</b><i>'+esc(jefe.sub)+'</i></div></div>';
    h+='<div class="ahora-btns">';
    h+='<button class="btn btn-principal btn-chico" data-action="'+jefe.actos[0].act+'" data-value="'+esc(jefe.actos[0].val)+'">'+esc(jefe.actos[0].et)+'</button>';
    if(jefe.actos[1]) h+='<button class="ahora-link" data-action="'+jefe.actos[1].act+'" data-value="'+esc(jefe.actos[1].val)+'">'+esc(jefe.actos[1].et)+' ›</button>';
    h+='</div></div>';

    var resto=pend.slice(1);
    if(resto.length){
      h+='<div class="filas">';
      /* Renglón entero tocable, con una casilla en vez de un botón macizo:
         una lista de chequeo se lee tranquila, una fila de botones cansa. */
      resto.slice(0,3).forEach(function(f){
        h+='<button class="fila u'+f.urg+'" style="--t:var(--h-'+f.tono+')" data-action="'+f.actos[0].act+'" data-value="'+esc(f.actos[0].val)+'">';
        h+='<span class="f-emo">'+ico(f.ico,20)+'</span>';
        h+='<span class="f-txt"><b>'+esc(f.t)+'</b><i>'+esc(f.meta)+'</i></span>';
        h+='<span class="f-marca '+(f.tipo==='ir'?'flecha':'')+'">'+(f.tipo==='ir'?'›':'')+'</span>';
        h+='</button>';
      });
      if(resto.length>3) h+='<button class="fila-mas" data-action="nav" data-value="yo">y '+(resto.length-3)+' más ›</button>';
      h+='</div>';
    }
  }

  /* ---- 4. el día: solo la franja de ahora abierta, el resto plegado ---- */
  var fotos=fotosDeHoy();
  var momActual=momentoActual();
  var abierto = V.momentoAbierto || momActual;
  function renderCat(c){
    if(c.contable){
      var n=e.agua||0;
      return '<div class="cat '+(n>0?'on':'')+'" style="--t:var(--h-'+(c.tono||'humo')+')"><div class="emo">'+ico(c.ico,26)+'</div><div class="et">'+c.et+'</div>'+
        '<div class="agua-row"><button data-action="agua-menos">–</button><span class="badge-n">'+n+'</span><button data-action="agua-mas">+</button></div></div>';
    }
    var hecho=!!e[c.id];
    var hh='<div class="cat-wrap">';
    hh+='<button class="cat '+(hecho?'on':'')+'" data-action="toggle-cat" data-value="'+c.id+'" style="--t:var(--h-'+(c.tono||'humo')+')"><div class="emo">'+ico(c.ico,26)+'</div><div class="et">'+c.et+'</div></button>';
    if(c.foto){
      if(fotos[c.id]){
        hh+='<button class="foto-mini" data-action="ver-foto" data-value="'+c.id+'"><img src="'+fotos[c.id]+'" alt=""></button>';
      } else if(hecho){
        hh+='<label class="foto-agregar" title="Agregar foto de respaldo (+3 conchas)">'+ico('camara',16)+'<input type="file" accept="image/*" capture="environment" id="inp-foto-cat-'+c.id+'" style="display:none"></label>';
      }
    }
    hh+='</div>';
    return hh;
  }

  h+='<div class="seccion"><span>Todo lo de hoy</span><em>'+cuenta+' de '+CATS.length+'</em></div>';
  /* Plegar el día en franjas escondía los botones: lo que hay que marcar
     tiene que estar SIEMPRE a la vista. Una sola rejilla, agrupada por
     momento, con el de ahora resaltado. */
  h+='<div class="card dia-card">';
  MOMENTOS.concat([{id:'dia', et:'Todo el día'}]).forEach(function(mom){
    var cats=CATS.filter(function(c){ return c.momento===mom.id; });
    if(!cats.length) return;
    var esAhora=(mom.id===momActual);
    h+='<div class="dia-grupo'+(esAhora?' ahora':'')+'">';
    h+='<div class="dg-et">'+mom.et+(esAhora?'<span>ahora</span>':'')+'</div>';
    h+='<div class="grid-cats">';
    cats.forEach(function(c){ h+=renderCat(c); });
    h+='</div></div>';
  });
  if(S.miniRecordatorios.length){
    var extra=extraDeHoy();
    h+='<div class="dia-grupo">';
    h+='<div class="dg-et">Tuyos</div>';
    h+='<div class="grid-cats">';
    S.miniRecordatorios.forEach(function(m){
      h+='<button class="cat '+(extra[m.id]?'on':'')+'" data-action="toggle-mini" data-value="'+m.id+'" style="--t:var(--h-humo)"><div class="emo">'+m.emo+'</div><div class="et">'+esc(m.texto)+'</div></button>';
    });
    h+='</div></div>';
  }
  h+='</div>';

  /* ---- 3. Boya: acompaña después de lo que hay que hacer ---- */
  var fondoEq = S.equipado.fondo && FONDOS_BOYA[S.equipado.fondo];
  h+='<div class="escena" '+(fondoEq?'style="background:'+fondoEq.grad+'"':'')+'>';
  h+='<div class="esc-suelo"></div>';
  h+='<button class="esc-boya'+(V.boyaTocada?' tocada':'')+'" data-action="tocar-boya">'+dibujarNutria(bm.id, null, V.boyaAccion||actividadBoya())+'</button>';
  h+='<div class="esc-panel" data-action="nav" data-value="boya">';
  h+='<b>'+bm.t+'</b><i>'+bm.s+'</i>';
  h+='<div class="esc-bar"><span style="width:'+pct+'%"></span></div>';
  h+='<em>'+cuenta+' de '+CATS.length+' hoy · su cuarto ›</em>';
  h+='</div>';
  if(V.dialogoBoya) h+='<div class="globo-dialogo">'+esc(V.dialogoBoya)+'</div>';
  h+='</div>';

  return h;
}

      h+='<button class="btn btn-principal btn-chico" style="margin-top:10px" data-action="adoptar-rutina" data-value="'+idx+'">Usar esta rutina</button></div>';
    });
    h+='</div>';
  }

  h+='<div class="card">';
  h+='<h3>Crear una rutina propia</h3>';
  h+='<p class="sub">Ponle nombre y agrega los pasos, uno a uno — a tu manera.</p>';
  h+='<div class="fila-input" style="margin-top:12px">';
  h+='<input type="text" id="inp-rutina-nombre" placeholder="Ej: Antes de dormir" value="'+esc(V.rutinaNombre)+'">';

  h+='<div class="fila-input" style="margin-top:8px">';
  h+='<input type="text" id="inp-rutina-paso" placeholder="Un paso…" value="'+esc(V.rutinaPasoTexto)+'">';
  h+='<button class="btn btn-fantasma btn-chico" data-action="agregar-paso-nueva-rutina">+ Paso</button>';
  h+='</div>';
  if(V.rutinaPasos.length){
    h+='<div class="rutina-borrar">';

      h+='<div class="paso-editable"><span class="t">'+esc(t)+'</span><button data-action="quitar-paso-nueva-rutina" data-value="'+i+'">✕</button></div>';
    });
    h+='</div>';
  }
  h+='<button class="btn btn-principal" style="margin-top:14px" data-action="crear-rutina">Crear rutina</button>';
  h+='</div>';

  return h;
}

  h+='<div class="card">';
  h+='<h3>Tus datos</h3>';
  h+='<p class="sub">Todo vive solo en este navegador/celular — no se sube a ningún servidor. Eso también significa que si cambias de celular o borras el navegador, se pierde, salvo que hagas una copia.</p>';
  h+='<div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap">';

  h+='<label class="btn btn-fantasma btn-chico file-fake">Importar copia<input type="file" id="inp-importar" accept="application/json" style="display:none"></label>';
  h+='</div>';
  h+='<hr class="sep">';
  h+='<button class="danger-btn" data-action="borrar-todo">Borrar todos los datos</button>';
  h+='</div>';

  h+='<div class="card acerca">';
  h+='<h3>Acerca de Ancla</h3>';
  h+='<p>Hecha para días donde cosas simples —comer, bañarse, elegir ropa— cuestan de verdad. No mide si lo hiciste "bien", solo te ayuda a que no se te olvide y te da algo con qué celebrar cuando pasa.</p>';
  h+='<p>No reemplaza acompañamiento médico o psicológico. Si notar patrones como los de hoy (olvidar comer, señales de hambre/sed apagadas) se repite mucho, vale la pena comentarlo con quien te trate.</p>';
  h+='<p style="font-size:11px; opacity:.6">Ancla v'+VERSION+'</p>';
  h+='</div>';

  return h;
}

/* ===================== interacción ===================== */
function toggleCategoria(id){
  if(!entradaHoy()[id]) registrarEvento('cat:'+id);
  var e=entradaHoy();
  e[id]=!e[id];
  guardar();
}
function cambiarAgua(delta){
  var e=entradaHoy();
  e.agua=Math.max(0, (e.agua||0)+delta);
  guardar();
}

var ACCIONES_JUEGO=['toggle-cat','agua-mas','agua-menos','toggle-mini','elegir-ropa','dividir-tarea','tarea-rapida','toggle-paso-rutina'];

app.addEventListener('click', function(ev){
  var b=ev.target.closest('[data-action]');
  if(!b) return;
  var act=b.dataset.action, val=b.dataset.value;

  var esJuego = ACCIONES_JUEGO.indexOf(act)>=0;
  var prevCuenta = esJuego ? contarCategorias(entradaHoy()) : 0;
  var prevJg = esJuego ? calcularProgreso() : null;
  var rutinaIdActual=null, prevRutinaCompleta=false, nombreRutinaActual='';
  if(act==='toggle-paso-rutina'){
    rutinaIdActual=val.split('|')[0];
    var rutPrev=S.rutinas.filter(function(r){ return r.id===rutinaIdActual; })[0];
    if(rutPrev){ prevRutinaCompleta=rutinaCompletaHoy(rutPrev); nombreRutinaActual=rutPrev.emo+' '+rutPrev.nombre; }
  }

  if(act==='nav'){ V.tab=val; V.mostrarMedallas=false; }
  else if(act==='toggle-cat'){
    toggleCategoria(val);
    if(entradaHoy()[val]){ flotarPuntos(b, S.modoSuave?'✨':'+3'); sonidoPop(660); vibrar(12); ganarConchitas(1); }
  }
  else if(act==='agua-mas'){
    cambiarAgua(1);
    flotarPuntos(b, S.modoSuave?'✨':'+1'); sonidoPop(720); vibrar(10); ganarConchitas(1);
  }
  else if(act==='agua-menos'){ cambiarAgua(-1); }
  else if(act==='tocar-boya'){
    S.contadores.tocarBoyaTotal=(S.contadores.tocarBoyaTotal||0)+1;
    registrarEvento('boya:caricia');
    accionBoya('mimada','caricia');
    return;
  }
  else if(act==='ver-medallas'){ V.mostrarMedallas=!V.mostrarMedallas; }
  else if(act==='activar-suave'){ S.modoSuave=true; S.nudgeVisto=hoyISO(); guardar(); }
  else if(act==='descartar-nudge'){ S.nudgeVisto=hoyISO(); guardar(); }
  else if(act==='toggle-modo-suave'){ S.modoSuave=!S.modoSuave; guardar(); }
  else if(act==='toggle-efectos'){ S.efectos=(S.efectos===false); guardar(); }
  else if(act==='romper-huevo'){
    if(V.huevoTambaleando) return;
    sonidoArpegio(); vibrar([15,30,15,30,60]);
    V.huevoTambaleando=true;
    render();
    setTimeout(function(){
      V.onboardingPaso='nace';
      V.huevoTambaleando=false;
      lanzarConfeti(40);
      render();
    }, 650);
    return;
  }
  else if(act==='terminar-onboarding'){
    var inpN=document.getElementById('inp-nombre-onboarding');
    var inpB=document.getElementById('inp-nombre-boya-onboarding');
    S.usuario.nombre=(inpN?inpN.value:'').trim();
    var nombreBoya=(inpB?inpB.value:'').trim();
    if(nombreBoya) S.boya.nombre=nombreBoya;
    S.onboardingVisto=true; guardar();
    celebrar('bienvenida', {titulo:'Listo'+(S.usuario.nombre?', '+S.usuario.nombre:'')+' 🎉', sub:'Cuando quieras, toca lo que ya hiciste hoy.'});
  }
  else if(act==='saltar-onboarding'){
    S.onboardingVisto=true; guardar();
    celebrar('bienvenida', {titulo:'Listo 🎉', sub:'Cuando quieras, toca lo que ya hiciste hoy.'});
  }
  else if(act==='quitar-foto'){ S.usuario.foto=null; guardar(); }
  else if(act==='agregar-ropa'){
    var inp=document.getElementById('inp-ropa');
    var texto=(inp?inp.value:'').trim();
    if(texto){ S.ropa.push({clima:V.ropaClima||null, id:'r'+Date.now(), texto:texto, ultimoUso:null}); V.ropaNueva=''; guardar(); }
  }
  else if(act==='quitar-ropa'){
    S.ropa=S.ropa.filter(function(r){ return r.id!==val; });
    if(S.ropaHoy && S.ropaHoy.id===val) S.ropaHoy=null;
    guardar();
  }
  else if(act==='elegir-ropa'){
    var elegido=elegirRopa(V.climaHoy);
    if(elegido){
      elegido.ultimoUso=hoyISO();
      S.contadores.ropaUsos=(S.contadores.ropaUsos||0)+1;
      S.ropaHoy={id:elegido.id, fecha:hoyISO()};
      sonidoPop(600); vibrar(10); ganarConchitas(1);
      guardar();
    }
  }
  else if(act==='elegir-mini-emo'){ V.miniEmo=val; }
  else if(act==='agregar-mini'){
    var inpM=document.getElementById('inp-mini-texto');
    var texto=(inpM?inpM.value:'').trim();
    if(texto){
      S.miniRecordatorios.push({id:'m'+Date.now(), emo:V.miniEmo||'📌', texto:texto});
      V.miniTexto=''; V.miniEmo='📌'; guardar();
    }
  }
  else if(act==='quitar-mini'){
    S.miniRecordatorios=S.miniRecordatorios.filter(function(m){ return m.id!==val; });
    guardar();
  }
  else if(act==='toggle-mini'){
    var extra=extraDeHoy();
    extra[val]=!extra[val];
    if(extra[val]){
      S.contadores.miniToques=(S.contadores.miniToques||0)+1;
      flotarPuntos(b, S.modoSuave?'✨':'+2'); sonidoPop(760); vibrar(12); ganarConchitas(1);
    }
    guardar();
  }
  else if(act==='dividir-tarea' || act==='tarea-rapida'){
    var texto = act==='tarea-rapida' ? val : (function(){ var inpT=document.getElementById('inp-tarea'); return (inpT?inpT.value:'').trim(); })();
    if(texto){
      S.tareaActual=dividirTarea(texto);
      S.contadores.tareasUsos=(S.contadores.tareasUsos||0)+1;
      V.tareaTexto=''; sonidoPop(600); vibrar(10); ganarConchitas(1); guardar();
    }
  }
  else if(act==='subtab-boya'){ V.subtabBoya=val; }
  else if(act==='ritmo-boya'){
    if(!S.boya) S.boya={nombre:'Boya'};
    S.boya.ritmo=val; sonidoPop(620); vibrar(10);
  }
  else if(act==='comprar-item'){
    var art=ITEMS_BOYA.filter(function(x){return x.id===val;})[0];
    var vinc=calcularVinculo();
    if(art && S.comprados.indexOf(art.id)===-1 && (S.conchitas||0)>=art.precio && vinc.nivel>=art.vinculoMin){
      S.conchitas-=art.precio;
      S.comprados.push(art.id);
      if(art.tipo!=='decor') S.equipado[art.tipo]=art.id;
      S.contadores.comprasTotal=(S.contadores.comprasTotal||0)+1;
      sonidoArpegio(); vibrar([20,30,20]);
      mostrarToast(art.tipo==='decor' ? 'Ya está en el cuarto de '+(S.boya.nombre||'Boya')+' 🎉' : (S.boya.nombre||'Boya')+' ya tiene '+art.nombre.toLowerCase()+' 🎉');
    }
  }
  else if(act==='equipar-item'){
    var art2=ITEMS_BOYA.filter(function(x){return x.id===val;})[0];
    if(art2){
      S.equipado[art2.tipo] = (S.equipado[art2.tipo]===art2.id) ? null : art2.id;
      sonidoPop(600); vibrar(10);
    }
  }
  else if(act==='iniciar-sesion'){
    iniciarSesion(Number(val));
    sonidoPop(680); vibrar([15,30,15]);
    V.tab='enfoque';
  }
  else if(act==='pausar-sesion'){
    var sa=S.enfoque.activa;
    if(sa){
      if(sa.pausadaEn){ sa.pausaAcum=(sa.pausaAcum||0)+(Date.now()-sa.pausadaEn); sa.pausadaEn=null; arrancarRelojEnfoque(); }
      else { sa.pausadaEn=Date.now(); }
      vibrar(10);
    }
  }
  else if(act==='terminar-sesion'){ terminarSesion(false); return; }
  else if(act==='meta-enfoque'){
    S.enfoque.metaMin=Math.max(15, Math.min(480, metaEnfoque()+Number(val)));
  }
  else if(act==='guardar-distraccion'){
    var inpD=document.getElementById('inp-distraccion');
    var txtD=(inpD?inpD.value:'').trim();
    if(txtD){
      S.pendientes.unshift({id:'x'+Date.now(), texto:txtD.slice(0,120), fecha:hoyISO()});
      V.distraccion=''; sonidoPop(560); vibrar(8);
      mostrarToast('Guardado en pendientes. Sigue en lo tuyo.');
    }
  }
  else if(act==='dar-comer' || act==='jugar-boya'){
    var esComer = act==='dar-comer';
    registrarEvento(esComer?'boya:comer':'boya:jugar');
    S.contadores[esComer?'vecesComio':'vecesJugo']=(S.contadores[esComer?'vecesComio':'vecesJugo']||0)+1;
    accionBoya(esComer?'comiendo':'jugando', esComer?'comer':'jugar');
    return;
  }
  else if(act==='recoger'){
    registrarEvento('boya:limpiar');
    S.contadores.recogidos=(S.contadores.recogidos||0)+1;
    ganarConchitas(1); sonidoPop(760); vibrar(10);
    flotarPuntos(b, S.modoSuave?'✨':'+1');
    if(desordenPendiente()===0){ accionBoya('jugando','ordenado'); return; }
  }
  else if(act==='recoger-todo'){
    var faltan=desordenPendiente();
    for(var rz=0; rz<faltan; rz++) registrarEvento('boya:limpiar');
    if(faltan){
      S.contadores.recogidos=(S.contadores.recogidos||0)+faltan;
      ganarConchitas(faltan);
      accionBoya('jugando','ordenado');
      return;
    }
  }
  else if(act==='ver-resto'){ V.verResto=!V.verResto; }
  else if(act==='abrir-franja'){ V.momentoAbierto = (V.momentoAbierto===val) ? '__ninguna__' : val; }
  else if(act==='med-veces'){ V.medVeces=Number(val); }
  else if(act==='agregar-med'){
    var inpMd=document.getElementById('inp-med');
    var inpDs=document.getElementById('inp-med-dosis');
    var nomMd=(inpMd?inpMd.value:'').trim();
    if(nomMd){
      var vc=V.medVeces||1;
      S.medicamentos.push({ id:'m'+Date.now(), nombre:nomMd.slice(0,32),
        dosis:(inpDs?inpDs.value:'').trim().slice(0,32), horas:(HORAS_SUGERIDAS[vc]||['08:00']).slice(), activo:true });
      V.medNombre=''; V.medDosis=''; sonidoPop(620); vibrar(12);
      mostrarToast(nomMd+' agregado. Revisa las horas abajo.');
    }
  }
  else if(act==='quitar-med'){ S.medicamentos=S.medicamentos.filter(function(x){ return x.id!==val; }); }
  else if(act==='tomar-med'){
    var mp=val.split('|'), mm=(S.medicamentos||[]).filter(function(x){ return x.id===mp[0]; })[0], slot=Number(mp[1]);
    if(mm){
      var yaEv=eventosHoyDe('med:'+mm.id).filter(function(e){ return e.slot===slot; })[0];
      if(yaEv){
        if(confirm('Esta toma ya está registrada a las '+horaDe(yaEv.t)+'. ¿Quieres borrar el registro? (solo si te equivocaste al marcarla)')){
          S.eventos=S.eventos.filter(function(e){ return e!==yaEv; });
          mostrarToast('Registro borrado.');
        }
      } else {
        /* red de seguridad: nunca dejar que un toque distraído parezca una dosis nueva */
        var ult=ultimaTomaDe(mm);
        var seguir=true;
        if(ult && (Date.now()-ult) < 45*60000){
          seguir=confirm('Ya registraste una toma de '+mm.nombre+' hace '+haceTexto(ult).replace('hace ','')+'. ¿Seguro que tomaste otra dosis?');
        }
        if(seguir){
          registrarEvento('med:'+mm.id, {slot:slot});
          S.contadores.medTomas=(S.contadores.medTomas||0)+1;
          sonidoPop(720); vibrar([12,25,12]); ganarConchitas(2);
          flotarPuntos(b, S.modoSuave?'✨':'+2');
          mostrarToast(mm.nombre+' · anotado a las '+horaDe(Date.now()));
        }
      }
    }
  }
  else if(act==='elegir-tema'){
    S.tema = (val==='auto') ? null : val;
    guardar(); aplicarTema(); sonidoPop(640); vibrar(10);
  }
  else if(act==='elegir-tipo-prenda'){ V.prendaTipo=val; }
  else if(act==='elegir-clima-prenda'){ V.prendaClima=val||null; }
  else if(act==='agregar-prenda-sinfoto'){ guardarPrenda(null); return; }
  else if(act==='quitar-prenda'){
    S.prendas=S.prendas.filter(function(x){ return x.id!==val; });
    if(S.conjuntoHoy && S.conjuntoHoy.piezas) S.conjuntoHoy.piezas=S.conjuntoHoy.piezas.filter(function(z){ return z!==val; });
  }
  else if(act==='armar-conjunto'){
    var piezas=armarConjunto(V.climaHoy);
    if(piezas){
      S.conjuntoHoy={fecha:hoyISO(), piezas:piezas.map(function(x){ return x.id; }), puesto:false};
      sonidoPop(640); vibrar(10);
    } else { mostrarToast('Todavía no hay prendas suficientes.'); }
  }
  else if(act==='confirmar-conjunto'){
    if(S.conjuntoHoy && !S.conjuntoHoy.puesto){
      S.conjuntoHoy.puesto=true;
      S.conjuntoHoy.piezas.forEach(function(pid){
        var pr=(S.prendas||[]).filter(function(x){ return x.id===pid; })[0];
        if(pr){ pr.ultimoUso=hoyISO(); pr.usos=(pr.usos||0)+1; }
      });
      S.ropaHoy={id:S.conjuntoHoy.piezas[0], fecha:hoyISO()};
      S.contadores.ropaUsos=(S.contadores.ropaUsos||0)+1;
      registrarEvento('vestirse');
      ganarConchitas(2); sonidoArpegio(); vibrar([15,30,15]);
      mostrarToast('Listo. Una decisión menos hoy.');

  }
  else if(act==='ver-prenda'){
    var pv=(S.prendas||[]).filter(function(x){ return x.id===val; })[0];
    if(pv && pv.foto) V.verFoto=pv.foto;

  else if(act==='elegir-clima'){ V.climaHoy=val; }
  else if(act==='elegir-clima-nueva'){ V.ropaClima=val||null; }
  else if(act==='elegir-perra-emo'){ V.perraEmo=val; }
  else if(act==='agregar-perra'){
    var inpP=document.getElementById('inp-perra');
    var nomP=(inpP?inpP.value:'').trim();
    if(nomP){
      S.perras.push({id:'p'+Date.now(), nombre:nomP.slice(0,18), emo:V.perraEmo||'🐕'});
      V.perraNombre=''; sonidoPop(620); vibrar(12);
      mostrarToast(nomP+' ya está en Ancla 🐾');
    }
  }
  else if(act==='quitar-perra'){
    S.perras=S.perras.filter(function(x){ return x.id!==val; });
  }
  else if(act==='registrar-cuidado'){
    var prt=val.split('|'), peR=(S.perras||[]).filter(function(x){ return x.id===prt[0]; })[0], cR=cuidadoDe(prt[1]);
    if(peR && cR){
      registrarEvento('perra:'+peR.id+':'+cR.id);
      S.contadores.cuidadosPerra=(S.contadores.cuidadosPerra||0)+1;
      sonidoPop(700); vibrar([12,25,12]); ganarConchitas(2);
      flotarPuntos(b, S.modoSuave?'✨':'+2');
      mostrarToast(cR.et+' de '+peR.nombre+' · anotado a las '+horaDe(Date.now()));
    }
  }
  else if(act==='cuidado-veces'){
    var cvp=val.split('|'), cv=cuidadoDe(cvp[0]);
    if(cv){
      if(!S.cuidadosCfg[cv.id]) S.cuidadosCfg[cv.id]={};
      var actualV=vecesMeta(cv);
      S.cuidadosCfg[cv.id].veces=Math.max(1, Math.min(8, actualV+Number(cvp[1])));
    }
  }
  else if(act==='cuidado-onoff'){
    if(!S.cuidadosCfg[val]) S.cuidadosCfg[val]={};
    S.cuidadosCfg[val].off=!S.cuidadosCfg[val].off;
  }
  else if(act==='iniciar-respiracion'){ iniciarRespiracion(); return; }
  else if(act==='detener-respiracion'){ detenerRespiracion(); }
  else if(act==='siguiente-aterrizaje'){ V.aterrizajePaso=(V.aterrizajePaso||0)+1; vibrar(8); }
  else if(act==='reiniciar-aterrizaje'){ V.aterrizajePaso=0; }
  else if(act==='elegir-calma'){ V.calmaVista=val; V.aterrizajePaso=0; V.relajacionPaso=0; detenerRespiracion(); }
  else if(act==='siguiente-relajacion'){ V.relajacionPaso=(V.relajacionPaso||0)+1; vibrar(8); }
  else if(act==='reiniciar-relajacion'){ V.relajacionPaso=0; }
  else if(act==='toggle-paso'){
    if(S.tareaActual){
      var p=S.tareaActual.pasos[Number(val)];
      if(p){ p.hecho=!p.hecho; guardar(); }
    }
  }
  else if(act==='cerrar-tarea'){ S.tareaActual=null; guardar(); }
  else if(act==='toggle-activos'){
    if(!S.recordatorios.activos){
      pedirPermiso().then(function(){ S.recordatorios.activos=true; guardar(); render(); });
      return;
    }
    S.recordatorios.activos=false; guardar();
  }
  else if(act==='toggle-rec'){
    if(val==='agua'){ S.recordatorios.agua.on=!S.recordatorios.agua.on; }
    else { S.recordatorios[val].on=!S.recordatorios[val].on; }
    guardar();
  }
  else if(act==='snooze'){ recordar30(val); return; }
  else if(act==='exportar'){ exportarDatos(); return; }
  else if(act==='agregar-pendiente'){
    var inpP=document.getElementById('inp-pendiente');
    var textoP=(inpP?inpP.value:'').trim();
    if(textoP){ S.pendientes.push({id:'pd'+Date.now(), texto:textoP}); V.pendienteTexto=''; guardar(); }
  }
  else if(act==='quitar-pendiente'){ S.pendientes=S.pendientes.filter(function(p){ return p.id!==val; }); guardar(); }
  else if(act==='completar-pendiente'){
    S.pendientes=S.pendientes.filter(function(p){ return p.id!==val; });
    S.contadores.pendientesResueltos=(S.contadores.pendientesResueltos||0)+1;

  else if(act==='adoptar-rutina'){
    var rs=RUTINAS_SUGERIDAS[Number(val)];
    if(rs){
      S.rutinas.push({id:'rt'+Date.now(), nombre:rs.nombre, emo:rs.emo, pasos:rs.pasos.map(function(t,i){ return {id:'p'+i, t:t}; })});
      sonidoPop(600); vibrar(10);
      mostrarToast('Rutina agregada.');
      guardar();
    }
  }
  else if(act==='quitar-rutina'){
    if(confirm('¿Quitar esta rutina? Se borra su racha de días seguidos.')){
      S.rutinas=S.rutinas.filter(function(r){ return r.id!==val; });
      guardar();

  else if(act==='agregar-paso-nueva-rutina'){
    var inpRP=document.getElementById('inp-rutina-paso');

  else if(act==='quitar-paso-nueva-rutina'){ V.rutinaPasos.splice(Number(val), 1); }
  else if(act==='crear-rutina'){
    var inpRN=document.getElementById('inp-rutina-nombre');
    var nombreR=(inpRN?inpRN.value:'').trim();
    if(nombreR && V.rutinaPasos.length){
      S.rutinas.push({id:'rt'+Date.now(), nombre:nombreR, emo:'🗺️', pasos:V.rutinaPasos.map(function(t,i){ return {id:'p'+i, t:t}; })});
      V.rutinaNombre=''; V.rutinaPasoTexto=''; V.rutinaPasos=[];
      sonidoArpegio(); vibrar([15,30,15]);
      mostrarToast('Rutina creada.');
      guardar();
    } else {
      mostrarToast(nombreR ? 'Agrega al menos un paso.' : 'Ponle un nombre primero.');
      return;
    }
  }
  else if(act==='ver-foto'){ V.verFoto=val; }
  else if(act==='cerrar-foto'){ V.verFoto=null; }
  else if(act==='quitar-foto-cat'){
    var fotosQ=fotosDeHoy();
    delete fotosQ[val];
    V.verFoto=null;
    guardar();
  }
  else if(act==='cerrar-celebracion'){ clearTimeout(celebracionTimer); V.celebracion=null; }
  else if(act==='borrar-todo'){
    if(confirm('¿Borrar todos tus datos de Ancla? No se puede deshacer.')){
      S=estadoInicial(); guardar();
    } else { return; }
  }

  if(esJuego){
    var stats=statsExtra(calcularEstadisticas());
    sincronizarMedallasGanadas(stats);
    var nuevoJg=calcularProgreso();
    var subioNivel = nuevoJg.nivel>prevJg.nivel;
    var medallaNueva=null;
    nuevoJg.medallas.forEach(function(m){
      var antes=prevJg.medallas.filter(function(x){ return x.id===m.id; })[0];
      if(!medallaNueva && m.on && antes && !antes.on) medallaNueva=m;
    });
    var nuevoCuenta=contarCategorias(entradaHoy());
    var completoAhora = nuevoCuenta>=CATS.length && prevCuenta<CATS.length;
    var rutinaCompletadaAhora=false;
    if(act==='toggle-paso-rutina' && rutinaIdActual){
      var rutAhora=S.rutinas.filter(function(r){ return r.id===rutinaIdActual; })[0];
      if(rutAhora){ rutinaCompletadaAhora = !prevRutinaCompleta && rutinaCompletaHoy(rutAhora); }
    }

    if(subioNivel){ celebrar('nivel', {titulo:S.modoSuave?'Subiste de nivel':'Nivel '+nuevoJg.nivel, sub:nuevoJg.nombre}); }
    else if(medallaNueva){ celebrar('medalla', {emo:medallaNueva.emo, titulo:'Nueva medalla', sub:medallaNueva.titulo}); }
    else if(rutinaCompletadaAhora){ celebrar('rutina', {titulo:'Rutina completa', sub:nombreRutinaActual}); }
    else if(completoAhora){ celebrar('dia', {titulo:'Día completo', sub:'Orgullo, no perfección.'}); }
  }

  guardar();
  render();
});

app.addEventListener('change', function(ev){
  var el=ev.target.closest('[data-bind]');
  if(el){
    var val = el.type==='checkbox' ? el.checked : el.value;
    if(el.dataset.num) val=Number(val);
    setPath(S, el.dataset.bind, val);
    guardar();
    render();
    return;
  }
  if((ev.target.id==='inp-foto-onboarding' || ev.target.id==='inp-foto-perfil') && ev.target.files && ev.target.files[0]){
    manejarFoto(ev.target.files[0]);
    return;
  }
  if(ev.target.id && ev.target.id.indexOf('inp-foto-cat-')===0 && ev.target.files && ev.target.files[0]){
    manejarFotoCategoria(ev.target.id.slice('inp-foto-cat-'.length), ev.target.files[0]);
    return;
  }
  if(ev.target.id && ev.target.id.indexOf('med-hora-')===0){
    var pz=ev.target.id.slice('med-hora-'.length), corte=pz.lastIndexOf('-');
    var mId=pz.slice(0,corte), idx=Number(pz.slice(corte+1));
    var mEd=(S.medicamentos||[]).filter(function(x){ return x.id===mId; })[0];
    if(mEd && ev.target.value){ mEd.horas[idx]=ev.target.value; guardar(); render(); }
    return;
  }
  if(ev.target.id==='inp-prenda-foto' && ev.target.files && ev.target.files[0]){
    manejarPrendaFoto(ev.target.files[0]);
    ev.target.value='';
    return;
  }
  if(ev.target.id==='inp-importar' && ev.target.files && ev.target.files[0]){
    importarDatos(ev.target.files[0]);
  }
});
app.addEventListener('input', function(ev){
  if(ev.target.id==='inp-ropa') V.ropaNueva=ev.target.value;
  if(ev.target.id==='inp-perra') V.perraNombre=ev.target.value;
  if(ev.target.id==='inp-med') V.medNombre=ev.target.value;
  if(ev.target.id==='inp-prenda-nombre') V.prendaNombre=ev.target.value;
  if(ev.target.id==='inp-med-dosis') V.medDosis=ev.target.value;
  if(ev.target.id==='inp-distraccion') V.distraccion=ev.target.value;
  if(ev.target.id==='inp-tarea') V.tareaTexto=ev.target.value;
  if(ev.target.id==='inp-nombre-onboarding') V.onboardingNombre=ev.target.value;
  if(ev.target.id==='inp-mini-texto') V.miniTexto=ev.target.value;
  if(ev.target.id==='inp-pendiente') V.pendienteTexto=ev.target.value;
  if(ev.target.id==='inp-rutina-nombre') V.rutinaNombre=ev.target.value;
  if(ev.target.id==='inp-rutina-paso') V.rutinaPasoTexto=ev.target.value;
});
app.addEventListener('keydown', function(ev){
  if(ev.key==='Enter'){
    if(ev.target.id==='inp-ropa'){ ev.preventDefault(); document.querySelector('[data-action="agregar-ropa"]').click(); }
    if(ev.target.id==='inp-perra'){ ev.preventDefault(); document.querySelector('[data-action="agregar-perra"]').click(); }
    if(ev.target.id==='inp-distraccion'){ ev.preventDefault(); document.querySelector('[data-action="guardar-distraccion"]').click(); }
    if(ev.target.id==='inp-tarea'){ ev.preventDefault(); document.querySelector('[data-action="dividir-tarea"]').click(); }
    if(ev.target.id==='inp-nombre-onboarding'){ ev.preventDefault(); document.querySelector('[data-action="terminar-onboarding"]').click(); }
    if(ev.target.id==='inp-mini-texto'){ ev.preventDefault(); document.querySelector('[data-action="agregar-mini"]').click(); }
    if(ev.target.id==='inp-pendiente'){ ev.preventDefault(); document.querySelector('[data-action="agregar-pendiente"]').click(); }
    if(ev.target.id==='inp-rutina-paso'){ ev.preventDefault(); document.querySelector('[data-action="agregar-paso-nueva-rutina"]').click(); }
  }
});

function exportarDatos(){
  var blob=new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='ancla-datos-'+hoyISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  mostrarToast('Descargando tu copia…');
}
function importarDatos(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var nuevo=JSON.parse(reader.result);
      if(nuevo && nuevo.entradas){
        if(confirm('Esto va a reemplazar los datos actuales de este dispositivo con los del archivo. ¿Seguir?')){
          S=nuevo; guardar(); render(); mostrarToast('Datos importados.');
        }
      } else { mostrarToast('Ese archivo no parece ser de Ancla.'); }
    }catch(e){ mostrarToast('No se pudo leer el archivo.'); }
  };
  reader.readAsText(file);
}

aplicarTema();
registrarApertura();
podarFotosViejas();
podarEventos();
if(S.enfoque && S.enfoque.activa) arrancarRelojEnfoque();
revisarRecordatorios();
setInterval(revisarRecordatorios, 30000);
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

})();
