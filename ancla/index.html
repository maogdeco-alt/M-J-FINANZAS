<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ancla</title>
<meta name="description" content="Un ancla para los días donde todo cuesta.">
<meta name="theme-color" content="#0e7c86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ancla">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<style>
:root{
  --bg:#f7f2ea; --card:#ffffff; --ink:#1f2a2e; --sub:#5b6b70; --teal:#0e7c86; --teal-d:#0b616a;
  --coral:#ff8a65; --mint:#d7f0e6; --mint-ink:#0b4a3e; --line:#e7ddcf; --warn:#b3441e;
  --radius:20px; --radius-s:13px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1719; --card:#182426; --ink:#eef4f3; --sub:#a3b5b9; --teal:#2bbcc9; --teal-d:#1f8f9a;
    --coral:#ff9d7a; --mint:#123f34; --mint-ink:#a9e8d6; --line:#25373b; --warn:#ffb199;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  min-height:100vh;
}
button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer}
button:active{transform:scale(.96)}
input, select, textarea{font-family:inherit; color:inherit}
h1,h2,h3,p{margin:0}
.envolt{max-width:540px; margin:0 auto; padding:18px 16px 6px}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 4px}
.marca-row{display:flex; align-items:center; gap:8px}
.marca{font-weight:800; font-size:22px; letter-spacing:.2px; color:var(--teal-d)}
@media (prefers-color-scheme:dark){ .marca{color:var(--teal)} }
.beta-tag{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; background:var(--coral); color:#fff; padding:2px 7px; border-radius:20px}
.topbar-der{display:flex; align-items:center; gap:10px}
.fecha{font-size:12.5px; color:var(--sub); text-transform:capitalize}
.saludo-nombre{font-size:14px; color:var(--sub); font-weight:600; margin:2px 2px 10px}

.card{background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); border:1px solid var(--line)}
.card h3{font-size:15px; margin-bottom:4px}
.sub{color:var(--sub); font-size:13px; line-height:1.5}

.banner{background:var(--mint); color:var(--mint-ink); border-radius:var(--radius-s); padding:13px 14px; margin-bottom:14px; font-size:13.5px; line-height:1.5; display:flex; gap:10px; align-items:flex-start}
.banner .acciones{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.banner .acciones button{background:var(--mint-ink); color:var(--mint); padding:7px 12px; border-radius:20px; font-size:12.5px; font-weight:600}

.boya-wrap{display:flex; align-items:center; gap:16px}
.boya-ring-wrap{position:relative; width:84px; height:84px; flex:none}
.boya-ring{position:absolute; inset:0; transform:rotate(-90deg)}
.ring-bg{fill:none; stroke:var(--line); stroke-width:6}
.ring-fg{fill:none; stroke:var(--coral); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .5s ease}
.boya{position:absolute; inset:5px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; background:linear-gradient(160deg, var(--teal), var(--teal-d)); box-shadow:0 4px 14px rgba(14,124,134,.35); transition:transform .15s}
.boya svg{width:88%; height:88%; animation:bamboleo 3.4s ease-in-out infinite}
@keyframes bamboleo{ 0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-3px) rotate(1.5deg)} }
.ojo-parpadeo{animation:parpadeo 5.5s ease-in-out infinite}
@keyframes parpadeo{ 0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)} }
.boya-txt{flex:1; min-width:0}
.boya-txt .titulo{font-weight:700; font-size:15.5px; margin-bottom:2px}
.boya-txt .sub{font-size:13px}
.ver-boya-link{font-size:12px; font-weight:700; color:var(--teal-d); margin-top:4px; display:inline-block}
@media (prefers-color-scheme:dark){ .ver-boya-link{color:var(--teal)} }

.conchitas-chip{display:flex; align-items:center; gap:4px; background:var(--mint); color:var(--mint-ink); font-weight:700; font-size:12.5px; padding:5px 10px; border-radius:20px; transition:transform .15s}
.conchitas-chip.pulso{animation:pulso-conchita .4s ease}
@keyframes pulso-conchita{ 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }

.boya-panel-header{display:flex; align-items:center; gap:10px; margin-bottom:16px}
.boya-panel-header button{font-size:14px; font-weight:700; color:var(--teal-d); display:flex; align-items:center; gap:4px}
@media (prefers-color-scheme:dark){ .boya-panel-header button{color:var(--teal)} }
.boya-retrato-wrap{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px}
.boya-retrato{position:relative; width:150px; height:150px; border-radius:50%; overflow:hidden; background:linear-gradient(160deg, var(--teal), var(--teal-d)); box-shadow:0 8px 24px rgba(14,124,134,.3)}
.boya-retrato svg{width:88%; height:88%; position:absolute; left:6%; top:6%; animation:bamboleo 3.4s ease-in-out infinite}
.boya-nombre-fila{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px}
.boya-nombre-fila input{font-size:19px; font-weight:800; text-align:center; border:none; background:none; color:var(--ink); width:auto; max-width:200px; border-bottom:1.5px dashed var(--line); padding:2px 4px}
.vinculo-barra{margin-top:14px; width:100%}
.subtabs{display:flex; gap:8px; margin:16px 0 14px; background:var(--bg); padding:4px; border-radius:20px}
.subtabs button{flex:1; padding:9px; border-radius:16px; font-size:13px; font-weight:700; color:var(--sub)}
.subtabs button.act{background:var(--card); color:var(--teal-d); box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){ .subtabs button.act{color:var(--teal)} }
.tienda-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.tienda-item{background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:14px 10px; text-align:center}
.tienda-item .emo{font-size:28px}
.tienda-item .nom{font-size:12.5px; font-weight:700; margin-top:6px}
.tienda-item .precio{font-size:12px; color:var(--sub); margin-top:2px}
.tienda-item button{margin-top:10px; width:100%; padding:8px; border-radius:14px; font-size:12px; font-weight:700; background:var(--coral); color:#fff}
.tienda-item button:disabled{background:var(--line); color:var(--sub)}
.tienda-item.puesto{border-color:var(--teal); background:var(--mint)}
.tienda-item .candado{font-size:10.5px; color:var(--sub); margin-top:8px}

.respirar-circulo-wrap{display:flex; flex-direction:column; align-items:center; padding:30px 10px 10px}
.respirar-circulo{width:190px; height:190px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--teal), var(--teal-d)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; font-weight:700; transition:transform 4s ease-in-out; box-shadow:0 10px 34px rgba(14,124,134,.35)}
.respirar-circulo.chico{transform:scale(.72)}
.respirar-circulo.grande{transform:scale(1)}
.aterrizaje-paso{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-s); padding:20px; text-align:center; margin-top:16px}
.aterrizaje-paso .num{font-size:12px; color:var(--sub); font-weight:700; margin-bottom:8px}
.aterrizaje-paso .txt{font-size:16px; font-weight:600; line-height:1.5}

.grid-cats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:16px}
@media(min-width:420px){.grid-cats{grid-template-columns:repeat(4,1fr)}}
.cat{background:var(--bg); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:14px 8px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; transition:all .12s}
.cat .emo{font-size:26px; line-height:1}
.cat .et{font-size:11.5px; font-weight:600; color:var(--sub)}
.cat.on{background:var(--mint); border-color:var(--teal)}
.cat.on .et{color:var(--mint-ink)}
.cat .badge-n{font-size:10.5px; font-weight:700; background:var(--teal); color:#fff; border-radius:20px; padding:1px 7px; margin-top:-2px}
.cat.on .badge-n{background:var(--teal-d)}
.agua-row{display:flex; align-items:center; justify-content:center; gap:4px; margin-top:2px}
.agua-row button{width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.08); font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center}

.nivel-card{background:linear-gradient(160deg, var(--teal-d), var(--teal)); color:#fff; border-radius:var(--radius); padding:18px; margin-bottom:14px}
.nivel-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.nivel-top .l{font-weight:700; font-size:15px}
.nivel-top .l span{display:block; font-weight:400; font-size:12.5px; opacity:.85; margin-top:2px}
.nivel-top .r{font-size:14px; font-weight:700; text-align:right; white-space:nowrap}
.nivel-top .r span{display:block; font-weight:400; font-size:11px; opacity:.85}
.bar{background:rgba(255,255,255,.18); height:8px; border-radius:20px; margin-top:14px; overflow:hidden}
.bar i{display:block; height:100%; background:#fff; border-radius:20px; transition:width .5s ease}
.medallas-mini{display:flex; gap:8px; margin-top:14px; align-items:center}
.medallas-mini span{font-size:19px; opacity:.5}
.medallas-mini span.on{opacity:1}
.medallas-mini button{margin-left:auto; font-size:12px; font-weight:600; background:rgba(255,255,255,.16); padding:5px 10px; border-radius:20px}

.medallas-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px}
@media(max-width:380px){.medallas-grid{grid-template-columns:repeat(4,1fr)}}
.medalla{background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:10px 4px; text-align:center; font-size:22px; opacity:.35}
.medalla.on{opacity:1; background:var(--mint)}
.medalla-desc{font-size:10.5px; color:var(--sub); margin-top:12px; line-height:1.5}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:13px 18px; border-radius:30px; font-weight:700; font-size:14.5px}
.btn-principal{background:var(--coral); color:#fff; width:100%}
.btn-fantasma{background:var(--bg); border:1.5px solid var(--line); color:var(--ink)}
.btn-chico{padding:8px 14px; font-size:12.5px; border-radius:20px}

.fila-input{display:flex; gap:8px}
.fila-input input[type=text]{flex:1; padding:12px 14px; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px}

.ropa-lista{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.ropa-item{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:12px; padding:10px 12px; font-size:13.5px}
.ropa-item .t{flex:1}
.ropa-item button{color:var(--warn); font-size:16px; padding:2px 4px}
.elegida{background:var(--mint); color:var(--mint-ink); border-radius:var(--radius-s); padding:20px; text-align:center; margin-top:14px}
.elegida .grande{font-size:19px; font-weight:800; margin:6px 0 14px}

.pasos{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.paso{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:12px; padding:12px 13px; font-size:13.5px}
.paso .c{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:12px}
.paso.hecho{opacity:.5}
.paso.hecho .c{background:var(--teal); border-color:var(--teal); color:#fff}
.paso.hecho .t{text-decoration:line-through}

.campo-fila{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.campo-fila:last-child{margin-bottom:0}
.campo-fila .l{font-size:14px; font-weight:600}
.campo-fila input[type=time]{border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:7px 9px; font-size:13.5px}
.campo-fila select{border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:7px 9px; font-size:13.5px}

.switch{position:relative; width:44px; height:26px; flex:none; border-radius:20px; background:var(--line); transition:.15s}
.switch i{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--teal)}
.switch.on i{transform:translateX(18px)}
.switch-wrap{display:flex; align-items:center; gap:10px}

.pendientes{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.pendientes button{background:var(--bg); border:1.5px solid var(--line); border-radius:20px; padding:8px 13px; font-size:12.5px; display:flex; align-items:center; gap:6px}

.aviso-permiso{background:#fff3ea; color:#7a4a1e; border-radius:var(--radius-s); padding:12px 14px; font-size:12.5px; margin-bottom:14px; line-height:1.5}
@media (prefers-color-scheme:dark){ .aviso-permiso{background:#2c2115; color:#f0c896} }

.nav{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:10}
.nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:12px; color:var(--sub); font-size:10.5px; font-weight:600}
.nav button .ic{font-size:20px}
.nav button.act{color:var(--teal-d)}
@media (prefers-color-scheme:dark){ .nav button.act{color:var(--teal)} }

.toast{position:fixed; left:16px; right:16px; bottom:calc(88px + env(safe-area-inset-bottom)); max-width:508px; margin:0 auto; background:var(--ink); color:var(--bg); padding:13px 16px; border-radius:14px; font-size:13.5px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:20}

.acerca p{margin-bottom:10px; font-size:13.5px; line-height:1.6; color:var(--sub)}
.acerca p:last-child{margin-bottom:0}
.danger-btn{color:var(--warn); font-size:13px; font-weight:600}
hr.sep{border:none; border-top:1px solid var(--line); margin:16px 0}
.file-fake{display:inline-block}

.avatar-picker{width:84px; height:84px; border-radius:50%; background:var(--bg); border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; font-size:26px; flex:none}
.avatar-picker img{width:100%; height:100%; object-fit:cover}
.avatar-chip{width:34px; height:34px; border-radius:50%; overflow:hidden; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none}
.avatar-chip img{width:100%; height:100%; object-fit:cover}
.input-nombre{width:100%; padding:13px 16px; border-radius:30px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-size:15px; text-align:center}
.onboarding{padding-top:26px; padding-bottom:26px}

.emoji-pick{display:flex; flex-wrap:wrap; gap:6px}
.emoji-op{width:38px; height:38px; border-radius:50%; background:var(--bg); border:1.5px solid var(--line); font-size:18px; display:flex; align-items:center; justify-content:center}
.emoji-op.sel{border-color:var(--teal); background:var(--mint)}

.puntos-flot{position:fixed; transform:translate(-50%,0); font-weight:800; font-size:16px; color:var(--coral); pointer-events:none; z-index:50; animation:flotar .9s ease forwards}
@keyframes flotar{ 0%{opacity:0; transform:translate(-50%,0) scale(.7)} 15%{opacity:1; transform:translate(-50%,-8px) scale(1.15)} 100%{opacity:0; transform:translate(-50%,-48px) scale(1)} }

.confeti-cont{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden}
.confeti-pieza{position:absolute; top:-10px; width:8px; height:14px; border-radius:2px; animation-name:caer; animation-timing-function:ease-in; animation-fill-mode:forwards}
@keyframes caer{ 0%{transform:translateY(0) rotate(0deg); opacity:1} 100%{transform:translateY(112vh) rotate(420deg); opacity:0} }

.overlay-celebracion{position:fixed; inset:0; background:rgba(15,23,25,.55); display:flex; align-items:center; justify-content:center; z-index:55; padding:24px; animation:aparecer .2s ease}
@keyframes aparecer{ from{opacity:0} to{opacity:1} }
.tarjeta-celebracion{background:var(--card); border-radius:24px; padding:34px 26px; text-align:center; max-width:320px; box-shadow:0 12px 40px rgba(0,0,0,.3); animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{ 0%{transform:scale(.7); opacity:0} 100%{transform:scale(1); opacity:1} }
.cel-emo{font-size:52px; margin-bottom:10px}
.cel-titulo{font-weight:800; font-size:19px; margin-bottom:6px}
.cel-sub{color:var(--sub); font-size:13.5px; line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var VERSION='0.3.0-beta';

/* ===================== utilidades ===================== */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hoyISO(){ return toISO(new Date()); }
function horaMin(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function normalizar(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function getPath(obj, path){ return path.split('.').reduce(function(o,k){ return (o===undefined||o===null) ? o : o[k]; }, obj); }
function setPath(obj, path, val){
  var partes=path.split('.'), o=obj;
  for(var i=0;i<partes.length-1;i++){ o=o[partes[i]]; }
  o[partes[partes.length-1]]=val;
}
function esc(s){
  return (s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function saludo(){
  var h=new Date().getHours();
  if(h<12) return 'Buenos días';
  if(h<19) return 'Buenas tardes';
  return 'Buenas noches';
}

/* ===================== datos ===================== */
var CLAVE='ancla_datos_v1';
var CATS=[
  {id:'desayuno', emo:'🍳', et:'Desayuno'},
  {id:'almuerzo', emo:'🍽️', et:'Almuerzo'},
  {id:'cena', emo:'🌙', et:'Cena'},
  {id:'agua', emo:'💧', et:'Agua', contable:true},
  {id:'ducha', emo:'🚿', et:'Aseo'},
  {id:'bano', emo:'🚽', et:'Baño'},
  {id:'mover', emo:'🏃', et:'Moverme'},
  {id:'dormir', emo:'😴', et:'Dormí'}
];
var NIVELES=['Semilla','Brote','Raíz firme','Tallo alto','Copa abierta','Bosque entero'];
var EMOJIS_MINI=['💊','🌱','📞','🧴','🧘','📚','🧺','🔋','❤️','🐾','🎯','🧠'];
var NIVELES_VINCULO=['Recién se conocen','Se van conociendo','Cómplices','Un equipo','Inseparables'];
var DESC_VINCULO=[
  'Boya todavía te está conociendo. Cada toque suma.',
  'Ya empieza a reconocer tu ritmo — los días buenos y los difíciles.',
  'Boya te acompaña sin juzgar ni un día malo. Confía en ti.',
  'Ya son un equipo — ella nota hasta cuando vuelves después de un tiempo.',
  'Inseparables. Pase lo que pase, Boya sigue aquí, a tu ritmo.'
];

var ITEMS_BOYA=[
  {id:'gorro_lana', tipo:'sombrero', nombre:'Gorro de lana', emo:'🧶', precio:15, vinculoMin:0},
  {id:'sombrero_paja', tipo:'sombrero', nombre:'Sombrero de paja', emo:'👒', precio:20, vinculoMin:0},
  {id:'corona', tipo:'sombrero', nombre:'Corona chiquita', emo:'👑', precio:60, vinculoMin:3},
  {id:'gafas_sol', tipo:'gafas', nombre:'Gafas de sol', emo:'🕶️', precio:18, vinculoMin:0},
  {id:'gafas_redondas', tipo:'gafas', nombre:'Gafas redondas', emo:'👓', precio:22, vinculoMin:1},
  {id:'bufanda', tipo:'cuello', nombre:'Bufanda', emo:'🧣', precio:16, vinculoMin:0},

/* ===================== cálculos del juego ===================== */
function contarCategorias(e){
  if(!e) return 0;
  var n=0;
  ['desayuno','almuerzo','cena','ducha','bano','mover','dormir'].forEach(function(k){ if(e[k]) n++; });
  if(e.agua>0) n++;
  return n;
}
var UMBRAL_DIA=3;

function calcularRacha(){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var streak=0, saltos=1, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var cuenta=contarCategorias(S.entradas[iso]);
    var esHoy=(cursor.getTime()===hoy.getTime());
    if(cuenta>=UMBRAL_DIA){ streak++; }
    else if(esHoy){ /* hoy no cuenta en contra, todavía no termina */ }
    else if(saltos>0){ saltos--; }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function calcularConsecutivos(campo){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var n=0, cursor=new Date(hoy), vueltas=0;
  while(vueltas<370){
    vueltas++;
    var iso=toISO(cursor);
    var e=S.entradas[iso];
    var esHoy=(cursor.getTime()===hoy.getTime());
    var val = campo==='agua' ? (e && e.agua>0) : (e && e[campo]);
    if(val){ n++; }
    else if(esHoy){ /* hoy aún no cuenta en contra */ }
    else{ break; }
    cursor.setDate(cursor.getDate()-1);
  }
  return n;
}
function detectarRegreso(){
  var dias=Object.keys(S.entradas).filter(function(k){ return contarCategorias(S.entradas[k])>0; }).sort();
  for(var i=1;i<dias.length;i++){
    var a=new Date(dias[i-1]+'T00:00:00'), b=new Date(dias[i]+'T00:00:00');
    var gap=Math.round((b-a)/86400000);
    if(gap>=3) return true;
  }
  return false;
}

function calcularEstadisticas(){
  var totalBool=0, totalAgua=0, desayunos=0, moverTotal=0, dormirTotal=0, aguaMaxDia=0;
  Object.keys(S.entradas).forEach(function(k){
    var e=S.entradas[k];
    ['desayuno','almuerzo','cena','ducha','bano','mover','dormir'].forEach(function(c){ if(e[c]) totalBool++; });
    totalAgua += (e.agua||0);
    if(e.desayuno) desayunos++;
    if(e.mover) moverTotal++;
    if(e.dormir) dormirTotal++;
    if(e.agua>aguaMaxDia) aguaMaxDia=e.agua;
  });
  return {
    totalBool:totalBool, totalAgua:totalAgua, desayunos:desayunos, moverTotal:moverTotal, dormirTotal:dormirTotal,
    aguaMaxDia:aguaMaxDia, racha:calcularRacha(), duchaSeguidos:calcularConsecutivos('ducha'),
    ropaUsos:S.contadores.ropaUsos||0, tareasUsos:S.contadores.tareasUsos||0, miniToques:S.contadores.miniToques||0,
    volviste:detectarRegreso()

}

    return {id:m.id, emo:m.emo, titulo:m.titulo, desc:m.desc, on:(m.cumple || yaGanadas.indexOf(m.id)>=0)};
  });
  var pts = stats.totalBool*3 + stats.totalAgua*1 + stats.racha*5 + stats.ropaUsos*2 + stats.tareasUsos*4 + stats.miniToques*2;
  var nivel=Math.min(NIVELES.length, Math.floor(Math.sqrt(pts/40))+1);
  var sigue=Math.pow(nivel,2)*40, previo=Math.pow(nivel-1,2)*40;
  var esMax=nivel>=NIVELES.length;
  return {
    pts:pts, nivel:nivel, nombre:NIVELES[nivel-1], esMax:esMax,
    prog: esMax ? 100 : Math.max(0, Math.min(100, Math.round((pts-previo)/(sigue-previo)*100))),
    faltan: esMax ? 0 : Math.max(0, sigue-pts),
    racha:stats.racha, medallas:medallas, ganadas:medallas.filter(function(m){ return m.on; }).length
  };

/* ===================== sonido, vibración, confeti, puntos flotantes ===================== */
var audioCtx=null;
function obtenerAudioCtx(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function tono(freq, inicio, dur){
  if(S.efectos===false) return;
  var ctx=obtenerAudioCtx(); if(!ctx) return;
  try{
    var t0=ctx.currentTime+inicio;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function sonidoPop(freq){ tono(freq||660, 0, 0.16); }
function sonidoArpegio(){ tono(523,0,0.14); tono(659,0.09,0.14); tono(784,0.18,0.22); }
function vibrar(patron){
  if(S.efectos===false) return;
  if(navigator.vibrate){ try{ navigator.vibrate(patron); }catch(e){} }
}
function flotarPuntos(origenEl, texto){
  if(!origenEl || !texto) return;
  var r=origenEl.getBoundingClientRect();
  var el=document.createElement('div');
  el.className='puntos-flot';
  el.textContent=texto;
  el.style.left=(r.left+r.width/2)+'px';
  el.style.top=(r.top)+'px';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 950);
}
function lanzarConfeti(n){
  var cont=document.createElement('div');
  cont.className='confeti-cont';
  var colores=['#0e7c86','#ff8a65','#ffd166','#06d6a0','#ef476f'];
  for(var i=0;i<n;i++){
    var s=document.createElement('span');
    s.className='confeti-pieza';
    s.style.left=(Math.random()*100)+'%';
    s.style.background=colores[i%colores.length];
    s.style.animationDelay=(Math.random()*0.25)+'s';
    s.style.animationDuration=(1.1+Math.random()*0.9)+'s';
    s.style.transform='rotate('+(Math.random()*360)+'deg)';
    cont.appendChild(s);
  }
  document.body.appendChild(cont);
  setTimeout(function(){ cont.remove(); }, 2300);
}

var BONO_CONCHITAS={ nivel:10, medalla:8, dia:5 };
function celebrar(tipo, datos){
  clearTimeout(celebracionTimer);
  var obj={tipo:tipo};
  for(var k in datos){ obj[k]=datos[k]; }
  if(BONO_CONCHITAS[tipo]){ ganarConchitas(BONO_CONCHITAS[tipo]); obj.sub=(obj.sub?obj.sub+' · ':'')+'🐚 +'+BONO_CONCHITAS[tipo]; }
  V.celebracion=obj;

function manejarFoto(file){
  if(!file || file.type.indexOf('image/')!==0) return;
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var tam=160;
      var canvas=document.createElement('canvas');
      canvas.width=tam; canvas.height=tam;
      var ctx=canvas.getContext('2d');
      var lado=Math.min(img.width, img.height);
      var sx=(img.width-lado)/2, sy=(img.height-lado)/2;
      ctx.drawImage(img, sx, sy, lado, lado, 0, 0, tam, tam);
      try{ S.usuario.foto=canvas.toDataURL('image/jpeg', 0.82); }catch(e){}
      guardar(); render();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function revisarRecordatorios(){
  if(!S.recordatorios.activos) return;
  var ahora=new Date(), hm=horaMin(ahora), hoy=hoyISO();
  ['desayuno','almuerzo','cena','dormir'].forEach(function(k){
    var r=S.recordatorios[k];
    if(r && r.on && r.hora===hm && S.recordatorios.ultimoAviso[k]!==hoy){
      notificar(TEXTOS_REC[k][0], TEXTOS_REC[k][1]);
      S.recordatorios.ultimoAviso[k]=hoy; guardar();

  });
  var ag=S.recordatorios.agua;
  if(ag && ag.on){

      ag.ultimoMs=Date.now(); guardar();

}

/* ===================== ropa ===================== */
function elegirRopa(){
  var candidatos=S.ropa.slice();
  if(candidatos.length===0) return null;
  candidatos.sort(function(a,b){
    var ua=a.ultimoUso||''; var ub=b.ultimoUso||'';
    return ua<ub ? -1 : ua>ub ? 1 : 0;
  });
  var mitad=Math.max(1, Math.ceil(candidatos.length/2));
  var top=candidatos.slice(0, mitad);
  return top[Math.floor(Math.random()*top.length)];
}

/* ===================== interacción ===================== */
function toggleCategoria(id){
  var e=entradaHoy();
  e[id]=!e[id];
  guardar();
}
function cambiarAgua(delta){
  var e=entradaHoy();
  e.agua=Math.max(0, (e.agua||0)+delta);
  guardar();
}

var ACCIONES_JUEGO=['toggle-cat','agua-mas','agua-menos','toggle-mini','elegir-ropa','dividir-tarea'];

app.addEventListener('click', function(ev){
  var b=ev.target.closest('[data-action]');
  if(!b) return;
  var act=b.dataset.action, val=b.dataset.value;

  var esJuego = ACCIONES_JUEGO.indexOf(act)>=0;
  var prevCuenta = esJuego ? contarCategorias(entradaHoy()) : 0;
  var prevJg = esJuego ? calcularProgreso() : null;

  if(act==='nav'){ V.tab=val; V.mostrarMedallas=false; }
  else if(act==='toggle-cat'){
    toggleCategoria(val);
    if(entradaHoy()[val]){ flotarPuntos(b, S.modoSuave?'✨':'+3'); sonidoPop(660); vibrar(12); ganarConchitas(1); }
  }
  else if(act==='agua-mas'){
    cambiarAgua(1);
    flotarPuntos(b, S.modoSuave?'✨':'+1'); sonidoPop(720); vibrar(10); ganarConchitas(1);
  }
  else if(act==='agua-menos'){ cambiarAgua(-1); }
  else if(act==='tocar-boya'){
    S.contadores.tocarBoyaTotal=(S.contadores.tocarBoyaTotal||0)+1;
    sonidoPop(540); vibrar(8);
    mostrarToast(MENSAJES_BOYA[Math.floor(Math.random()*MENSAJES_BOYA.length)]);
    guardar();
    return;
  }
  else if(act==='ver-medallas'){ V.mostrarMedallas=!V.mostrarMedallas; }
  else if(act==='activar-suave'){ S.modoSuave=true; S.nudgeVisto=hoyISO(); guardar(); }
  else if(act==='descartar-nudge'){ S.nudgeVisto=hoyISO(); guardar(); }
  else if(act==='toggle-modo-suave'){ S.modoSuave=!S.modoSuave; guardar(); }
  else if(act==='toggle-efectos'){ S.efectos=(S.efectos===false); guardar(); }
  else if(act==='terminar-onboarding'){
    var inpN=document.getElementById('inp-nombre-onboarding');
    S.usuario.nombre=(inpN?inpN.value:'').trim();
    S.onboardingVisto=true; guardar();
    celebrar('bienvenida', {titulo:'Listo'+(S.usuario.nombre?', '+S.usuario.nombre:'')+' 🎉', sub:'Cuando quieras, tocá lo que ya hiciste hoy.'});
  }
  else if(act==='saltar-onboarding'){
    S.onboardingVisto=true; guardar();
    celebrar('bienvenida', {titulo:'Listo 🎉', sub:'Cuando quieras, tocá lo que ya hiciste hoy.'});
  }
  else if(act==='quitar-foto'){ S.usuario.foto=null; guardar(); }
  else if(act==='agregar-ropa'){
    var inp=document.getElementById('inp-ropa');
    var texto=(inp?inp.value:'').trim();
    if(texto){ S.ropa.push({id:'r'+Date.now(), texto:texto, ultimoUso:null}); V.ropaNueva=''; guardar(); }
  }
  else if(act==='quitar-ropa'){
    S.ropa=S.ropa.filter(function(r){ return r.id!==val; });
    if(S.ropaHoy && S.ropaHoy.id===val) S.ropaHoy=null;
    guardar();
  }
  else if(act==='elegir-ropa'){
    var elegido=elegirRopa();
    if(elegido){
      elegido.ultimoUso=hoyISO();
      S.contadores.ropaUsos=(S.contadores.ropaUsos||0)+1;
      S.ropaHoy={id:elegido.id, fecha:hoyISO()};
      sonidoPop(600); vibrar(10); ganarConchitas(1);
      guardar();
    }
  }
  else if(act==='elegir-mini-emo'){ V.miniEmo=val; }
  else if(act==='agregar-mini'){
    var inpM=document.getElementById('inp-mini-texto');
    var texto=(inpM?inpM.value:'').trim();
    if(texto){
      S.miniRecordatorios.push({id:'m'+Date.now(), emo:V.miniEmo||'📌', texto:texto});
      V.miniTexto=''; V.miniEmo='📌'; guardar();
    }
  }
  else if(act==='quitar-mini'){
    S.miniRecordatorios=S.miniRecordatorios.filter(function(m){ return m.id!==val; });
    guardar();
  }
  else if(act==='toggle-mini'){
    var extra=extraDeHoy();
    extra[val]=!extra[val];
    if(extra[val]){
      S.contadores.miniToques=(S.contadores.miniToques||0)+1;
      flotarPuntos(b, S.modoSuave?'✨':'+2'); sonidoPop(760); vibrar(12); ganarConchitas(1);
    }
    guardar();
  }
  else if(act==='dividir-tarea'){
    var inpT=document.getElementById('inp-tarea');
    var texto=(inpT?inpT.value:'').trim();
    if(texto){
      S.tareaActual=dividirTarea(texto);
      S.contadores.tareasUsos=(S.contadores.tareasUsos||0)+1;
      V.tareaTexto=''; sonidoPop(600); vibrar(10); ganarConchitas(1); guardar();
    }
  }
  else if(act==='subtab-boya'){ V.subtabBoya=val; }
  else if(act==='comprar-item'){
    var art=ITEMS_BOYA.filter(function(x){return x.id===val;})[0];
    var vinc=calcularVinculo();
    if(art && S.comprados.indexOf(art.id)===-1 && (S.conchitas||0)>=art.precio && vinc.nivel>=art.vinculoMin){
      S.conchitas-=art.precio;
      S.comprados.push(art.id);
      S.equipado[art.tipo]=art.id;
      S.contadores.comprasTotal=(S.contadores.comprasTotal||0)+1;
      sonidoArpegio(); vibrar([20,30,20]);
      mostrarToast((S.boya.nombre||'Boya')+' ya tiene '+art.nombre.toLowerCase()+' 🎉');
    }
  }
  else if(act==='equipar-item'){
    var art2=ITEMS_BOYA.filter(function(x){return x.id===val;})[0];
    if(art2){
      S.equipado[art2.tipo] = (S.equipado[art2.tipo]===art2.id) ? null : art2.id;
      sonidoPop(600); vibrar(10);
    }
  }
  else if(act==='iniciar-respiracion'){ iniciarRespiracion(); return; }
  else if(act==='detener-respiracion'){ detenerRespiracion(); }
  else if(act==='siguiente-aterrizaje'){ V.aterrizajePaso=(V.aterrizajePaso||0)+1; vibrar(8); }
  else if(act==='reiniciar-aterrizaje'){ V.aterrizajePaso=0; }
  else if(act==='toggle-paso'){
    if(S.tareaActual){
      var p=S.tareaActual.pasos[Number(val)];
      if(p){ p.hecho=!p.hecho; guardar(); }
    }
  }
  else if(act==='cerrar-tarea'){ S.tareaActual=null; guardar(); }
  else if(act==='toggle-activos'){
    if(!S.recordatorios.activos){
      pedirPermiso().then(function(){ S.recordatorios.activos=true; guardar(); render(); });
      return;
    }
    S.recordatorios.activos=false; guardar();
  }
  else if(act==='toggle-rec'){
    if(val==='agua'){ S.recordatorios.agua.on=!S.recordatorios.agua.on; }
    else { S.recordatorios[val].on=!S.recordatorios[val].on; }
    guardar();
  }
  else if(act==='snooze'){ recordar30(val); return; }
  else if(act==='exportar'){ exportarDatos(); return; }
  else if(act==='cerrar-celebracion'){ clearTimeout(celebracionTimer); V.celebracion=null; }
  else if(act==='borrar-todo'){
    if(confirm('¿Borrar todos tus datos de Ancla? No se puede deshacer.')){
      S=estadoInicial(); guardar();
    } else { return; }
  }

  if(esJuego){
    var stats=calcularEstadisticas();
    sincronizarMedallasGanadas(stats);
    var nuevoJg=calcularProgreso();
    var subioNivel = nuevoJg.nivel>prevJg.nivel;
    var medallaNueva=null;
    nuevoJg.medallas.forEach(function(m){
      var antes=prevJg.medallas.filter(function(x){ return x.id===m.id; })[0];
      if(!medallaNueva && m.on && antes && !antes.on) medallaNueva=m;
    });
    var nuevoCuenta=contarCategorias(entradaHoy());
    var completoAhora = nuevoCuenta>=CATS.length && prevCuenta<CATS.length;

    if(subioNivel){ celebrar('nivel', {titulo:S.modoSuave?'Subiste de nivel':'Nivel '+nuevoJg.nivel, sub:nuevoJg.nombre}); }
    else if(medallaNueva){ celebrar('medalla', {emo:medallaNueva.emo, titulo:'Nueva medalla', sub:medallaNueva.titulo}); }
    else if(completoAhora){ celebrar('dia', {titulo:'Día completo', sub:'Orgullo, no perfección.'}); }
  }

  guardar();
  render();
});

    manejarFoto(ev.target.files[0]);

  if(ev.key==='Enter'){
    if(ev.target.id==='inp-ropa'){ ev.preventDefault(); document.querySelector('[data-action="agregar-ropa"]').click(); }
    if(ev.target.id==='inp-tarea'){ ev.preventDefault(); document.querySelector('[data-action="dividir-tarea"]').click(); }
    if(ev.target.id==='inp-nombre-onboarding'){ ev.preventDefault(); document.querySelector('[data-action="terminar-onboarding"]').click(); }
    if(ev.target.id==='inp-mini-texto'){ ev.preventDefault(); document.querySelector('[data-action="agregar-mini"]').click(); }
  }
});

function exportarDatos(){
  var blob=new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='ancla-datos-'+hoyISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  mostrarToast('Descargando tu copia…');
}
function importarDatos(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var nuevo=JSON.parse(reader.result);
      if(nuevo && nuevo.entradas){
        if(confirm('Esto va a reemplazar los datos actuales de este dispositivo con los del archivo. ¿Seguir?')){
          S=nuevo; guardar(); render(); mostrarToast('Datos importados.');
        }
      } else { mostrarToast('Ese archivo no parece ser de Ancla.'); }
    }catch(e){ mostrarToast('No se pudo leer el archivo.'); }
  };
  reader.readAsText(file);
}

/* ===================== arranque ===================== */
registrarApertura();
revisarRecordatorios();
setInterval(revisarRecordatorios, 30000);
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

})();
</script>
